"related": ["乌丑", "极阴祖师", "神风舟", "玄阴大法"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "木龙碑", "category": "法宝宝物", "tagline": "妙音门镇门护宗之宝", "desc": "妙音门的镇门之宝，具有护持之力。极阴祖师现身、赤火老怪倒戈后，紫灵正是依靠木龙碑的护持才得以逃脱。", "first_ep": 84, "realm": "", "faction": "", "related": ["紫灵", "妙音门", "极阴祖师"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "血灵钻", "category": "法宝宝物", "tagline": "洞穿法器防御的血道利器", "desc": "越皇以护体血光和血灵钻作战，血灵钻曾洞穿韩立的两件法器与剑盾，击伤其右肩。遗址中，脱离韩立控制的曲魂也曾用血灵钻刺穿韩立。", "first_ep": 45, "realm": "", "faction": "", "related": ["越皇", "曲魂", "韩立", "罗烟步", "混元钵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "青火雷", "category": "法宝宝物", "tagline": "青阳门耗时秘制的强威雷火", "desc": "青阳门秘制宝物，所需材料稀少、炼制耗时很长，威力可与元婴修士的火焰相当。元瑶曾以三枚青火雷作酬劳，又借它冲破金光脱身；蛮胡子认出这是三阳老魔之物。", "first_ep": 106, "realm": "", "faction": "", "related": ["元瑶", "蛮胡子", "啼魂兽", "拘灵阵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "五行环", "category": "法宝宝物", "tagline": "韩立用于困宝御敌的古宝", "desc": "韩立持有的古宝，既能困住敌方法宝，也可用于抵挡攻击。它曾被乾蓝冰焰冻住而脱落，最终遭温天仁的金光镜碾成粉末。", "first_ep": 117, "realm": "", "faction": "", "related": ["韩立", "云天啸", "温天仁", "乾蓝冰焰", "八门金光镜"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "惊龙钟", "category": "法宝宝物", "tagline": "黄枫谷召集全宗的示警之钟", "desc": "黄枫谷的示警之钟，响起后可召集全宗前往正殿。韩立回到黄枫谷后，此钟连响八十一下，预示宗门将有灭顶之灾。", "first_ep": 53, "realm": "", "faction": "", "related": ["黄枫谷", "韩立", "令狐老祖", "钟灵道"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "上古傀儡兽", "category": "法宝宝物", "tagline": "天晶真人以魂石交换的上古傀儡", "desc": "上古傀儡兽是天晶真人从上古遗迹中得来的机关傀儡，共七八只，实力大约相当于结丹初期。他在蒙面交换会上只肯以魂石交换，大多数来客都不认得魂石；韩立用一块鸡蛋大小的魂石换下其中六只，并一并得到了相关的炼制之法。", "first_ep": 170, "realm": "", "faction": "", "related": ["天晶真人", "魂石", "巨猿傀儡", "傀儡术", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "赤精芝", "category": "丹药材料", "tagline": "韩立在交换会上换得的三千年灵药", "desc": "赤精芝是一种珍贵的灵药。在阗天城晶龙阁的蒙面交换会上，韩立以一枚七级土属性妖丹换下一株三千年的赤精芝，同行的吕洛和火龙童子都颇感意外，先后向他道贺。", "first_ep": 169, "realm": "", "faction": "", "related": ["韩立", "吕洛", "火龙童子"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "血凝五行丹", "category": "丹药材料", "tagline": "凝结煞丹的结丹捷径", "desc": "筑基后期修士服下后，有三分之一机会结成煞丹，但会终身停在结丹初期，无法进阶元婴。曲魂借此凝成煞丹，黑煞教的煞妖体内也带有此丹。", "first_ep": 45, "realm": "", "faction": "", "related": ["曲魂", "越皇", "黑煞教", "结丹期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "尸虫丸", "category": "丹药材料", "tagline": "墨大夫控制韩立的毒丸", "desc": "墨大夫为控制韩立，逼他吞下此丸。若没有解药，丸中虫卵便会孵化；墨大夫还以韩立的家人相威胁。", "first_ep": 3, "realm": "", "faction": "", "related": ["韩立", "墨大夫", "长春功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "抽髓丸", "category": "丹药材料", "tagline": "剧痛折寿之药", "desc": "厉飞雨长期服用此药，须忍受剧痛，且只剩几年寿命。韩立曾救过他的命，并答应替他配制一种减轻痛苦的药。", "first_ep": 3, "realm": "", "faction": "", "related": ["厉飞雨", "张袖儿", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "暖阳宝玉", "category": "丹药材料", "tagline": "化解解药阴毒的墨家宝物", "desc": "墨大夫遗书指出，其解药另藏阴毒，只有墨家的暖阳宝玉能够化解。严氏持宝玉与韩立谈判，韩立斩杀欧阳飞天并交出解药后，将其换得。", "first_ep": 5, "realm": "", "faction": "", "related": ["韩立", "墨大夫", "严氏", "墨府", "嘉元城"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "玉髓芝", "category": "丹药材料", "tagline": "筑基丹的三味主药之一", "desc": "玉髓芝与紫猴花、天灵果同为筑基丹主药，炼丹还需三十一种数百年药龄的辅药。韩立掌管的药园中辅药齐全，三种主药却一样也没有。", "first_ep": 11, "realm": "", "faction": "", "related": ["筑基丹", "韩立", "筑基期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "定灵丹", "category": "丹药材料", "tagline": "以醇液入药的结婴灵丹", "desc": "云梦山灵眼之树每两百年产出的醇液，是炼制定灵丹的主药或药引。此丹可助修士凝结元婴，也是试剑大会夺魁者的奖励。韩立曾复制记载其炼制之法的玉简。", "first_ep": 145, "realm": "", "faction": "", "related": ["云梦山", "落云宗", "韩立", "元婴期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "碧焰酒", "category": "丹药材料", "tagline": "裂风兽一族耗时百年所酿灵酒", "desc": "碧焰酒仅裂风兽一族能酿，以一颗化形阶妖丹为主料，百余年方能成坛。风希逼韩立饮下以突破瓶颈，又借酒中手脚要挟其提供木属性之力，协助炼制风雷翅。", "first_ep": 129, "realm": "", "faction": "", "related": ["风希", "韩立", "裂风兽", "风雷翅", "万年灵液"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "魂石", "category": "丹药材料", "tagline": "阴兽晶石在交易会上的古称", "desc": "天晶真人在交易会上要求以魂石交换傀儡，多数来客并不识得此物。韩立认出魂石就是阴兽晶石，以一块鸡蛋大小的魂石换走六只傀儡。", "first_ep": 170, "realm": "", "faction": "", "related": ["上古傀儡兽", "天晶真人", "阴冥之地", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "延寿丹", "category": "丹药材料", "tagline": "蛮胡子为延续寿元所求丹药", "desc": "蛮胡子寿元将近，欲寻找一种可炼制延寿丹药的灵果，为此凭他人进献的地图残片来到虚天殿。这类丹药可延续修士寿元，是他的主要目标。", "first_ep": 96, "realm": "", "faction": "", "related": ["蛮胡子", "虚天殿", "极阴祖师"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "雪灵水", "category": "丹药材料", "tagline": "冲击结丹所需的关键灵液", "desc": "冲击结丹时需服用雪灵水与天火液，据说缺了这两样，成功率远不足百分之一。曲魂曾向六连殿的白水楼求购此物，韩立也将它列入结丹前的准备。", "first_ep": 68, "realm": "", "faction": "", "related": ["曲魂", "韩立", "结丹期", "魁星岛"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "婴鲤兽", "category": "妖兽灵虫", "tagline": "六连殿围猎、乌丑夺丹的妖兽", "desc": "六连殿组织围猎婴鲤兽，以降尘丹和一千灵石为报酬，韩立与曲魂参与其中。此兽被制服后，乌丑以玄阴魔气逼退众长老，斩兽取丹，要献给极阴祖师作贺礼。", "first_ep": 71, "realm": "", "faction": "", "related": ["乌丑", "极阴祖师", "曲魂", "韩立", "降尘丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "六翼霜蚣", "category": "妖兽灵虫", "tagline": "寒气可助炼化乾蓝冰焰的灵虫", "desc": "柳玉从上古修士废弃洞府中寻得古卵，孵化后以御灵宗驭虫之术饲养。韩立擒住柳玉，欲取虫卵与驭虫术；其寒气还能缩短炼化乾蓝冰焰所需的时间。", "first_ep": 165, "realm": "", "faction": "", "related": ["柳玉", "韩立", "御灵宗", "乾蓝冰焰"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "离火蛟", "category": "妖兽灵虫", "tagline": "统领蛟龙一族的九级妖修", "desc": "离火蛟是蛟龙一族族长，修为为九级妖修。毒蛟被杀后，逃脱的巨龟将死讯报给它；韩立则在缴获的储物袋中发现龟壳与血红鳞片。", "first_ep": 133, "realm": "", "faction": "", "related": ["毒蛟", "韩立", "妖族"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "双头火狼", "category": "妖兽灵虫", "tagline": "自虚天鼎冲出的双头妖兽", "desc": "双头火狼从虚天鼎中冲出，向结丹修士一方逃窜，引来天悟子等元婴修士争抢。乌丑以玄阴大化出黑蟒将其缠住，玄骨随即放出绿网，把火狼与黑蟒一并罩住。", "first_ep": 113, "realm": "", "faction": "", "related": ["虚天鼎", "乌丑", "玄骨", "天悟子", "玄阴大法"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "修罗圣火", "category": "功法秘术", "tagline": "玄骨融合冰焰阴火神雷所成", "desc": "玄骨将乾蓝冰焰、玄魂阴火与辟邪神雷强行融合，炼成灰白色的修罗圣火。此火品阶更高，能吞噬韩立的雷网；玄骨最终反被自己的修罗圣火烧成灰烬。", "first_ep": 116, "realm": "", "faction": "", "related": ["玄骨", "乾蓝冰焰", "辟邪神雷", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "天罗真雷", "category": "功法秘术", "tagline": "万天明元婴离体施展的雷法", "desc": "天罗真雷是万天明的重要法宝，与其天罗功法同源。他曾以假雷唬退极阴祖师与青易居士；争夺补天丹时，又令元婴离体，动用真正的天罗真雷。", "first_ep": 96, "realm": "", "faction": "", "related": ["万天明", "极阴祖师", "青易居士", "蛮胡子", "补天丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "六极真魔功", "category": "功法秘术", "tagline": "温天仁主修的乱星海第一魔功", "desc": "温天仁的主修功法，被他称为乱星海第一魔功。他恼怒之下施展此法，欲让韩立见识其威力。", "first_ep": 137, "realm": "", "faction": "", "related": ["温天仁", "乱星海", "魔道"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "玄牡化婴大法", "category": "功法秘术", "tagline": "可夺他人元婴炼成第二元婴", "desc": "一门培育第二元婴的魔道秘法，记载于韩立所得的玉简中。此法可夺取他人元婴炼成第二元婴，但修炼者有反被同化的风险。", "first_ep": 162, "realm": "", "faction": "", "related": ["韩立", "辛如音", "齐云霄", "元婴期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "阴阳轮回诀", "category": "功法秘术", "tagline": "人鬼合修的青阳门旧藏功法", "desc": "青阳门收藏已久、门中无人修炼过的功法。元瑶金丹碎裂后，与只能以鬼影形态存在的妍丽一同修炼此人鬼合修之法。", "first_ep": 144, "realm": "", "faction": "", "related": ["元瑶", "妍丽", "阴冥之地", "还魂术"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "血灵大法", "category": "功法秘术", "tagline": "血云飞遁、血鬼复凝的鬼灵门功法", "desc": "王蝉的招牌功法，须由一男一女共同修炼，他只修成其中两层。施展时可化作血云飞行，速度极快；召出的血鬼被斩灭后，也能立刻重新凝聚。", "first_ep": 20, "realm": "", "faction": "", "related": ["王蝉", "燕如嫣", "鬼灵门", "阴火大阵", "神风舟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "血炼神光", "category": "功法秘术", "tagline": "越皇与曲魂先后修炼的秘法", "desc": "越皇修炼的功法，相关玉简还载有化身之术。曲魂成为韩立的化身后，在筑基之后修炼血炼神光。", "first_ep": 47, "realm": "", "faction": "", "related": ["曲魂", "越皇", "韩立", "极阴祖师"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "还魂术", "category": "功法秘术", "tagline": "代价沉重的魂魄复生秘术", "desc": "至少须结丹修士才能施展，施术者通常会跌落整整一个大境界。元瑶欲以此术为妍丽重塑肉身，却被鬼雾打断，自身金丹碎裂，妍丽也未能重获肉身。", "first_ep": 136, "realm": "", "faction": "", "related": ["元瑶", "妍丽", "养魂木", "阴冥之地", "巨猿傀儡"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "上古传送阵", "category": "阵法", "tagline": "助韩立脱离天南的古阵", "desc": "韩立将临摹的残缺阵图交给辛如音，以灵草为报酬请她修复。阵图复原后，他用灵石修好此阵，在魔道修士攻破颠倒五行阵时传送离开天南。", "first_ep": 30, "realm": "", "faction": "", "related": ["韩立", "辛如音", "齐云霄", "王蝉", "天南"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "拘灵阵", "category": "阵法", "tagline": "青阳门秘传的隐灵法阵", "desc": "此阵能隐藏灵气，施法者修为不足时只能隐去一部分。韩立向元瑶求取此阵，元瑶将载有拘灵阵及另外几种法阵的青阳门玉简送给他。", "first_ep": 135, "realm": "", "faction": "", "related": ["元瑶", "韩立", "青火雷"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "北斗两仪阵", "category": "阵法", "tagline": "阵旗破幻，黄雾尽散", "desc": "韩立曾以此阵的阵旗破去外层幻阵，震散黄雾。石蝶因此收起傲气，向韩立行礼并称其前辈，请他在阵法上多加指点。", "first_ep": 90, "realm": "", "faction": "", "related": ["韩立", "金青"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "上元灭光阵", "category": "阵法", "tagline": "守护阗天城的强力大阵", "desc": "九国盟总部阗天城由此阵守护。据说九国刚结盟时，曾借它在城下击溃法士联军，那一战有数名元婴修士陨落。", "first_ep": 167, "realm": "", "faction": "", "related": ["阗天城", "九国盟", "元婴期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "四象玄武阵", "category": "阵法", "tagline": "玄骨布下杀局所用的阵旗", "desc": "玄骨带韩立来到灵参藏身的荒芜石山，交给他一张金网和此阵阵旗。他暗中打算在阵中杀死韩立、夺取灵参，再让同伴夺舍韩立的肉身。", "first_ep": 101, "realm": "", "faction": "", "related": ["玄骨", "韩立", "九曲灵参"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "阴火大阵", "category": "阵法", "tagline": "炼化修士魂魄的邪阵", "desc": "王蝉提议布下此阵，炼化堡中的筑基修士，以魂魄供燕如嫣血祭、修炼血灵大法。他还将这些魂魄称作给燕如嫣的聘礼。", "first_ep": 20, "realm": "", "faction": "", "related": ["王蝉", "燕如嫣", "血灵大法", "鬼灵门"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "六遁水波大阵", "category": "阵法", "tagline": "六人合持，围杀六级妖兽", "desc": "六连殿为围杀一头六级妖兽、夺取妖丹而准备的阵法，需六名假丹修士共同主持。曹禄等人以每人一颗降尘丹为酬，邀请韩立等修士参与。", "first_ep": 68, "realm": "", "faction": "", "related": ["韩立", "降尘丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "王天古", "category": "人物", "tagline": "鬼灵门门主，王蝉的二伯", "desc": "鬼灵门门主，著名阵法大师，王蝉的二伯。阗天城密会上他先替侄儿向韩立赔罪，随即当众点破韩立结婴之快，让众人提防韩立。探苍坤上人洞府途中，他让王蝉、燕如嫣紧随身边，并暗示侄儿“在天南之外出了意外谁也查不到”。玉矶阁二层，他带头拦下玉盒，联合邰夫人等人对付南陇侯，并试图拉拢韩立，被韩立冲破包围。", "first_ep": 171, "realm": "元婴初期", "faction": "鬼灵门", "related": ["王蝉", "燕如嫣", "鬼灵门", "韩立", "南陇侯"], "img": "img/wang-tiangu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wang-tiangu/"}, {"name": "苍坤上人", "category": "人物", "tagline": "五千年前天南第一散修", "desc": "五千年前天南首屈一指的疯癫散修，曾横扫正魔两道、遭十名元婴围攻。传说他已死，实则借傀儡化身假死脱身，并成为唯一活着走出坠魔谷的人，出谷后不久去世。他的洞府由上古禁制太妙神禁封住，是南陇侯一行此行的目标。", "first_ep": 171, "realm": "不详", "faction": "散修", "related": ["南陇侯", "坠魔谷", "太妙神禁", "玉矶阁"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/master-cang-kun/"}, {"name": "云道友", "category": "人物", "tagline": "白衫老者，南陇侯的同伴", "desc": "身穿白衫的元婴中期老者，与南陇侯一同发起探访苍坤上人洞府之行。他讲述苍坤传说、说明上古禁制，提议众人立下心魔誓言，并与南陇侯合力开山。在玉矶阁二层，他突然祭出银轮重创南陇侯，并揭出南陇侯是苍坤上人唯一的后人。", "first_ep": 171, "realm": "元婴中期", "faction": "不详", "related": ["南陇侯", "苍坤上人", "王天古", "玉矶阁"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/175/"}, {"name": "穆上师", "category": "人物", "tagline": "乘御风车追杀众人的慕兰法士", "desc": "元婴期慕兰法士，乘御风车追击南陇侯一行，盯上韩立。他以宝珠护罩、冰兽、冰晶术和古宝千重峰与韩立斗法，灵力耗尽后被韩立以巨剑破防、乾蓝冰焰冰封肉身，只剩元婴遁逃，千重峰与御风车都落入韩立手中。", "first_ep": 172, "realm": "元婴期", "faction": "慕兰人", "related": ["韩立", "御风车", "千重峰", "慕兰人"], "img": "img/sage-mu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/sage-mu/"}, {"name": "邰夫人", "category": "人物", "tagline": "同探苍坤洞府的元婴女修", "desc": "随南陇侯同探苍坤洞府的元婴期女修。她以优先挑宝为交换，催动古宝雷火锥攻打太妙神禁，结果雷火锥被禁制困住炸碎。在玉矶阁二层，她站到王天古一边。", "first_ep": 174, "realm": "元婴期", "faction": "不详", "related": ["雷火锥", "太妙神禁", "王天古"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/174/"}, {"name": "尤姓修士", "category": "人物", "tagline": "与王天古结盟的元婴修士", "desc": "同探苍坤洞府的元婴修士。会合时曾被两名慕兰法士追来。在玉矶阁二层他站到王天古一边，奉命缠住韩立，被韩立以乾蓝冰焰整个冻住，随身葫芦也被夺走。", "first_ep": 173, "realm": "元婴期", "faction": "不详", "related": ["王天古", "韩立", "乾蓝冰焰"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/175/"}, {"name": "御风车", "category": "法宝宝物", "tagline": "慕兰人的顶阶飞行异宝", "desc": "慕兰人的飞车，曾载着五名元婴法士追上南陇侯一行，一路紧追韩立。韩立击败穆上师后将其收归己有。", "first_ep": 172, "realm": "", "faction": "", "related": ["穆上师", "韩立", "慕兰人"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/wind-riding-chariot/"}, {"name": "千重峰", "category": "法宝宝物", "tagline": "能暴涨砸人的黑色山峰古宝", "desc": "穆上师的古宝，形如一座黑色山峰，能暴涨变大，锁定目标一路追砸。韩立凭风雷翅的速度甩开它、耗尽穆上师灵力，战后将其收入囊中。", "first_ep": 173, "realm": "", "faction": "", "related": ["穆上师", "韩立", "风雷翅"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/173/"}, {"name": "定星盘", "category": "法宝宝物", "tagline": "南陇侯辨向破阵的法宝", "desc": "南陇侯用来辨别方向的法宝，靠星线推算方位。慕兰草原上众人被困沙中法阵，他用定星盘算出七个出口中的生路。", "first_ep": 172, "realm": "", "faction": "", "related": ["南陇侯", "慕兰草原"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/172/"}, {"name": "雷火锥", "category": "法宝宝物", "tagline": "邰夫人缠绕雷火的古宝", "desc": "邰夫人的古宝，缠绕雷火、遁速极快。她用它攻打太妙神禁，被禁制困住后炸成碎片。", "first_ep": 174, "realm": "", "faction": "", "related": ["邰夫人", "太妙神禁"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/174/"}, {"name": "须弥虫", "category": "妖兽灵虫", "tagline": "可藏人窥视的巨虫", "desc": "一种巨虫，三名黄沙部法士藏身其中、在沙中窥看南陇侯一行，众人里只有韩立察觉到它。", "first_ep": 172, "realm": "", "faction": "", "related": ["慕兰人", "韩立", "明清灵目"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/172/"}, {"name": "太妙神禁", "category": "阵法", "tagline": "封住苍坤洞府的上古禁制", "desc": "封住苍坤上人洞府的上古禁制，原需八名神识强大的修士合力才能破开，还会冲击闯入者的神魂。邰夫人的雷火锥毁于其中，最后韩立凭大衍诀同时运转十几套阵法，独自将其破除，换得排在两位发起人之后的挑宝权。", "first_ep": 172, "realm": "", "faction": "", "related": ["苍坤上人", "韩立", "大衍诀", "雷火锥"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/formations/wondrous-soul-restriction/"}, {"name": "玉矶阁", "category": "地点", "tagline": "苍坤上人洞府中的白玉楼阁", "desc": "苍坤上人洞府中的白玉楼阁。一层摆着古宝、法宝和丹药，由众人按约分配；二层有三首六臂的妖神像、写满金色文字的石壁，以及寒玉床上三只隔绝神识的玉盒，众人在此反目成仇。", "first_ep": 174, "realm": "", "faction": "", "related": ["苍坤上人", "南陇侯", "王天古"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/episodes/175/"}, {"name": "坠魔谷", "category": "地点", "tagline": "天南最凶险之地", "desc": "天南最凶险的山谷，据说谷中藏有罕见宝物。韩立寻找庚精时首次听闻此地；苍坤上人是唯一活着走出谷的人，王天古认为玉矶阁的玉盒里或许藏着他全身而退的秘密。", "first_ep": 169, "realm": "", "faction": "", "related": ["苍坤上人", "庚精", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/devilfall-valley/"}]</script>
<script id="eps" type="application/json">[{"ep": 175, "s": "云姓老者突然重创南陇侯，韩立用乾蓝冰焰冻住尤姓修士，破开围堵脱身。"}, {"ep": 174, "s": "韩立独力破开太妙神禁，王天古则暗示侄儿：在天南之外出了意外谁也查不到。"}, {"ep": 173, "s": "韩立回身迎战穆上师，以乾蓝冰焰冰封其肉身，夺得千重峰和御风车。"}, {"ep": 172, "s": "众人立下心魔誓言赴苍坤洞府，途中被载着五名元婴的御风车追上，只得分头逃散。"}, {"ep": 171, "s": "韩立替孙二狗的后人孙火解围，又在南陇侯的秘会上得知苍坤上人洞府之事。"}, {"ep": 170, "s": "韩立用魂石换得上古傀儡兽和炼制之法，庚精却以七十多万灵石被人买走。"}, {"ep": 169, "s": "韩立在阗天城的面具交换会上买下三千年赤精芝，却打听不到庚精的消息。"}, {"ep": 168, "s": "南陇侯与韩立比拼神识，见他不落下风，便邀他在交易会第四日赴会。"}, {"ep": 167, "s": "韩立在宗内培植势力，随后前往阗天城交易会，途中南陇侯要亲自试他。"}, {"ep": 166, "s": "韩立给被擒的柳玉下了神魂禁制，收作记名弟子，又构想出一种自己的火焰。"}, {"ep": 165, "s": "韩立追杀御灵宗与鬼灵门两拨人，除掉童老和鬼老，放过菡云芝，活捉柳玉。"}, {"ep": 164, "s": "韩立认出家族旧物，留下金剑和丹药，斩断与凡尘的最后牵连。"}, {"ep": 163, "s": "韩立回到已改名韩家镇的故乡，在宗祠里让韩瑞认出自己真是叔祖。"}, {"ep": 162, "s": "韩立以付家老祖首级告慰辛如音，得到玄牡化婴大法，又在黄枫谷追杀鬼灵门修士。"}, {"ep": 161, "s": "韩立大闹付天化的四百岁寿宴，斩尽守卫，以辛如音之名处决付天化。"}, {"ep": 160, "s": "韩立任由两名劫匪把他引进山谷，擒住吞噬元神的至木灵婴，动身赴付家寿宴。"}, {"ep": 159, "s": "慕沛灵甘愿终生侍奉韩立；韩立得到大庚剑阵，开始打听庚精。"}, {"ep": 158, "s": "韩立得了青竹峰，听说慕沛灵被传成自己的侍妾，又让元婴制服一丝乾蓝冰焰。"}, {"ep": 157, "s": "韩立回想结婴时如何看破幼年模样的心魔，次日落云宗立他为太上长老。"}, {"ep": 156, "s": "韩立在药园旁闭关结婴成功，程天坤、吕洛登门邀他留任太上长老。"}, {"ep": 155, "s": "光头修士自爆后，韩立取得一小截灵根；二十年后，他闭关准备结婴。"}, {"ep": 154, "s": "杜东亮出千幻宗少主身份，杀死韩立的替身；天煞真君夺取卫师兄的身体助两人脱身。"}, {"ep": 153, "s": "韩立在试剑大会上用火弹符击败姚锋，蓝师叔在禁地里揭穿白姓修士的来历。"}, {"ep": 152, "s": "宋长老接下试剑大会的带队之职，借琴音探查韩立，并认定杜东可疑。"}, {"ep": 151, "s": "银月化作狐耳少女现身，韩立在宗内初试中用火弹符逼林询通认输。"}, {"ep": 150, "s": "玉如意的器灵银月向韩立立誓效忠，经移灵法阵与他的飞剑相合，化作狐耳少女。"}, {"ep": 149, "s": "黑衣少妇原是尸魈，雪云狐又出手袭击，玉如意的器灵化作火狼夺舍了狐狸。"}, {"ep": 148, "s": "韩立追踪雪云狐进入石室，一名黑衣少妇愿以灵眼之玉相赠，请他代送一封信。"}, {"ep": 147, "s": "韩立伪装成炼气期散修拜入落云宗，接手药园，在瀑布后开出隐秘洞府。"}, {"ep": 146, "s": "韩立与梅凝、紫灵在溪国分别，一个月后来到云梦山，走进落云宗。"}, {"ep": 145, "s": "韩立带紫灵、梅凝逃出阴冥之地，飞越无边海，回到天南最北端的溪国。"}, {"ep": 144, "s": "攀登暴风山途中，韩立以凡人武艺击败温天仁，温天仁自刎而死，峰顶裂缝终于开启。"}, {"ep": 143, "s": "韩立斩杀大长老，得到骆老的降灵符秘法；到了红土村，梅凝找到兄长沾血的锦袋。"}, {"ep": 142, "s": "梅凝渡气让韩立暂复法力；韩立得知村子拿人喂阴兽，二人连夜出逃，被全村拦住。"}, {"ep": 141, "s": "韩立得知唯一出路是暴风山，又在仓库石碑下读到前辈的自述：那山有眼睛。"}, {"ep": 140, "s": "韩立坠入阴冥之地，法力全失，与梅凝随村民守住村子，击退来袭的兽群。"}, {"ep": 139, "s": "韩立破出八门金光镜，钉住温天仁逼问遗迹，鬼雾却骤然降临，众修士法力尽失。"}, {"ep": 138, "s": "韩立接连灭掉温天仁数尊真魔，温天仁祭出八门金光镜，把他吸进试炼世界。"}, {"ep": 137, "s": "温天仁招揽乔装的韩立遭拒，两人以法宝斗法，温天仁又召出六尊魔影。"}, {"ep": 136, "s": "元瑶施展还魂术为师姐重塑肉身，韩立在旁护法，冲天异象却引来了温天仁。"}, {"ep": 135, "s": "韩立混进追捕元瑶的悬赏修士中，将他们尽数斩杀，从元瑶手里得到满满一瓶灵液。"}, {"ep": 134, "s": "韩立击杀云天啸后伪装失效，引妙鹤与风希相斗，借传送阵脱身。"}, {"ep": 133, "s": "范夫人认出韩立，拿出私藏的幻梦石修传送阵，求他除掉云天啸。"}, {"ep": 132, "s": "韩立夺下未炼成的风雷翅逃出，摆脱风希追杀，在一座冰岛上发现了雷遁。"}, {"ep": 131, "s": "三妖喝下韩立的灵液后纷纷中毒，噬金虫随即吞掉了动弹不得的毒蛟。"}, {"ep": 130, "s": "风希与毒蛟、龟妖以雷鹏遗骨炼制风雷翅，大阵暗中抽取韩立的木属性灵力。"}, {"ep": 129, "s": "被关在珊瑚密室的韩立突破到结丹后期，察觉酒中藏有邪气，暗下决心逃走。"}, {"ep": 128, "s": "风希识破韩立的伪装，带他游览黑石城、吐露称王之志，又拿出助他突破的秘酒。"}, {"ep": 127, "s": "韩立带走文思月，循她的海图找到裂风兽巢穴，刚拔下伴妖草，风希便现身了。"}, {"ep": 126, "s": "地下坊市的交换会上，文思月说出裂风兽的线索，韩立重创出言威胁的东主云天啸。"}, {"ep": 125, "s": "韩立的傀儡救下公孙杏，她立誓侍奉；后来韩立把洞府留给她，独自前往秘市。"}, {"ep": 124, "s": "韩立在外星海猎妖，得知自己被当成“虫魔”，于是回去闭关，冲击结丹中期。"}, {"ep": 123, "s": "韩立在雾中荒岛闭关修炼，一年后巨龟渡劫，众修士联手猎蛟，海上大战一场。"}, {"ep": 122, "s": "大战爆发，韩立来到奇渊岛，打听到千叶露出自八级妖兽身旁的伴妖草。"}, {"ep": 121, "s": "韩立在戒严的天星城买通传送阵，偷渡到外星海，放他走的护法随后被处死。"}, {"ep": 120, "s": "韩立冒充厉飞雨从温天仁处取得令牌，又在海上斩杀两名逆星盟修士，再由凌玉灵带路。"}, {"ep": 119, "s": "韩立打不开虚天鼎，转往天星城，途中得知正魔两道已组建逆星盟对抗星宫。"}, {"ep": 118, "s": "韩立在隐秘的灵泉密室里撞见元瑶，换得万年灵乳和一小节养魂木根。"}, {"ep": 117, "s": "韩立灌入神雷压垮玄骨的火焰，玄骨化为灰烬；韩立除去极阴的暗记，传送离开。"}, {"ep": 116, "s": "韩立收起虚天鼎，玄骨夺得冰焰后翻脸动手，最后催出修罗圣火。"}, {"ep": 115, "s": "蛮胡子夺得补天丹遁走，玄骨杀了乌丑，韩立谈妥条件后放出最后一只血玉蜘蛛。"}, {"ep": 114, "s": "韩立收服火狼得到玉如意，星宫长老偷袭斩倒血玉蜘蛛，补天丹随即现世。"}, {"ep": 113, "s": "元婴老怪们分头鏖战，虚天鼎中冲出一头火狼，乌丑与玄骨为它相争。"}, {"ep": 112, "s": "蛮胡子催狂血玉蜘蛛拖起虚天鼎，万天明一行却去而复返，双方大打出手。"}, {"ep": 111, "s": "正道的金丝蚕没能拉起虚天鼎，被蛮胡子赶走，极阴祖师随即转向韩立。"}, {"ep": 110, "s": "内殿开启，正魔两道约定先夺虚天鼎、后分胜负，韩立随魔道众人登上巨塔。"}, {"ep": 109, "s": "幻境让韩立重活一遍从未离家的人生，他谢过幻象中的亲人，醒来后独自前行。"}, {"ep": 108, "s": "韩立让噬金虫化作铠甲，在宝光阁连取两件古宝，又在极妙幻境中不为所动。"}, {"ep": 107, "s": "噬金虫吃掉封着蚁群的水晶柱，韩立随后传送进石殿，魔道诸老纷纷把宝物交给他。"}, {"ep": 106, "s": "韩立救下元瑶，收下她的啼魂兽；星宫长老则承认试炼里的蚁群是他们放出来的。"}, {"ep": 105, "s": "黑色沙漠里铁火蚁吞掉一名修士，韩立放出噬金虫击败蚁群，随后元瑶向他求救。"}, {"ep": 104, "s": "韩立以寒气护罩闯过熔岩路，旁人接连丧命，乌丑则暗暗发誓要杀掉他。"}, {"ep": 103, "s": "蛮胡子向极阴祖师讨要韩立遭拒，韩立随后先行踏入冰火道的熔岩路。"}, {"ep": 102, "s": "韩立拒交血玉蜘蛛，又依玄骨之意，舍青易居士而拜极阴祖师为师。"}, {"ep": 101, "s": "韩立破了玄骨的埋伏，拿到九曲灵参，极阴祖师随即杀到，要看他的血玉蜘蛛。"}, {"ep": 100, "s": "玄骨暗中图谋韩立的肉身，韩立反手握住阵法主旗，用金网捉住灵参化成的白兔。"}, {"ep": 99, "s": "韩立走出第一关，与紫灵、元瑶分开，和玄骨一同被传送到一片辽阔草原。"}, {"ep": 98, "s": "韩立当众用出辟邪神雷烧死虎妖，黑袍人原来是元瑶。"}, {"ep": 97, "s": "韩立带紫灵深入鬼雾，出手对付两道鬼影，其中一道与妖虎合为一体。"}, {"ep": 96, "s": "蛮胡子逼韩立让出玉柱，极阴祖师拉人结盟，韩立与紫灵一同进入第一关。"}, {"ep": 95, "s": "韩立进入虚天殿，答应帮玄骨寻宝换九曲灵参，蛮胡子却要占他坐的石柱。"}, {"ep": 94, "s": "韩立与玄骨上人萧诧互相试探后各自离去，一个月后，他望见虚天殿浮在海上。"}, {"ep": 93, "s": "石蝶、金青相继丧命，极阴祖师师父的鬼影夺舍了韩立的化身曲魂。"}, {"ep": 92, "s": "妖冠蛇被斩，遗迹却是陷阱：胡月丧命，鬼雾把金青与韩立隔开。"}, {"ep": 91, "s": "封灵柱下藏着七霞莲，简姓修士采莲时被拖入池中，一条妖冠蛇破水而出。"}, {"ep": 90, "s": "怪人的花篮收走众人法宝，韩立放出噬金虫，又用飞剑雷光将他烧成灰。"}, {"ep": 89, "s": "韩立破开沙雾大阵，令石蝶折服，又与她联手浇灭遗址里的三阳之地。"}, {"ep": 88, "s": "金青请韩立破阵探古修士洞府，韩立由此断定自己的锦帕就是虚天残图。"}, {"ep": 87, "s": "韩立救活小龙、悟透红尘劫，离开小店，炼成七十二口青竹蜂云剑。"}, {"ep": 86, "s": "小店十余年间，下棋的老修士闭了死关，小秦的同伴恳求韩立打听小秦的下落。"}, {"ep": 85, "s": "韩立在凡人坊市开起青竹小轩，头一天就赔了钱，下棋也总输给何老。"}, {"ep": 84, "s": "韩立答应做妙音门的名义长老，换来带根的天雷竹，几年后养成了金雷竹。"}, {"ep": 83, "s": "韩立甩脱极阴祖师的妖尸逃回天星城，见到戴面纱的汪凝，也就是紫灵。"}, {"ep": 82, "s": "赤火老怪倒戈，联手瓦解；韩立让赵长老永远闭嘴，逃走途中在海上遭妖尸伏击。"}, {"ep": 81, "s": "极阴祖师附身乌丑，用天都尸火把逃跑的孟姓修士烧成灰，叫众人一起上。"}, {"ep": 80, "s": "突袭邪修老巢变成紫灵针对赵长老的圈套，乌丑现身，孙某却说早在等他。"}, {"ep": 79, "s": "紫灵暗中与范夫人、卓如婷联手布局，随后率众突袭贼人小岛，韩立按兵不动。"}, {"ep": 78, "s": "韩立把妖兽资材卖给妙音门，为了一节天雷竹，答应帮他们攻打蝎岛。"}, {"ep": 77, "s": "韩立结丹出关，分批出售妖兽材料筹措炼宝资源，却被范静梅找上门求助。"}, {"ep": 76, "s": "金魁威逼极阴祖师，风希与雷鹏决斗，韩立闭关六十年，青色光柱冲天而起。"}, {"ep": 75, "s": "韩立炼好丹药，闭生死关冲击结丹；星宫大长老金魁夜袭极阴岛。"}, {"ep": 74, "s": "韩立躲过兽潮抵达天星城，由文思月带路游城，租下一座洞府。"}, {"ep": 73, "s": "韩立自己结丹无望，先助曲魂结丹，又活捉噬金虫，随后在外海猎妖多年。"}, {"ep": 72, "s": "韩立把古长老引进法阵击杀；乌丑的老祖怀疑他与极炫有关，下令抓人。"}, {"ep": 71, "s": "文樯把韩立和汪凝传送脱险，自己留下；逃亡途中，古长老在礁岛上追上韩立。"}, {"ep": 70, "s": "乌丑与倒戈的古长老把镇妖大典变成屠场，韩立抱着凝儿从地道脱身。"}, {"ep": 69, "s": "众修士不敌，韩立出手布阵，曲魂斩杀妖兽；极阴岛的乌丑随即现身。"}, {"ep": 68, "s": "六连殿斗兽场上，韩立与众修士面对的竟是一头接近六阶的婴鲤兽。"}, {"ep": 67, "s": "为寻结丹材料，韩立报名镇妖大典；茶楼里的风前辈一眼看穿他隐藏的气息。"}, {"ep": 66, "s": "韩立闭关重修，把曲魂炼成化身；远在天南的墨彩环至死惦记着他。"}, {"ep": 65, "s": "韩立在镇妖台替顾东主赢下比试，随后选定一座偏远小岛，准备长期闭关。"}, {"ep": 64, "s": "韩立从海兽口中救下顾东主的大船，答应替顾家出战一次，争夺行商席位。"}, {"ep": 63, "s": "韩立修好古传送阵，在王蝉扑到前一刻传送脱身，来到乱星海。"}, {"ep": 62, "s": "南宫屏数落韩立一番，又以灵石报恩，韩立估计足够修复传送法阵。"}, {"ep": 61, "s": "蒙面女子脱身后，韩立为她疗伤，修为被吸到炼气期，她却自称南宫屏。"}, {"ep": 60, "s": "王蝉率众围困一名蒙面女修，韩立认定是南宫婉，乔装混入，挟持董萱儿逼停攻势。"}, {"ep": 59, "s": "韩立斩杀付家二人，得知齐云霄已死，答应辛如音日后向付家讨还公道。"}, {"ep": 58, "s": "李化元被白衣长老击倒，死在红拂怀中；韩立决意不再做任何人的棋子。"}, {"ep": 57, "s": "宋蒙、钟卫娘救下昏迷的韩立；闪回三天前，李化元不肯向云露老祖低头，全身燃起金光。"}, {"ep": 56, "s": "李化元与红拂迎战红粉骷髅，令狐老祖溜走；二人终于并肩冲入红光爆炸。"}, {"ep": 55, "s": "李化元从第二处埋伏中救出韩立，抹去他的印记，随后与红拂一同被困红色大阵。"}, {"ep": 54, "s": "魔道围攻红拂的飞舟，红拂独挡两名结丹修士，韩立等弟子趁乱突围。"}, {"ep": 53, "s": "韩立随红拂乘飞舟撤出黄枫谷，魔道那边已派红粉骷髅追杀他。"}, {"ep": 52, "s": "浮云救下宋蒙、钟卫娘；黄枫谷里令狐老祖弃众而去，韩立被秘密召往牵机堂。"}, {"ep": 51, "s": "陈巧倩将嫁入秦家，求韩立带她走被婉拒；金鼓原上七派与魔道开战。"}, {"ep": 50, "s": "韩立的警讯在前线被人截下；他在柳下坟前放下白花，决意离开黄枫谷。"}, {"ep": 49, "s": "韩立在洞中找到灵兽山与御灵宗的往来信笺，灵兽山长老则在魔道营中投诚。"}, {"ep": 48, "s": "韩立在山洞中计，被巨螳螂逼退；天亮后击败御灵宗修士，夺下绿煌剑。"}, {"ep": 47, "s": "韩立重回嘉元城得知墨府已灭，又凭引魂钟找到曲魂，拆穿其中的御灵宗修士。"}, {"ep": 46, "s": "钟卫娘以真凰符烧死胥王；京城事了，韩立驾神风舟离去，打算先回嘉元城。"}, {"ep": 45, "s": "韩立把越皇困进真·颠倒五行阵，三件符宝齐出，越皇却借五行之力重塑肉身。"}, {"ep": 44, "s": "刚救出的胥王竟是黑煞教主；刘靖引爆身上的爆裂符，韩立独自留下断后。"}, {"ep": 43, "s": "众人攻入黑煞教地下老巢，教主烧死黄衣修士、夺走一颗珠子，随即遁逃。"}, {"ep": 42, "s": "韩立刺穿冰妖，刘靖逼出源血唤醒真宝“凤凰符”，头发随之变白。"}, {"ep": 41, "s": "皇宫广场冻成冰原，血侍纷纷结茧妖化；韩立独战铁罗，最后青纹现身冰面。"}, {"ep": 40, "s": "韩立与同门定下夜袭之计，当夜攻打冷宫，一声爆炸却让偷袭暴露。"}, {"ep": 39, "s": "中秋灯会上，韩立与陈巧倩同游，白衣女子含泪离去；武炫则落入黑煞教之手。"}, {"ep": 38, "s": "云露老魔收董萱儿为徒；越京这边，李化元的四名弟子赶来与韩立商议攻打邪教。"}, {"ep": 37, "s": "韩立审出黑煞教藏身王宫，决定按兵不动，等待援军。"}, {"ep": 36, "s": "韩立斩杀王总管、活捉小王爷，又用符宝击退化身魔物的铁罗。"}, {"ep": 35, "s": "韩立攻入黑煞教藏身的山谷古庙，破了黑风阵，血侍铁罗化成的血茧却久攻不破。"}, {"ep": 34, "s": "吴三星遇袭后，韩立制服蒙山五友中的四人收为己用，决定先下手为强。"}, {"ep": 33, "s": "馨王宴上，韩立看穿吴仙师底细，不准墨彩环报仇，深夜又到吴仙师房中等他。"}, {"ep": 32, "s": "韩立答应寻找被掳走的老者，当晚随秦言赴馨王的宴会，吴仙师随火鸟登场。"}, {"ep": 31, "s": "韩立进越京投奔秦言，被收作侄子；连夜出逃的萧振却被一名魔化男子击倒。"}, {"ep": 30, "s": "韩立及时救下遭人追杀的齐云霄，请二人修复古传送阵，辛如音却迟疑不决。"}, {"ep": 29, "s": "韩立受李化元之托前往京城，与南宫婉同乘飞舟，却在元武国上空离船而去。"}, {"ep": 28, "s": "李化元在前线拉韩立打麻将，董萱儿却被鬼灵门少主擒住，要被献给云露老祖。"}, {"ep": 27, "s": "一年后，韩立在金鼓原屡屡斩杀魔道修士，又得知师父李化元已来到前线。"}, {"ep": 26, "s": "韩立斩杀血红巨蛛，取得大挪移令，又用忘尘丹抹去陈巧倩这几天的记忆。"}, {"ep": 25, "s": "吕天蒙对同伴翻脸，被血玉蜘蛛刺穿；韩立击败宣乐，独自面对血蛛。"}, {"ep": 24, "s": "撼地符震塌整座山，韩立在地下逃过一劫，却被吕天蒙和宣乐硬留在身边。"}, {"ep": 23, "s": "韩立发出警报，两位师兄卷走库中灵石逃走，魔火终于轰破矿场光罩。"}, {"ep": 22, "s": "被征调的韩立随七派夺下魔道的灵石矿，受了训斥的王蝉则亲自前来查看。"}, {"ep": 21, "s": "韩立逃出燕家堡，用青火瘴逼退王蝉，告别墨彩环，正魔大战就此打响。"}, {"ep": 20, "s": "嫣儿的婚礼原来是一场圈套，韩立炸开缺口突围，墨彩环把他和董萱儿叫进门内。"}, {"ep": 19, "s": "王蝉向燕家求娶嫣儿，韩立与董萱儿来到燕家堡，又遇见了墨彩环。"}, {"ep": 18, "s": "面具少主向燕家提出条件，韩立则奉命护送董萱儿去燕家的夺宝大会。"}, {"ep": 17, "s": "韩立救下被叶师兄傀儡追杀的吴师兄，吴师兄战死，雷万鹤赶来解围。"}, {"ep": 16, "s": "韩立筑基成功，受掌门器重，寻找洞府，又从齐云霄手中换得颠倒五行阵。"}, {"ep": 15, "s": "韩立斩杀墨蛟，与南宫婉有了一场如梦的亲密，出禁地后成功筑基。"}, {"ep": 14, "s": "韩立替菡云芝夺下烈阳花，又被困地下，与蒙面师祖联手对付墨蛟。"}, {"ep": 13, "s": "韩立以天雷子炸死封岳，与菡云芝赶到烈阳花处，却见已有人等候。"}, {"ep": 12, "s": "韩立进入禁地，目睹两名可疑的弟子杀人，最后被封岳压制住。"}, {"ep": 11, "s": "韩立在万宝楼置办法器，斩杀陆师兄，随李师祖出发前往禁地。"}, {"ep": 10, "s": "韩立被逼让出筑基丹，接手百药园，决心为血色禁地的试炼做准备。"}, {"ep": 9, "s": "韩立测灵根落选，杀了毒死万小山的散修，凭升仙令进入黄枫谷。"}, {"ep": 8, "s": "韩立暗中看着小妹出嫁，随后进入太南谷夜市，买下法宝残片和金竺笔。"}, {"ep": 7, "s": "嘉元城里，韩立从吴剑鸣手中救下墨彩环，换得暖阳宝玉，解了寒毒。"}, {"ep": 6, "s": "落日峰上，韩立把金光上人烧成灰烬，又烧死贾天龙，随后离开七玄门。"}, {"ep": 5, "s": "韩立发现铁奴竟是失了魂魄的张铁，收为曲魂，随后野狼帮夜袭七玄门。"}, {"ep": 4, "s": "韩立与墨大夫斗智决战，熬过七鬼噬魂后在其尸旁醒来，铁奴却又扑来。"}, {"ep": 3, "s": "韩立拾得小绿瓶，张铁失踪，墨大夫逼他服毒，限他一年内练成长春功。"}, {"ep": 2, "s": "韩立随墨大夫学医，撞破厉飞雨服用抽髓丸的秘密，并替他守了多年。"}, {"ep": 1, "s": "韩立离家投考七玄门，登顶误了时辰，被墨大夫收作帮手。"}]</script>

function card(d,showNew){var c=COL[d.category]||"#777",e=ep(d);
  var meta=d.category==="人物"?[d.realm,d.faction].filter(Boolean).join(" · "):(e?"第 "+e+" 集出场":"");
  return '<button class="card" type="button" data-n="'+esc(d.name)+'" style="--c:'+c+'"><div class="thumb">'+(d.img?'<img src="'+esc(d.img)+'" alt="" loading="lazy" decoding="async">'+(d.img_ai?'<span class="aitag">AI 绘</span>':''):art(d))+
   '<span class="badge">'+esc(SHORT[d.category]||d.category)+'</span>'+(showNew&&isNew(d)?'<span class="new">新</span>':'')+'</div>'+
   '<div class="cb"><div class="cn">'+esc(d.name)+'</div><div class="ct">'+esc(d.tagline)+'</div>'+(meta?'<div class="cm">'+esc(meta)+'</div>':'')+'</div></button>'}
/* recap */
var recap=document.getElementById("recap"),more=document.getElementById("more"),shown=5;
function drawRecap(){recap.innerHTML=eps.slice(0,shown).map(function(e){return '<li><b>第'+e.ep+'集</b><span>'+esc(e.s)+'</span></li>'}).join("");more.hidden=shown>=eps.length}
more.onclick=function(){shown+=10;drawRecap()};drawRecap();
/* new strip */
var nw=data.filter(isNew).sort(function(a,b){return ep(a)-ep(b)||(a.category==="人物"?-1:1)});
document.getElementById("newlabel").textContent="第 "+NEW_FROM+"–"+EP+" 集 · "+nw.length+" 条";
document.getElementById("strip").innerHTML=nw.map(function(d){return card(d,false)}).join("");
/* filters */
var st={q:"",cat:"全部",sort:0},SORTS=["默认排序","按出场","按名称"];
var counts={};data.forEach(function(d){counts[d.category]=(counts[d.category]||0)+1});
var cats=CATS.filter(function(c){return counts[c]});
var chips=document.getElementById("chips");
chips.innerHTML=["全部"].concat(cats).map(function(c){return '<button class="chip" type="button" data-c="'+c+'" aria-pressed="'+(c==="全部")+'">'+(SHORT[c]||c)+'<i>'+(c==="全部"?data.length:counts[c])+'</i></button>'}).join("");
chips.onclick=function(e){var b=e.target.closest(".chip");if(!b)return;st.cat=b.dataset.c;[].forEach.call(chips.children,function(x){x.setAttribute("aria-pressed",x===b)});draw()};
var sortB=document.getElementById("sort");sortB.onclick=function(){st.sort=(st.sort+1)%3;sortB.textContent=SORTS[st.sort];draw()};
var q=document.getElementById("q"),clr=document.getElementById("clr");
q.oninput=function(){st.q=q.value.trim().toLowerCase();clr.hidden=!q.value;draw()};
clr.onclick=function(){q.value="";st.q="";clr.hidden=true;draw();q.focus()};
var grid=document.getElementById("grid");
function draw(){var w=st.q.split(/\s+/).filter(Boolean);
  var L=data.filter(function(d){return(st.cat==="全部"||d.category===st.cat)&&w.every(function(x){return d._h.indexOf(x)>=0})});
  L.sort(function(a,b){
    if(st.sort===2)return a.name.localeCompare(b.name,"zh-Hans-CN");
    if(st.sort===1)return(ep(a)||9999)-(ep(b)||9999);
    var ca=CATS.indexOf(a.category),cb=CATS.indexOf(b.category);if(ca!==cb)return ca-cb;
    return(ep(a)||9999)-(ep(b)||9999)});
  if(w.length)L.sort(function(a,b){return(b.name.toLowerCase().indexOf(w[0])>=0)-(a.name.toLowerCase().indexOf(w[0])>=0)});
  grid.innerHTML=L.map(function(d){return '<li>'+card(d,true)+'</li>'}).join("");
  document.getElementById("empty").hidden=L.length>0;
  document.getElementById("count").textContent=L.length?"共 "+L.length+" 条":"";}
draw();
document.addEventListener("error",function(e){var t=e.target;if(t.tagName==="IMG"&&t.parentNode&&!t.closest(".hero")){var d=t.closest("[data-n]");var o=d&&by[d.dataset.n];t.outerHTML=o?art(o):''}},true);
/* sheet */
var sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),sb=document.getElementById("sbody"),backB=document.getElementById("back"),stack=[];
function render(n){var d=by[n];if(!d)return;var e=ep(d);
  var facts=[["类别",d.category],["境界",d.realm],["势力",d.faction],["首次出场",e?"第 "+e+" 集":""]].filter(function(f){return f[1]});
  var rel=(d.related||[]).map(function(r){return by[r]?'<button type="button" data-r="'+esc(r)+'" style="--c:'+(COL[by[r].category]||"#777")+'">'+esc(r)+'</button>':'<span>'+esc(r)+'</span>'}).join("");
  var desc=esc(d.desc);
  sb.innerHTML='<div class="dhead">'+thumb(d,"dav")+'<div><h2 class="dn" style="margin:0;display:block">'+esc(d.name)+'</h2><div class="dt">'+esc(d.tagline)+'</div></div></div>'+
   '<div class="facts">'+facts.map(function(f){return '<div class="fact"><small>'+f[0]+'</small><span>'+esc(f[1])+'</span></div>'}).join("")+'</div>'+
   '<p class="desc">'+desc+'</p>'+(rel?'<div class="rel"><h3>相关词条</h3><div class="rels">'+rel+'</div></div>':'')+
   (d.source_url?'<a class="src" href="'+esc(d.source_url)+'" target="_blank" rel="noopener">资料来源 · rmji.wiki ↗</a>':'');
  sb.scrollTop=0;backB.hidden=stack.length<2;}
function open(n,push){if(!by[n])return;if(push!==false)stack.push(n);render(n);sheet.classList.add("on");scrim.classList.add("on");document.body.style.overflow="hidden";
  if(location.hash!=="#"+encodeURIComponent(n))history.replaceState(null,"","#"+encodeURIComponent(n));}
function close(){stack=[];sheet.classList.remove("on");scrim.classList.remove("on");document.body.style.overflow="";history.replaceState(null,"",location.pathname+location.search)}
document.addEventListener("click",function(e){var c=e.target.closest(".card");if(c){stack=[];open(c.dataset.n)}});
sb.addEventListener("click",function(e){var b=e.target.closest("[data-r]");if(b)open(b.dataset.r)});
backB.onclick=function(){stack.pop();open(stack[stack.length-1],false)};
document.getElementById("close").onclick=close;scrim.onclick=close;
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
/* swipe down to close */
var y0=null;sheet.addEventListener("touchstart",function(e){y0=(sb.scrollTop<=0)?e.touches[0].clientY:null},{passive:true});
sheet.addEventListener("touchmove",function(e){if(y0==null)return;var dy=e.touches[0].clientY-y0;if(dy>0){sheet.style.transition="none";sheet.style.transform="translateY("+dy+"px)"}},{passive:true});
sheet.addEventListener("touchend",function(e){if(y0==null)return;var dy=e.changedTouches[0].clientY-y0;sheet.style.transition="";sheet.style.transform="";if(dy>110)close();y0=null});
if(location.hash.length>1){try{open(decodeURIComponent(location.hash.slice(1)))}catch(_){}}
})();
</script>
</body>
</html>
