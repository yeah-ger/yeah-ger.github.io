<style>
:root{
  --bg:#f3ede1;--bg2:#ebe3d3;--card:#fbf8f1;--ink:#1d1b17;--ink2:#5b554a;--ink3:#8d8577;
  --line:rgba(40,30,15,.12);--seal:#b23a2a;--jade:#2f6b5a;--gold:#a37b2c;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:16px;--g:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121311;--bg2:#1a1c19;--card:#1e201c;--ink:#ece6d8;--ink2:#b3ab9b;--ink3:#7f786b;
  --line:rgba(255,245,220,.10);--seal:#e0634f;--jade:#6fb39d;--gold:#d3a955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(163,123,44,.08),transparent 50%),radial-gradient(ellipse at 100% 30%,rgba(47,107,90,.06),transparent 45%)}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 var(--g)}
/* hero */
.hero{position:relative;min-height:300px;display:flex;align-items:flex-end;color:#f6f0e2;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,8,.15) 0%,rgba(10,10,8,.25) 45%,rgba(10,10,8,.85) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-top:calc(env(safe-area-inset-top) + 60px);padding-bottom:26px}
.hero h1{font:700 clamp(34px,9vw,52px)/1.1 var(--serif);margin:0;letter-spacing:.08em}
.hero h1 small{display:block;font:500 14px/1.4 var(--sans);letter-spacing:.3em;opacity:.8;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border-radius:99px;background:rgba(255,250,235,.16);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,250,235,.25);font-size:14px}
.pill b{color:#ffd9a0;font-weight:600}
.seal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--seal);color:#fff;font:700 12px var(--serif)}
/* sections */
h2{font:700 20px/1.3 var(--serif);margin:30px 0 12px;display:flex;align-items:baseline;gap:10px;letter-spacing:.04em}
h2 span{font:13px var(--sans);color:var(--ink3);letter-spacing:0}
.recap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.recap li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--ink2)}
.recap li:first-child{border-top:0}
.recap li b{font:700 15px var(--serif);color:var(--seal);white-space:nowrap}
.recap ul{margin:0;padding:0}
.recap .more{display:block;width:100%;padding:11px;border:0;border-top:1px solid var(--line);background:none;color:var(--jade);font-size:14px;cursor:pointer}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--g)*-1);padding:2px var(--g) 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{flex:0 0 150px;scroll-snap-align:start}
/* toolbar */
.bar{position:sticky;top:0;z-index:20;margin:22px calc(var(--g)*-1) 0;padding:calc(env(safe-area-inset-top) + 10px) var(--g) 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;height:46px;padding:0 44px 0 42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none;outline:none}
.search input:focus{border-color:var(--jade);box-shadow:0 0 0 3px color-mix(in srgb,var(--jade) 20%,transparent)}
.search svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--ink3)}
.search .clr{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:none;color:var(--ink3);font-size:20px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;margin-left:calc(var(--g)*-1);padding-left:var(--g)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
.chip i{font-style:normal;color:var(--ink3);margin-left:4px;font-size:12px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] i{color:inherit;opacity:.6}
.sort{flex:none;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink2);cursor:pointer}
.count{font-size:13px;color:var(--ink3);margin:14px 0 8px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.card{display:flex;flex-direction:column;text-align:left;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.thumb{position:relative;aspect-ratio:1/1;width:100%;background:var(--bg2);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.mono{font:700 54px var(--serif);color:var(--c,var(--ink3));opacity:.85}
.thumb .mono{position:relative}
.thumb .mono:after{content:"";position:absolute;inset:-14px;border:2px solid currentColor;border-radius:12px;opacity:.35}
.art{position:absolute;inset:0;display:block;overflow:hidden;color:var(--c,var(--ink3));
 background:radial-gradient(120% 90% at 20% 15%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),radial-gradient(90% 80% at 90% 100%,color-mix(in srgb,var(--c) 22%,transparent),transparent 65%),var(--bg2)}
.art:before{content:"";position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(115deg,transparent 0 9px,color-mix(in srgb,var(--c) 7%,transparent) 9px 10px)}
.art svg{position:absolute;left:-8%;bottom:-10%;width:78%;height:78%;opacity:.2;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.art .vn{position:absolute;right:13%;top:12%;writing-mode:vertical-rl;font:700 22px/1.05 var(--serif);letter-spacing:.14em;color:var(--ink);opacity:.82}
.art .seal{position:absolute;right:calc(13% - 4px);bottom:11%;width:22px;height:22px;border-radius:4px;background:var(--c);color:#fff;font:700 12px/22px var(--serif);text-align:center;opacity:.9}
.dav{position:relative}.dav .art .vn{font-size:15px;right:12%;top:10%}.dav .art .seal{width:16px;height:16px;font-size:9px;line-height:16px;bottom:8%;right:8%}
.aitag{position:absolute;right:6px;bottom:6px;padding:1px 6px;border-radius:5px;font-size:10px;color:#fff;background:rgba(0,0,0,.45)}
.badge{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:6px;font-size:11px;color:#fff;background:var(--c,#555)}
.new{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:6px;font-size:11px;background:var(--seal);color:#fff}
.cb{padding:10px 12px 12px}
.cn{font:700 16px/1.3 var(--serif)}
.ct{font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{font-size:11.5px;color:var(--ink3);margin-top:6px}
.empty{text-align:center;color:var(--ink3);padding:40px 0}
footer{color:var(--ink3);font-size:12px;line-height:1.7;text-align:center;padding:40px var(--g) calc(env(safe-area-inset-bottom) + 30px)}
footer a{color:inherit}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;max-width:720px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.grab{position:absolute;left:50%;top:7px;width:38px;height:5px;border-radius:9px;background:var(--line);transform:translateX(-50%)}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg2);font-size:18px;cursor:pointer;display:grid;place-items:center}
.ib[hidden]{visibility:hidden;display:grid}
.sh .sp{flex:1}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px calc(env(safe-area-inset-bottom) + 28px)}
.dhead{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.dav{flex:none;width:92px;height:92px;border-radius:18px;overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.dav img{width:100%;height:100%;object-fit:cover;object-position:top}
.dav .mono{font-size:44px}
.dn{font:700 28px/1.2 var(--serif);margin:0;letter-spacing:.03em}
.dt{color:var(--ink2);font-size:14.5px;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 16px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.fact small{display:block;font-size:11.5px;color:var(--ink3)}
.fact span{font-size:14.5px}
.desc{font-size:16.5px;line-height:1.85;margin:0 0 18px;text-align:justify}
.rel h3{font:600 13px var(--sans);color:var(--ink3);margin:0 0 8px;letter-spacing:.1em}
.rels{display:flex;flex-wrap:wrap;gap:8px}
.rels button{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.rels button:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3));margin-right:7px;vertical-align:1px}
.rels span{height:36px;line-height:34px;padding:0 14px;border-radius:99px;border:1px dashed var(--line);color:var(--ink3);font-size:14px}
.src{display:inline-block;margin-top:20px;font-size:12.5px;color:var(--ink3)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
@media (min-width:700px){.hero{min-height:380px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
</style>
</head>

url": "https://rmji.wiki/zh/characters/crooked-soul/"}, {"name": "墨大夫", "category": "人物", "tagline": "为夺舍而培养韩立的神手谷医师", "desc": "墨大夫本名墨居仁，是七玄门供奉、神手谷大夫，收韩立与张铁为弟子。他没有灵根，因遭暗算与血咒而迅速衰老，便与余子童合谋，培养韩立修炼长春功以图夺舍。他逼韩立服下尸虫丸，最终夺舍失败身死，遗书则牵出嘉元城墨家的后事。", "first_ep": 1, "realm": "凡人", "faction": "七玄门", "related": ["韩立", "张铁", "余子童", "曲魂", "七玄门"], "img": "img/doctor-mo.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/doctor-mo/"}, {"name": "元瑶", "category": "人物", "tagline": "为救师姐，不惜碎丹的散修女子", "desc": "元瑶出身魁星岛附近海岛，与妍丽情同姐妹，约百年修至结丹初期。她在虚天殿将啼魂兽交给韩立，并取得养魂木，欲以还魂术救回肉身被毁的妍丽。施术时金丹碎裂，又被鬼雾卷入阴冥之地，最终与妍丽共修阴阳轮回诀。", "first_ep": 66, "realm": "金丹已碎", "faction": "散修", "related": ["妍丽", "韩立", "啼魂兽", "阴阳轮回诀", "阴冥之地"], "img": "img/yuan-yao.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/yuan-yao/"}, {"name": "极阴祖师", "category": "人物", "tagline": "为夺虚天鼎，处处算计韩立", "desc": "乱星海魔道头面人物，乌丑的祖父，曾背叛师父玄骨。他在虚天殿强收韩立为记名弟子，利用血玉蜘蛛取鼎，又以天都尸火和天都尸参战。乌丑死后，他命弟子冒用韩立之名杀人夺宝，欲将韩立活捉抽魂。", "first_ep": 69, "realm": "元婴初期", "faction": "极阴岛", "related": ["韩立", "乌丑", "玄骨", "虚天鼎", "天都尸火"], "img": "img/zenith-yin.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zenith-yin/"}, {"name": "至木灵婴", "category": "人物", "tagline": "御灵宗逃出的凶悍灵婴", "desc": "形似异变元婴的绿色灵婴，是御灵宗最早炼成、也最凶悍的五行灵婴，千余年已自生灵智。它企图吞噬韩立的元婴，反被辟邪神雷封印。它可与木灵根修士融合，使其立获元婴期修为，但寿元不增、修为停滞；韩立对是否用它炼第二元婴仍犹豫不决。", "first_ep": 160, "realm": "不详（具元婴之形）", "faction": "原属御灵宗（现被韩立封印）", "related": ["韩立", "御灵宗", "柳玉", "辟邪神雷", "玄牡化婴大法"], "img": "img/second-nascent-soul.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/second-nascent-soul/"}, {"name": "南陇侯", "category": "人物", "tagline": "仪仗如帝王的神识强者", "desc": "实力强大、性情古怪的元婴修士，出行时随从众多，车驾由两头灵兽拉动。他在韩立前往阗天城途中提出强行交易，欲以两名侍妾换走慕沛灵，遂与韩立比拼神识。双方罢手后，他对韩立心生忌惮，传音邀其在交易会第四天会面，并留下地图玉简。交易会第四日他召集密会，与云道友发起探访苍坤上人洞府之行，以定星盘带众人走出慕兰人的法阵。玉矶阁中他被云道友以银轮偷袭重伤，并被揭出是苍坤上人唯一的后人；危急时他把一只玉盒抛给韩立，引开众人。", "first_ep": 167, "realm": "元婴中期", "faction": "不详", "related": ["韩立", "云道友", "苍坤上人", "定星盘", "王天古"], "img": "img/marquis-nanlong.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/marquis-nanlong/"}, {"name": "玄骨", "category": "人物", "tagline": "散婴化魂，终究死于圣火反噬", "desc": "玄骨自称萧诧，是极阴祖师的师父，活了六百余年后散去元婴，化为玄魂之体。他在虚天殿与韩立暂时结盟又彼此算计，并杀死乌丑。夺取虚天鼎时，他强炼修罗圣火却失控，逃走时被韩立截住，最终遭火星烧为灰烬，只留下记载玄阴经的肋骨玉简。", "first_ep": 94, "realm": "元婴（已散去元婴，化为魂体）", "faction": "散修（已陨落）", "related": ["韩立", "极阴祖师", "乌丑", "修罗圣火", "虚天鼎"], "img": "img/bone-sage.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/bone-sage/"}, {"name": "妍丽", "category": "人物", "tagline": "肉身尽毁，仍与元瑶相伴", "desc": "魁星岛附近海岛的散修，与元瑶一同长大，初遇韩立时约炼气期十层。她被青阳门少主骗作炉鼎，姐妹联手杀少主后，她的肉身遭反噬而毁，元神只能寄居法器。还魂术被鬼雾打断，她虽魂魄凝实却未能附身，遂在阴冥之地与元瑶共修阴阳轮回诀。", "first_ep": 66, "realm": "不详", "faction": "散修", "related": ["元瑶", "韩立", "阴阳轮回诀", "阴冥之地", "还魂术"], "img": "img/yan-li.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/yan-li/"}, {"name": "蛮胡子", "category": "人物", "tagline": "托天魔功大成的魔道巨擘", "desc": "寿元将尽的魔道修士，为寻延寿灵果进入虚天殿，曾强占韩立的座位。其托天魔功防御强横，夺鼎时与极阴祖师等人合作，后因补天丹反目，并制住万天明的肉身夺丹而走。", "first_ep": 95, "realm": "元婴中期", "faction": "魔道", "related": ["韩立", "极阴祖师", "万天明", "玄骨", "托天魔功"], "img": "img/man-huzi.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/man-huzi/"}, {"name": "厉飞雨", "category": "人物", "tagline": "韩立在七玄门结下的挚友", "desc": "七玄门弟子，以风雷刀法闯出“厉虎”之名，因服用抽髓丸与韩立结识，两人以止痛药交换武功，渐成好友。他倾慕张袖儿，屡立战功，最终被王绝楚收为关门弟子，出任外刃堂堂主。", "first_ep": 2, "realm": "凡人", "faction": "七玄门", "related": ["韩立", "张袖儿", "王绝楚", "七玄门", "抽髓丸"], "img": "img/li-feiyu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/li-feiyu/"}, {"name": "慕沛灵", "category": "人物", "tagline": "为避婚约而成为韩立侍妾", "desc": "落云宗天泉峰弟子，精于炼丹，韩立初入宗门时曾替她照料药园。为摆脱家族安排的婚约，她自称韩立侍妾，随后接受神魂禁制弄假成真，并随韩立、吕洛前往阗天城交易会。韩立出发探访苍坤洞府前，把她托付给吕洛照看，并叮嘱她贴身带好护身玉佩。", "first_ep": 147, "realm": "筑基中期", "faction": "落云宗", "related": ["韩立", "吕洛", "南陇侯", "落云宗", "颠凤培元功"], "img": "img/mu-peiling.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/mu-peiling/"}, {"name": "李化元", "category": "人物", "tagline": "将韩立收入门下的黄枫谷长老", "desc": "黄枫谷结丹长老，因禁地收获将韩立收为记名弟子，后正式收徒，并赠予《青元剑诀》。他身具三阳之体，修炼《真阳诀》，六派迁往九国盟后，在与慕兰法士的激战中陨落。", "first_ep": 11, "realm": "结丹期", "faction": "黄枫谷", "related": ["韩立", "黄枫谷", "红拂师伯", "宋蒙", "刘靖"], "img": "img/li-huayuan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/li-huayuan/"}, {"name": "吕洛", "category": "人物", "tagline": "护送韩立赴阗天城的宗门师兄", "desc": "落云宗元婴长老，师从木离上人，修炼千浪诀。韩立结婴时他曾到场主持局面，后护送韩立与慕沛灵前往阗天城；见识韩立神识化形后大为震惊，戒备也随之消退。", "first_ep": 156, "realm": "元婴期", "faction": "落云宗", "related": ["韩立", "慕沛灵", "南陇侯", "火龙童子", "落云宗"], "img": "img/lu-luo.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/lu-luo/"}, {"name": "万天明", "category": "人物", "tagline": "执掌万法门的正道领袖", "desc": "万法门门主，修炼天罗功法，在虚天殿中以金蚕夺鼎，并与蛮胡子多次交锋。补天丹现世后，他元婴离体施展天罗真雷，却被蛮胡子脱困制住肉身，被迫交出丹药。", "first_ep": 95, "realm": "元婴中期", "faction": "万法门", "related": ["蛮胡子", "极阴祖师", "天悟子", "虚天鼎", "补天丹"], "img": "img/wan-tianming.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wan-tianming/"}, {"name": "向之礼", "category": "人物", "tagline": "老练圆滑的禁地同行者", "desc": "向之礼是黄枫谷年长的炼气期弟子，禁地之行前想联合低修为弟子结伴，被韩立拒绝。入禁地后与两名他派修士同行，最后独自逃出，交出两株紫猴花，出禁地时记为炼气期十层。", "first_ep": 11, "realm": "炼气期", "faction": "黄枫谷", "related": ["韩立", "黄枫谷"], "img": "img/xiang-zhili.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/xiang-zhili/"}, {"name": "王蝉", "category": "人物", "tagline": "戴恶鬼面具的鬼灵门少主", "desc": "王蝉是鬼灵门门主之子，与燕如嫣以同生共死咒术定下婚约，并策划以燕翎堡修士魂魄修炼血灵大法。他追杀韩立时中毒退走，后又参与追击南宫婉、攻破韩立洞府，却未能阻止韩立传送离开。多年后他已是结丹后期，与燕如嫣随二伯王天古赴南陇侯的密会、同探苍坤洞府，在玉矶阁中以血雾围困韩立，被韩立斩伤。", "first_ep": 19, "realm": "结丹后期", "faction": "鬼灵门", "related": ["韩立", "燕如嫣", "王天古", "鬼灵门", "南宫婉"], "img": "img/wang-chan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wang-chan/"}, {"name": "乌丑", "category": "人物", "tagline": "活在祖父阴影下的极阴岛少主", "desc": "乌丑是极阴祖师之孙、极阴岛少岛主，行事狠辣，多倚仗祖父赐宝。他在虚天殿屡次敌视受极阴祖师看重的韩立，后奉命夺取补天丹，被玄骨毁去本命法宝并烧死。", "first_ep": 69, "realm": "结丹初期", "faction": "极阴岛", "related": ["极阴祖师", "玄骨", "韩立", "紫灵", "玄阴大法"], "img": "img/wu-chou.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wu-chou/"}, {"name": "六道极圣", "category": "人物", "tagline": "统领逆星盟的乱星海魔修", "desc": "六道极圣是温夫人之夫、温天仁之师，号称乱星海第一魔修。他与万三姑共同率领逆星盟对抗星宫，并创出引龙诀与颠凤培元功。", "first_ep": 95, "realm": "元婴后期", "faction": "逆星盟", "related": ["温天仁", "逆星盟", "魔道", "颠凤培元功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/archsaint-of-the-six-paths/"}, {"name": "越皇", "category": "人物", "tagline": "藏身皇城的黑煞教主", "desc": "越皇表面是越国君主，实为黑煞教主，隐瞒筑基后期修为并炼出血侍与化身。他在皇城之战中以黑血刀、血灵钻强攻韩立等人，最终被法阵困住，死在韩立的符宝之下。", "first_ep": 34, "realm": "筑基后期", "faction": "黑煞教", "related": ["韩立", "黑煞教", "刘靖", "血灵钻", "血凝五行丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/emperor-of-yue/"}, {"name": "辛如音", "category": "人物", "tagline": "以遗著助韩立的阵法师", "desc": "辛如音精通阵法，是齐云霄的挚友，后以其未亡人自居。她为韩立修复上古传送阵并留下阵法著述，因龙吟之体经脉枯萎而去世；韩立覆灭付家后，到她的旧居祭拜。", "first_ep": 30, "realm": "不详（已故）", "faction": "散修", "related": ["齐云霄", "韩立", "付家", "上古传送阵"], "img": "img/xin-ruyin.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/xin-ruyin/"}, {"name": "凌玉灵", "category": "人物", "tagline": "雌雄莫辨的星宫外事执法", "desc": "凌玉灵是天星城星宫外事执法，容貌俊美，因修炼驻颜功法而难辨性别。遭逆星盟修士追杀时被韩立所救，事后带韩立入城并邀请其加入星宫，遭婉拒后前往内宫禀报南明岛遇袭之事。", "first_ep": 120, "realm": "不详", "faction": "星宫", "related": ["韩立", "星宫", "天星城", "逆星盟"], "img": "img/ling-yuling.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/ling-yuling/"}, {"name": "天星双圣", "category": "人物", "tagline": "统治星宫的天星城双城主", "desc": "天星双圣是天星城两位城主，统治管辖乱星海的星宫，传闻为元婴后期乃至化神期修士。二人修炼元磁神光，无法长期离城。叛乱四起时，关于他们修为尽失或即将出关的说法并存，星宫未作明确回应。", "first_ep": 73, "realm": "传闻元婴后期或化神期", "faction": "星宫", "related": ["星宫", "天星城", "元磁神光", "逆星盟", "乱星海"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/heavenly-star-sages/"}, {"name": "风希", "category": "人物", "tagline": "为炼风雷翅囚禁韩立的妖修", "desc": "风希是化为人形的九级裂风兽，精明狠厉，将人类视作工具。他逼迫韩立以木属性灵力协助炼制风雷翅，却被韩立用药液制住众妖并夺走法宝。跨海追杀失败后，他盛怒之下毁去妙鹤真人的肉身。", "first_ep": 127, "realm": "九级妖兽（化形第二阶段）", "faction": "妖族", "related": ["韩立", "风雷翅", "毒蛟", "妙鹤真人", "碧焰酒"], "img": "img/feng-xi.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/feng-xi/"}, {"name": "令狐老祖", "category": "人物", "tagline": "黄枫谷唯一的元婴太上长老", "desc": "令狐老祖是黄枫谷太上长老，近千年来宗内唯一的元婴修士。七派溃败后，他决定撤离越国，并挑选资质出众的弟子先行离开，其余弟子负责拖延敌人；韩立当时被他列入可舍弃之人。", "first_ep": 49, "realm": "元婴期", "faction": "黄枫谷", "related": ["黄枫谷", "韩立", "钟灵道", "越国", "惊龙钟"], "img": "img/ancestor-linghu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/ancestor-linghu/"}, {"name": "柳玉", "category": "人物", "tagline": "携六翼霜蚣拜入韩立门下", "desc": "柳玉原是御灵宗修士，身具木属性灵根，与菡云芝一同追查至木灵婴。被韩立擒获后，她为求自保请求拜师，最终以虫卵、灵虫和驭虫之术为礼，成为韩立记名弟子，改名柳眉加入落云宗，任白凤峰副峰主。", "first_ep": 160, "realm": "结丹期", "faction": "落云宗", "related": ["韩立", "菡云芝", "至木灵婴", "六翼霜蚣", "落云宗"], "img": "img/liu-yu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/liu-yu/"}, {"name": "王绝楚", "category": "人物", "tagline": "善以机关与权谋御敌的门主", "desc": "王绝楚是七玄门门主、七绝上人嫡系后人，因墨大夫救命之恩请其入宗担任供奉。落日峰之战中，他以山中机关迫使野狼帮谈判，并在韩立歼敌后获胜。事后他收厉飞雨为关门弟子，也曾庇护韩立的三叔。", "first_ep": 2, "realm": "不详", "faction": "七玄门", "related": ["七玄门", "墨大夫", "厉飞雨", "贾天龙", "韩立"], "img": "img/wang-juechu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wang-juechu/"}, {"name": "董萱儿", "category": "人物", "tagline": "媚术出众、心高气傲的合欢宗女修", "desc": "董萱儿出身黄枫谷，师从红拂，修习化春诀，举止常带狐媚之态。红拂曾想将她许配韩立，遭拒后命韩立护送她前往燕翎堡。她后来加入合欢宗，结丹后曾派人持韩立画像四处寻找。", "first_ep": 18, "realm": "结丹期", "faction": "合欢宗", "related": ["韩立", "红拂师伯", "王蝉", "黄枫谷"], "img": "img/dong-xuaner.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/dong-xuaner/"}, {"name": "宋蒙", "category": "人物", "tagline": "好斗重义、精研五行法术的武痴", "desc": "宋蒙是李化元四弟子、韩立的四师兄，擅长五行法术实战，性情好斗。与韩立切磋落败后，他屡次邀战，两人逐渐交好。越京之战中，他以蓝丝剑重创黑煞教弟子，并用长枪符宝逼出冰妖。", "first_ep": 18, "realm": "筑基期", "faction": "黄枫谷", "related": ["韩立", "李化元", "刘靖", "钟卫娘", "越皇"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/song-meng/"}, {"name": "范夫人", "category": "人物", "tagline": "精于谋算、能凭气味识人的妙音门主", "desc": "范夫人本名范静梅，初为妙音门左使，因收购妖兽材料结识韩立，并以天雷竹为酬邀他夺货。她后来借魔道之力自立门主，却受云天啸掣肘，最终以幻梦石等条件换取韩立出手。她天生对气味过目不忘，曾据此认出韩立。", "first_ep": 77, "realm": "筑基后期", "faction": "妙音门", "related": ["韩立", "紫灵", "云天啸", "文思月", "妙音门"], "img": "img/lady-fan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/lady-fan/"}, {"name": "严氏", "category": "人物", "tagline": "胆识过人、善于权谋的墨家四夫人", "desc": "严氏是墨大夫的第四房夫人兼表妹，墨彩环之母，曾以代理会主身份主持惊蛟会。她在嘉元城与韩立谈判，以暖阳宝玉换取他击杀欧阳飞天。墨府被毁后，她与墨彩环辗转燕翎堡，身患重病时得韩立诊治。", "first_ep": 7, "realm": "凡人", "faction": "燕翎堡", "related": ["墨大夫", "墨彩环", "韩立", "墨玉珠", "暖阳宝玉"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/lady-yan/"}, {"name": "梅凝", "category": "人物", "tagline": "身具罕见体质、与韩立共渡绝境的女修", "desc": "梅凝被鬼雾卷入阴冥之地，与兄长失散且法力尽失，后结识韩立并同行。她以口对口传递通灵之气，助韩立短暂恢复法力，换取对方带自己离开。脱困抵达天南后，韩立婉拒纳她为侍妾，赠她两瓶妖丹所炼灵药。", "first_ep": 140, "realm": "筑基中期", "faction": "无", "related": ["韩立", "紫灵", "阴冥之地", "温天仁", "风雷翅"], "img": "img/mei-ning.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/mei-ning/"}, {"name": "燕如嫣", "category": "人物", "tagline": "身具天灵根、与鬼灵门联姻的燕家女", "desc": "燕如嫣是燕家老祖最疼爱的玄孙女，身具天灵根。鬼灵门以燕家回归宗门为条件，安排她与少门主王蝉成婚，共同修炼血灵大法。她携紫云旗参与订立生死咒，王蝉还提出以七派修士魂魄作为聘礼。多年后她已是王蝉之妻，随王蝉同探苍坤洞府，借一株阴凝草向韩立表示燕翎堡之事她并不知情，韩立冷冷回答后果该由她父亲承担。玉矶阁中她奉命协助拖住韩立。", "first_ep": 19, "realm": "不详", "faction": "鬼灵门", "related": ["王蝉", "王天古", "燕家", "鬼灵门", "燕翎堡"], "img": "img/yan-ruyan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/yan-ruyan/"}, {"name": "青易居士", "category": "人物", "tagline": "荒岛散修，虚天殿中的精明盟友", "desc": "身穿儒衫的元婴散修，独居荒岛，为人老练狡猾。他在虚天殿与极阴祖师、蛮胡子合作，想收韩立为徒传承衣钵未果，转而谋求补天丹。取鼎时以飞针、青棘鸟等手段参战并护住韩立，还曾赠其符宝青冥针。", "first_ep": 96, "realm": "元婴期", "faction": "散修", "related": ["韩立", "极阴祖师", "蛮胡子", "万天明", "虚天鼎"], "img": "img/layman-qing-yi.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/layman-qing-yi/"}, {"name": "齐云霄", "category": "人物", "tagline": "以炼器结交韩立的落魄子弟", "desc": "神兵门炼器长老之后，精通炼器，曾以颠倒五行阵器具和《云霄心得》与韩立交易，并与辛如音合力改良阵具。他倾心辛如音，后被齐家逐出，又遭付家追杀，重伤逃至辛如音处身亡。韩立灭付家嫡系后，携付家老祖首级祭奠二人。", "first_ep": 16, "realm": "炼气期第九层", "faction": "无（原齐家外支弟子）", "related": ["韩立", "辛如音", "付家", "颠倒五行阵", "元武国"], "img": "img/qi-yunxiao.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/qi-yunxiao/"}, {"name": "孙二狗", "category": "人物", "tagline": "从码头小头目到四平帮帮主", "desc": "嘉元城四平帮小头目，与黑熊谋劫韩立不成，反被腐心丸控制，从此替韩立打探消息。他借引魂钟驱使曲魂夺得帮主之位，后来获韩立彻底解毒。韩立重返嘉元城时又解其暗毒，他交还引魂钟，并立誓孙家世代奉韩立为主；多年后他与四平帮均已不在。多年后，他的第七代玄孙孙火在落云宗修行，凭他留下的半张符纸被韩立认出。", "first_ep": 7, "realm": "凡人", "faction": "原四平帮", "related": ["韩立", "曲魂", "引魂钟", "嘉元城", "孙火"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/sun-ergou/"}, {"name": "金光上人", "category": "人物", "tagline": "携升仙令逃亡的贪金侏儒修士", "desc": "出身金光观的侏儒修士，酷爱黄金，受贾天龙重金雇用进攻七玄门。他以金色护罩和灰色小剑符箓连杀七玄门高手，却被韩立夺去剑符，又被骗撤去护罩，死于火弹术。他实为秦家最后男丁，因叶家觊觎升仙令而出逃，遗物使韩立得以进入黄枫谷。", "first_ep": 6, "realm": "不详", "faction": "金光观（秦家最后男丁）", "related": ["韩立", "贾天龙", "升仙令", "秦家", "叶家"], "img": "img/monk-golden-light.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/monk-golden-light/"}, {"name": "陈巧倩", "category": "人物", "tagline": "冷傲同门，越京战后袒露婚约", "desc": "黄枫谷女修，陈胖子的侄女，起初轻视韩立，得知其战绩后大为震惊。越京之行中，她认定韩立就是当年救自己的人，并在对越皇一战催动红色符宝，与钟卫娘合力毁去黑血刀。此后她邀韩立同游白菊山，告知大战后将嫁与入赘陈家的秦家弟子，随即冷淡离去。", "first_ep": 27, "realm": "不详", "faction": "黄枫谷", "related": ["韩立", "黄枫谷", "钟卫娘", "越皇", "宋蒙"], "img": "img/chen-qiaoqian.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/chen-qiaoqian/"}, {"name": "墨彩环", "category": "人物", "tagline": "无灵根的墨府幼女", "desc": "墨大夫与严氏的小女儿，性情直率火爆，在墨府初见韩立便讨要见面礼，得到萦香丸。墨府被毁后，她随母亲逃至燕翎堡，韩立替母女解决求亲者纠缠，并赠灵石与保持容颜的丹药。她因没有灵根无法修仙，后来在动乱中与母亲逃散，下落不明。", "first_ep": 7, "realm": "凡人", "faction": "无", "related": ["韩立", "墨大夫", "严氏", "墨凤舞", "燕翎堡"], "img": "img/mo-caihuan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/mo-caihuan/"}, {"name": "余子童", "category": "人物", "tagline": "寄居墨大夫体内的夺舍阴谋者", "desc": "出身修仙家族，长春功止步第七层，失去肉身后寄居墨大夫体内，并为其提供夺舍法门。两人合谋以韩立为躯壳，失败后余子童试图与韩立交易，却被毒液压制，最终元神消散于阳光下。他还参与将张铁炼成尸人。", "first_ep": 4, "realm": "炼气期", "faction": "无", "related": ["韩立", "墨大夫", "曲魂", "张铁", "严氏"], "img": "img/yu-zitong.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/yu-zitong/"}, {"name": "菡云芝", "category": "人物", "tagline": "韩立两度手下留情的旧识", "desc": "原灵兽山弟子，血色试炼中曾被韩立所救，后进入御灵宗并结丹。她与柳玉奉命寻找至木灵婴，追踪韩立失败后乘雪白飞禽逃走；韩立认出她，念及旧情仅将其击晕。她返回宗门复命，并隐瞒了自己被饶过一命之事。", "first_ep": 14, "realm": "结丹初期", "faction": "御灵宗", "related": ["韩立", "柳玉", "至木灵婴", "御灵宗", "灵兽山"], "img": "img/han-yunzhi.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/han-yunzhi/"}, {"name": "妙鹤真人", "category": "人物", "tagline": "追击韩立反被风希毁去肉身", "desc": "碧云门太上长老，曾相助妙音门修建传送法阵，并指名要文思月做炉鼎。他识破韩立身份后，觊觎其风雷翅而一路追击，以玉锤、蓝色古镜及血鹤遁术应敌。韩立借法阵逃脱后，风希毁去妙鹤肉身，他仅剩元婴逃回洞府。", "first_ep": 124, "realm": "元婴期", "faction": "碧云门", "related": ["韩立", "风希", "文思月", "范夫人", "云天啸"], "img": "img/daoist-master-swift-crane.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/daoist-master-swift-crane/"}, {"name": "张袖儿", "category": "人物", "tagline": "厉飞雨倾心相爱的七玄门弟子", "desc": "七玄门李长老的侄女，也是七绝堂核心弟子。韩立为李长老解毒时与她相识，她与厉飞雨感情日深，后来已开始商议婚事。野狼帮攻山时，她被选入落日峰死斗名单，厉飞雨决意与她并肩出战。", "first_ep": 5, "realm": "凡人", "faction": "七玄门", "related": ["厉飞雨", "韩立", "七玄门", "贾天龙", "王绝楚"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zhang-xiuer/"}, {"name": "文思月", "category": "人物", "tagline": "宁死不愿做炉鼎的妙音门女修", "desc": "文樯之女，妙音门筑基修士，早年守寡，因拒绝与师父近亲双修而遭排挤。她在黑市提出以八级裂风兽巢穴的消息换取自由，韩立遂用材料将她救下，并解除她做妾的承诺。临别前，韩立赠她丹药，她随即闭关炼化。", "first_ep": 94, "realm": "筑基期", "faction": "妙音门", "related": ["韩立", "妙音门", "妙鹤真人", "云天啸", "范夫人"], "img": "img/wen-siyue.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wen-siyue/"}, {"name": "贾天龙", "category": "人物", "tagline": "倚仗金光上人围攻七玄门的金狼", "desc": "野狼帮帮主，人称“金狼”，以红衣铁卫和军用连弩围攻七玄门，并重金请金光上人助阵。落日峰死斗中，金光上人被韩立击杀，贾天龙拒绝自断经脉，命铁卫放箭反击，最终被韩立以火弹术击杀。", "first_ep": 3, "realm": "凡人", "faction": "野狼帮", "related": ["韩立", "金光上人", "王绝楚", "七玄门", "厉飞雨"], "img": "img/jia-tianlong.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/jia-tianlong/"}, {"name": "天晶真人", "category": "人物", "tagline": "以幻术布阁，主持元婴交换会", "desc": "九国盟修士，阗天城晶龙阁主人，擅长幻术，与火龙童子、吕洛相熟。他主持蒙面交换会，拿出数只结丹初期实力的上古傀儡兽换取魂石，其中六只被韩立换走。", "first_ep": 169, "realm": "元婴期", "faction": "九国盟", "related": ["韩立", "火龙童子", "吕洛", "阗天城", "魂石"], "img": "img/daoist-heavencrystal.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/daoist-heavencrystal/"}, {"name": "温天仁", "category": "人物", "tagline": "六道传人，恃强邀战终殒命", "desc": "逆星盟神鸠堂堂主，六道极圣弟子，神识可比元婴修士。他逼韩立效力遭拒，以六极真魔功和八门金光镜与之激战，并借万年灵液对峙一夜未能取胜。鬼雾中遁光法器失灵后，他被韩立以青色小剑贯穿咽喉杀死。", "first_ep": 136, "realm": "结丹后期", "faction": "逆星盟", "related": ["韩立", "六道极圣", "紫灵", "元瑶", "八门金光镜"], "img": "img/wen-tianren.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/wen-tianren/"}, {"name": "雷万鹤", "category": "人物", "tagline": "雷法诛敌，古方换取老药草", "desc": "黄枫谷结丹长老，韩立称其为雷师伯，修炼雷属性功法。他在太岳山脉消灭围攻韩立洞府的千竹教修士，识破韩立隐瞒林师兄元神之事却未追究。为突破瓶颈，他用聚灵丹、炼气散两张上古丹方换走韩立的两株老药草。", "first_ep": 17, "realm": "结丹期", "faction": "黄枫谷", "related": ["韩立", "李化元", "太岳山脉", "颠倒五行阵", "黄枫谷"], "img": "img/lei-wanhe.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/lei-wanhe/"}, {"name": "墨玉珠", "category": "人物", "tagline": "墨府长女，护夫阻下复仇一剑", "desc": "墨大夫长女，与墨彩环、墨凤舞并称墨氏三姐妹，曾与冒名求亲的吴剑鸣周旋。她后来嫁给五色门主之子并育有女儿缨宁，在韩立前来复仇时挺身护住丈夫。韩立最终放过其夫，并赠缨宁通灵玉；此后他再访嘉元城，未能打听到母女下落。", "first_ep": 7, "realm": "凡人", "faction": "墨府", "related": ["墨大夫", "韩立", "墨彩环", "墨凤舞", "嘉元城"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/mo-yuzhu/"}, {"name": "刘靖", "category": "人物", "tagline": "血手煞神，火鸟焚邪遭暗算", "desc": "李化元三弟子、韩立三师兄，嫉恶如仇，率队突袭黑煞教。他以蚕帕护住同门，又耗尽火鸟真宝焚杀青纹及两个血侍光茧。黑煞教教主现身后，刘靖遭暗处的越皇偷袭，被刺穿胸口而死。", "first_ep": 37, "realm": "筑基中期", "faction": "黄枫谷", "related": ["韩立", "李化元", "钟卫娘", "宋蒙", "越皇"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/liu-jing/"}, {"name": "天悟子", "category": "人物", "tagline": "正道老道，驱龟参与夺鼎战", "desc": "乱星海正道元婴修士，天缘子师弟，与万天明结盟，传闻持有虚天殿残图。他在虚天殿内与万天明借寒蛟、离龟阻拦蛮胡子，试图以金丝蚕拖出虚天鼎但未成功。随后正魔开战，他驱使离龟迎敌，并与青易居士交手。", "first_ep": 95, "realm": "元婴期", "faction": "乱星海正道", "related": ["万天明", "青易居士", "蛮胡子", "极阴祖师", "虚天鼎"], "img": "img/tian-wuzi.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/tian-wuzi/"}, {"name": "张铁", "category": "人物", "tagline": "憨厚少年，遭毒手炼为曲魂", "desc": "张铁与韩立同为七玄门记名弟子，被墨大夫收入神手谷，两人性情相投，成为无话不谈的好友。他修炼口诀毫无进展，改练痛苦异常的象甲功，失踪前已至第三层。其实他被墨大夫与余子童擒住、剥离魂魄，躯体炼成炼尸，韩立收服后为其取名曲魂。", "first_ep": 1, "realm": "凡人（躯体已炼为尸人）", "faction": "七玄门", "related": ["韩立", "曲魂", "墨大夫", "余子童", "神手谷"], "img": "img/zhang-tie.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zhang-tie/"}, {"name": "杜东", "category": "人物", "tagline": "潜伏落云宗的千幻宗少主", "desc": "杜东与韩立一同进入落云宗天泉峰，表面以炼气十层修为协助制符，并凭寒月轮入选试剑大会。他实为魔道千幻宗少主，施展大罗千幻诀后显露结丹中期修为。禁地夺液时身份败露，他在天煞真君掩护下带着灵眼之树醇液脱身。", "first_ep": 147, "realm": "结丹中期", "faction": "千幻宗", "related": ["韩立", "落云宗", "魔道"], "img": "img/du-dong.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/du-dong/"}, {"name": "程天坤", "category": "人物", "tagline": "登门道贺韩立结婴的银发长老", "desc": "程天坤是落云宗的银发元婴长老，也是吕洛的师兄，韩立称其为程师兄。韩立结婴天象散去后，他与吕洛遣走聚在山外的弟子，随后到洞府外道贺，并请求入内一叙。", "first_ep": 156, "realm": "元婴期", "faction": "落云宗", "related": ["韩立", "吕洛", "落云宗"], "img": "img/cheng-tiankun.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/cheng-tiankun/"}, {"name": "红拂师伯", "category": "人物", "tagline": "黄枫谷护短的结丹女修", "desc": "红拂师伯是黄枫谷结丹修士中唯一的女修，法力在宗内名列前茅，以护短著称。她是董萱儿的师父兼姑姑，曾选中韩立作董萱儿的双修伴侣，亲事作罢后仍让韩立陪同前往燕家夺宝大会。她与李化元、雷万鹤等人议事后，黄枫谷与七派迅速行动起来。", "first_ep": 9, "realm": "结丹期", "faction": "黄枫谷", "related": ["董萱儿", "李化元", "韩立", "钟灵道", "黄枫谷"], "img": "img/hong-fu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/hong-fu/"}, {"name": "金青", "category": "人物", "tagline": "邀韩立探古修遗址的结丹散修", "desc": "金青是居于天星城的结丹期散修，洞府与韩立相邻，曾在韩立结丹时加以指点。他凭珍珠中的半幅古地图邀韩立破解遗址大阵，主要法宝是一枚可变大砸敌的白色大印。面对现身索要躯体的绿影，他告罪后丢下韩立逃向石阶，被白骨穿透护体银芒而死。", "first_ep": 87, "realm": "结丹期", "faction": "散修", "related": ["韩立", "天星城", "乱星海"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/jin-qing/"}, {"name": "钟卫娘", "category": "人物", "tagline": "十六岁筑基的李化元七弟子", "desc": "钟卫娘是李化元的第七弟子、韩立的七师姐，十六岁便已筑基，一直暗中倾心刘靖。越京之战中刘靖遇害，她誓杀越皇报仇，并与韩立、陈巧倩一同催动符宝。越皇伏诛后，她向韩立再三道谢，并准备将刘靖遗物送还刘家。", "first_ep": 37, "realm": "筑基期", "faction": "黄枫谷", "related": ["刘靖", "李化元", "韩立", "陈巧倩", "越皇"], "img": "img/zhong-weiniang.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zhong-weiniang/"}, {"name": "青纹", "category": "人物", "tagline": "从散修召集者到黑煞教血侍", "desc": "青纹道士在太南会上结识韩立，帮他穿过禁制并引见其他散修，临别却暗中留下追踪粉末。后来他以黑煞教血侍身份现身越国皇宫，凭青木真罩等法器与韩立交战。魔化后神智全失，被刘靖放出的火鸟击杀。", "first_ep": 8, "realm": "筑基中期", "faction": "黑煞教", "related": ["韩立", "黑煞教", "刘靖", "越京"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/qing-wen/"}, {"name": "奎焕", "category": "人物", "tagline": "落云宗里消息灵通的外务弟子", "desc": "奎焕是落云宗隐剑峰外务弟子，负责照看灵兽场，自称熟悉宗门各峰事务。他为捕捉雪狐向韩立借灵石，又邀韩立等人布阵猎狐。韩立不究雪狐之事后，他决意结交这位同门，并告知试剑大会的奖励。", "first_ep": 147, "realm": "炼气期", "faction": "落云宗", "related": ["韩立", "落云宗", "定灵丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/kui-huan/"}, {"name": "钟灵道", "category": "人物", "tagline": "依门规主持黄枫谷事务的掌门", "desc": "钟灵道是黄枫谷掌门，实际主要负责协调宗门事务。他依升仙令门规收韩立入门，主持筑基丹处置，又在韩立筑基后为其登记并赠送布阵器物。七派联军溃败后，他在惊龙钟召集的大会上请出令狐老祖。", "first_ep": 9, "realm": "筑基后期", "faction": "黄枫谷", "related": ["韩立", "黄枫谷", "李化元", "令狐老祖", "升仙令"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zhong-lingdao/"}, {"name": "云天啸", "category": "人物", "tagline": "架空门主的妙音门结丹长老", "desc": "云天啸是妙音门长老，曾主持结丹修士秘密交易会，并因文思月请韩立带自己离开而与其冲突。他在双峰岛架空范夫人，又以门中女子讨好妙鹤真人。范夫人设计将他引入石室后，韩立以五行环困住其法宝，将他斩首。", "first_ep": 126, "realm": "结丹中期", "faction": "妙音门", "related": ["韩立", "范夫人", "文思月", "妙鹤真人", "五行环"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/yun-tianxiao/"}, {"name": "宣乐", "category": "人物", "tagline": "为夺大挪移令暗算同行的执事", "desc": "宣乐是掩月宗对外事务执事，曾持七派征召令带韩立守卫灵石矿。魔道来袭后，众人退入矿底并遭遇血玉蜘蛛，他为独占大挪移令，故意放出蜘蛛，企图借其杀死韩立。韩立识破后将其斩首，取走遮天钟等物。", "first_ep": 22, "realm": "筑基后期", "faction": "掩月宗", "related": ["韩立", "掩月宗", "血玉蜘蛛", "遮天钟", "大挪移令"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/xuan-le/"}, {"name": "封岳", "category": "人物", "tagline": "禁地中心狠手辣的天阙堡疯子", "desc": "封岳以炼气第十三层顶峰修为进入禁地，持小刀符宝与黄罗伞，先后偷袭杀死两名女子。他与韩立交手时身法极快，却被混元珠掩护下的天雷子炸死。其踏云靴后来落入韩立手中，显著提升了韩立的移动速度。", "first_ep": 12, "realm": "炼气期", "faction": "天阙堡", "related": ["韩立", "天雷子", "混元珠", "罗烟步", "钟吾"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/feng-yue/"}, {"name": "碎魂真人", "category": "人物", "tagline": "鬼灵门元婴长老，狠辣而护短", "desc": "碎魂真人是鬼灵门元婴长老、碎魂一脉之首，性情狠毒而极护短。六弟子于洪被韩立所杀后，他借本命牌察觉死讯，先派结丹弟子捉拿凶手，随后亲自出关追查，但韩立已离开越国。", "first_ep": 162, "realm": "元婴期", "faction": "鬼灵门", "related": ["韩立", "鬼灵门", "菡云芝", "御灵宗"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/daoist-shattered-soul/"}, {"name": "钟吾", "category": "人物", "tagline": "驱使飞蛇黄蜂的灵兽山弟子", "desc": "钟吾是灵兽山炼气期弟子，善使飞蛇与巨型黄蜂。血色试炼中，他与韩立交换禁地情报却互有保留；正魔之战期间，他在灵矿地下被狂暴的白色蜘蛛拦腰杀死。", "first_ep": 13, "realm": "炼气期", "faction": "灵兽山", "related": ["韩立", "封岳", "宣乐", "灵兽山", "血玉蜘蛛"], "img": "img/zhong-wu.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/zhong-wu/"}, {"name": "墨凤舞", "category": "人物", "tagline": "精通医药的墨府二小姐", "desc": "墨凤舞是墨大夫的养女、墨府二小姐，无灵根，擅长调制灵药。墨府遭难后，她以秦言侄女身份化名住在秦宅，并恳求韩立为墨家报仇；韩立离开越京前曾暗中探望，未打扰陪老妇人诵经的她。", "first_ep": 7, "realm": "凡人", "faction": "秦家", "related": ["墨大夫", "韩立", "墨彩环", "墨玉珠", "秦家"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/mo-fengwu/"}, {"name": "火龙童子", "category": "人物", "tagline": "童颜元婴的古剑门长老", "desc": "火龙童子是古剑门元婴长老，因幼年误服灵草而一直保有孩童容貌，也是门中唯一与落云宗交好的长老。他在阗天城认出韩立曾闯三派圣地，得知其新任长老身份后便不再追究，并带韩立、吕洛参加交换会。", "first_ep": 169, "realm": "元婴期", "faction": "古剑门", "related": ["韩立", "吕洛", "古剑门", "天晶真人", "阗天城"], "img": "img/child-fire-dragon.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/child-fire-dragon/"}, {"name": "孙火", "category": "人物", "tagline": "试剑大会第三名的火云峰弟子", "desc": "孙火是落云宗火云峰的年轻弟子，在三派合办的试剑大会上拿到第三名，是落云宗弟子中名次最高的，与韩立在大会上相识。交易会期间，他在阗天城坊市被一家杂货铺掌柜咬定弄坏了一张火云符，被索赔三百灵石，双方争执不下。韩立出面以元婴威压为他解围，并从他珍藏的半张旧符认出他是孙二狗的第七代玄孙，便让他去白凤峰向柳眉请教，托吕长老照应，还赠他一把好剑。", "first_ep": 153, "realm": "炼气期（参加试剑大会时）", "faction": "落云宗", "related": ["韩立", "孙二狗", "柳玉", "落云宗", "阗天城"], "img": "img/sun-huo.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/sun-huo/"}, {"name": "小昙", "category": "人物", "tagline": "在天星城等待故人的凡人少女", "desc": "小昙是天星城下城区的凡人少女，体弱多病，无法修炼，为动画独有角色。她常到韩立的店铺小坐，一直等待低阶修仙者小秦归来。", "first_ep": 86, "realm": "凡人", "faction": "凡人（天星城）", "related": ["韩立", "天星城"], "img": "img/xiaotan.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/characters/xiaotan/"}, {"name": "虚天鼎", "category": "法宝宝物", "tagline": "藏于虚天殿内殿的通天灵宝", "desc": "扁圆双耳三足的上古宝鼎，号称乱星海第一秘宝，鼎中藏有补天丹等宝物。韩立与玄骨联手将其取出，却遭数名元婴修士追杀。此鼎无法轻易开盖，须先炼化乾蓝冰焰方能驾驭。", "first_ep": 95, "realm": "", "faction": "", "related": ["韩立", "虚天殿", "通天灵宝", "乾蓝冰焰", "补天丹"], "img": "img/heavenvoid-cauldron.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/heavenvoid-cauldron/"}, {"name": "风雷翅", "category": "法宝宝物", "tagline": "兼具风雷之力的飞行双翅", "desc": "风希率两名妖修以雷鹏骨翅炼成，韩立被迫以木属性之力调和风雷，随后趁三妖虚弱夺走。韩立以精血和辟邪神雷炼化后，可凭它高速飞遁或施展雷遁术，但雷电消耗极大。韩立靠它破冰而出、甩开古宝千重峰，又在玉矶阁中借它冲出重围。", "first_ep": 129, "realm": "", "faction": "", "related": ["韩立", "风希", "雷遁术", "辟邪神雷", "毒蛟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/thunderstorm-wings/"}, {"name": "青竹蜂云剑", "category": "法宝宝物", "tagline": "韩立以金雷竹炼成的本命飞剑", "desc": "一套木属性飞剑，炼制之法得自李化元洞府的金页。韩立以神秘小瓶催熟天雷竹为金雷竹，历时二十余年炼成七十二口，作为本命法宝；飞剑可释放辟邪神雷，银月后来成为其器灵。", "first_ep": 18, "realm": "", "faction": "", "related": ["韩立", "银月", "金雷竹", "青元剑诀", "辟邪神雷"], "img": "img/bamboo-cloudswarm-swords.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/bamboo-cloudswarm-swords/"}, {"name": "通天灵宝", "category": "法宝宝物", "tagline": "上古修士对顶级古宝的称呼", "desc": "通天灵宝本质仍是古宝，但威力极大，远超寻常古宝。银月告知韩立，虚天鼎便属此类宝物，须先炼化其中的乾蓝冰焰才能驾驭。", "first_ep": 156, "realm": "", "faction": "", "related": ["虚天鼎", "乾蓝冰焰", "银月", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/divine-spirit-treasure/"}, {"name": "元磁神山", "category": "法宝宝物", "tagline": "天星双圣城中无敌的依仗", "desc": "天星城中的一座山峰。赤火老怪曾告诉极阴祖师，天星双圣凭借此山，只要身在城内便几乎无敌。", "first_ep": 82, "realm": "", "faction": "", "related": ["天星城", "天星双圣", "极阴祖师"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/divine-essencefused-mountain/"}, {"name": "神秘小瓶", "category": "法宝宝物", "tagline": "催熟灵药的绿色小瓶", "desc": "韩立持有的绿色小瓶，又称小绿瓶，能产生促使植物发芽、生长和成熟的绿液。他借它大量培育珍稀灵药，此瓶的催熟之效举世无双，也是身具伪灵根的韩立得以突破修为的重要依仗。", "first_ep": 5, "realm": "", "faction": "", "related": ["韩立", "筑基丹", "金雷竹", "青竹蜂云剑"], "img": "img/mystic-bottle.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/mystic-bottle/"}, {"name": "神风舟", "category": "法宝宝物", "tagline": "速度极快却毫无防护的飞行法器", "desc": "韩立以墨蛟的鳍和尾为材料，请胥掌柜炼成此舟。它可载四五人，速度极快，是韩立赶路与逃遁的重要依仗，但不能保护乘坐者。", "first_ep": 17, "realm": "", "faction": "", "related": ["韩立", "墨蛟", "王蝉", "太岳山脉"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/divine-wind-boat/"}, {"name": "巨猿傀儡", "category": "法宝宝物", "tagline": "韩立用于作战与杂务的大批傀儡", "desc": "韩立大量持有的猿形傀儡，可结群射出光柱攻敌，也用于探路、守洞、看管药园和奉茶。其全力一击可比筑基中期修士，但动作简单，材料价值相当于一件顶阶法器。", "first_ep": 93, "realm": "", "faction": "", "related": ["韩立", "傀儡术", "曲魂", "极西之地"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/giant-ape-puppet/"}, {"name": "降灵符", "category": "法宝宝物", "tagline": "可借妖魂形态与力量的镇门符箓", "desc": "天符门三大镇门符箓之一，可让使用者获得所炼妖魂的形态与力量，主材料是难以用灵石购得的化形期妖兽魂魄精华。云姓掌门将炼制之法托付韩立送回天符门，并默许他自行研习。", "first_ep": 143, "realm": "", "faction": "", "related": ["韩立", "阗天城"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/spirit-subjugation-talisman/"}, {"name": "鸣魂珠", "category": "法宝宝物", "tagline": "祭炼之后可永久控制啼魂兽", "desc": "控制啼魂兽的宝物，最初由元瑶交给韩立。因啼魂兽的祭炼并未完成，贸然祭炼此珠会定期头痛；韩立取得完整法门后，趁啼魂兽沉睡进阶时将其炼成，自此可感知它的状况与情绪。", "first_ep": 106, "realm": "", "faction": "", "related": ["韩立", "元瑶", "啼魂兽"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/soul-calling-pearl/"}, {"name": "乌龙夺", "category": "法宝宝物", "tagline": "蛟龙之爪炼成的成对顶阶法器", "desc": "韩立持有的一对顶阶法器，以蛟龙之爪炼成，出手时总是两件齐放。它曾破开王蝉的阴魂丝，也参与灵矿、越京等多次斗法，两件后来均被毁去。", "first_ep": 21, "realm": "", "faction": "", "related": ["韩立", "王蝉", "神风舟", "青纹", "越皇"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/black-dragon-claws/"}, {"name": "金蚨子母刃", "category": "法宝宝物", "tagline": "一母八子、齐出攻敌的成套法器", "desc": "由一位筑基期高手炼成，含母刃一柄、子刃八柄，持母刃即可同时驱使子刃攻敌。它虽属顶级法器，威力在同级中却只属平常；韩立多次用以对敌，后有大半毁于巨型螳螂之战。", "first_ep": 11, "realm": "", "faction": "", "related": ["韩立", "封岳", "墨蛟", "青纹", "乌龙夺"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/gold-beetle-swarm-blades/"}, {"name": "大挪移令", "category": "法宝宝物", "tagline": "古传送阵中护身的蓝色令牌", "desc": "大挪移令是上古遗留的蓝色令牌，可在远距离传送时抵御空间压力，保护持有者，炼制之法早已失传。韩立从地下残破传送阵旁的五色骸骨手中取得此令，后来凭它带着曲魂摆脱追兵，传送离开。", "first_ep": 25, "realm": "", "faction": "", "related": ["韩立", "上古传送阵", "曲魂", "王蝉"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/greater-displacement-medallion/"}, {"name": "天雷子", "category": "法宝宝物", "tagline": "凝聚天地雷电的一次性杀器", "desc": "天雷子由天地雷电凝练而成，外形如蓝色圆珠，只能使用一次，爆炸威力足以灭杀筑基修士。韩立首次在万宝楼见到它，后来以此击杀封岳，又在越京混在大量符箓中掷出，令越皇法力大损。", "first_ep": 11, "realm": "", "faction": "", "related": ["韩立", "封岳", "越皇", "混元珠", "黑煞教"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/heavenly-lightning-seed/"}, {"name": "升仙令", "category": "法宝宝物", "tagline": "越国七派认令不认人的入门凭证", "desc": "升仙令是越国七大派赐予有功修仙家族的令牌，可在族间转让，发令宗门只认令牌。持令者能加入对应宗门，并获得一枚筑基丹。韩立从金光上人的遗物中得到一枚黄枫谷升仙令，凭此入谷。", "first_ep": 6, "realm": "", "faction": "", "related": ["韩立", "黄枫谷", "筑基丹", "金光上人", "秦家"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/treasures/writ-of-immortal-ascension/"}, {"name": "辟邪神雷", "category": "功法秘术", "tagline": "青竹蜂云剑蕴含的克魔金雷", "desc": "辟邪神雷是韩立以金雷竹炼成的青竹蜂云剑所带金色雷电，擅长克制鬼物与魔功，对妖族却无特殊效果。它可收放成电弧、雷网，也能封印灵力与五行之气，还可注入风雷翅施展雷遁。韩立进入元婴期后，能将其储存在体内。", "first_ep": 91, "realm": "", "faction": "", "related": ["韩立", "青竹蜂云剑", "金雷竹", "风雷翅", "至木灵婴"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/divine-devilbane-lightning/"}, {"name": "明清灵目", "category": "功法秘术", "tagline": "以灵水洗目看破隐藏之物", "desc": "明清灵目是一种灵目观察之术，需以明清灵水擦拭双目，再注入灵力施展，可看破神识无法穿透的事物，在争斗中颇有助益。韩立曾凭此术逼出伪装成小树的存在，使其现出绿色小人的形态。", "first_ep": 155, "realm": "", "faction": "", "related": ["韩立", "至木灵婴"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/brightsight-spirit-eyes/"}, {"name": "大衍诀", "category": "功法秘术", "tagline": "千竹教增强分化神识的秘术", "desc": "大衍诀由千竹教开派祖师所创，可增强并分化神识，使修炼者同时操控大量傀儡，也能稳固心神、抵御魔音幻术。韩立从林师兄处得到前四层功法，陆续修成前三层，并借其同时驾驭多件法器；第四层需在凡人之中历练心境。韩立凭它同时运转十几套阵法，独自破开苍坤洞府外的太妙神禁。", "first_ep": 17, "realm": "", "faction": "", "related": ["韩立", "傀儡术", "极西之地"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/great-development-technique/"}, {"name": "元磁神光", "category": "功法秘术", "tagline": "传说可克五行的罕见功法", "desc": "乱星海流传多年的功法，据称能克制五行，却无人真正练成。天星双圣因修炼此功，每年只能在固定日子离开天星城半个月，否则修为大退；练至大成方可摆脱束缚。", "first_ep": 82, "realm": "", "faction": "", "related": ["天星双圣", "天星城", "乱星海"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/divine-essencefused-light/"}, {"name": "雷遁术", "category": "功法秘术", "tagline": "借雷电瞬息远遁的玄妙遁术", "desc": "借雷电之力施展，速度远超寻常五行遁术，一瞬可移出百丈。韩立祭炼风雷翅后，注入雷电便能施展，曾以此躲避温天仁的攻击，并带着紫灵、梅凝遁出千里之外。", "first_ep": 132, "realm": "", "faction": "", "related": ["韩立", "风雷翅", "温天仁", "紫灵", "梅凝"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/lightning-movement-technique/"}, {"name": "乾蓝冰焰", "category": "功法秘术", "tagline": "可炼化元婴的极阴寒焰", "desc": "形似火焰却寒气极强，元婴修士也不敢触碰，还能冻结灵力。它最初环绕虚天鼎燃烧，玄骨曾驭使此火对敌；其死后，韩立将凝成的蓝色冰珠收起。此后韩立以《玄阴经》秘术炼化一缕，仍需长期温养。韩立后来用它冰封了慕兰法士穆上师的肉身，又把尤姓修士整个冻住。", "first_ep": 112, "realm": "", "faction": "", "related": ["虚天鼎", "玄骨", "韩立", "极阴祖师", "六翼霜蚣"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/celestial-ice-flames/"}, {"name": "青元剑诀", "category": "功法秘术", "tagline": "层层解锁神通的黄枫谷剑诀", "desc": "黄枫谷所藏剑修功法，李化元将抄本赠予韩立。完整功法共十三层，修炼会损失部分新炼法力，却能令法力较同阶深厚；韩立借金色书页补全功法，并获知三转重元功。结婴后，他已可修习需庚精飞剑与百余道剑光的大庚剑阵，但暂未施展。", "first_ep": 15, "realm": "", "faction": "", "related": ["韩立", "李化元", "黄枫谷", "三转重元功", "大庚剑阵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/azure-essence-sword-art/"}, {"name": "长春功", "category": "功法秘术", "tagline": "韩立踏上修仙路的启蒙功法", "desc": "须身具灵根且自幼修炼，主要增强心神与五感，练至第五层可过目不忘。韩立少年时在七玄门随墨大夫修习，靠黄龙丹、金髓丸突破，并隐瞒真实进境脱险。后来他取得一至十三层抄本，在黄枫谷练到第十一层，此后原有丹药失效。", "first_ep": 3, "realm": "", "faction": "", "related": ["韩立", "墨大夫", "七玄门", "黄龙丹", "金髓丸"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/eternal-spring-arts/"}, {"name": "傀儡术", "category": "功法秘术", "tagline": "炼制附魂傀儡并驱使其斗法", "desc": "涵盖傀儡炼制与操控，傀儡须融入生灵魂魄方能行动，且接令到动作总有延迟。此术源自极西之地的千竹教，与大衍诀的分神之能配合方显威力。韩立依《傀儡真经》炼制傀儡，并在虚天殿收取上古守卫残骸以作研究。", "first_ep": 23, "realm": "", "faction": "", "related": ["韩立", "大衍诀", "极西之地", "虚天殿", "上古傀儡兽"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/puppet-technique/"}, {"name": "搜魂术", "category": "功法秘术", "tagline": "搜查神魂的歹毒秘术", "desc": "搜魂术可搜查他人神魂中隐藏的东西，但会损伤被搜者的神识。菡云芝向御灵宗师伯复命时隐瞒被放走一事，老者看穿其说辞，并在谈话中提及此术。", "first_ep": 166, "realm": "", "faction": "", "related": ["菡云芝", "御灵宗"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/soul-search-technique/"}, {"name": "罗烟步", "category": "功法秘术", "tagline": "以体力换取爆发速度的身法", "desc": "罗烟步是韩立在七玄门荆棘林中练成的凡人身法，擅长在狭窄处见缝就钻，但体力消耗极大，难以连续施展。它不依赖灵力或法力，韩立曾与御风决配合使用，并在多次修士争斗中借其闪避、突袭。", "first_ep": 4, "realm": "", "faction": "", "related": ["韩立", "墨大夫", "厉飞雨", "越皇"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/shifting-smoke-steps/"}, {"name": "血影遁", "category": "功法秘术", "tagline": "燃烧精血化影遁出百里", "desc": "血影遁以大量且固定数量的精血为代价，使使用者化作血影，瞬间遁出百里之外，距离却无法掌控。精血不足会半途爆体，还需一对翅膀保持平衡。韩立译出记载疾风九变的妖族兽皮书后习得此术。", "first_ep": 147, "realm": "", "faction": "", "related": ["韩立", "疾风九变"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/bloodshadow-evasion/"}, {"name": "托天魔功", "category": "功法秘术", "tagline": "金鳞覆体的魔道炼体功法", "desc": "托天魔功是蛮胡子所修的炼体魔功，施展时全身金光泛起，手脚与脸上生出坚硬金鳞，兼具巨力与强韧防御。他在虚天殿中凭此功徒手击碎狼首傀儡，并仗其夺得一件钱币状古宝。", "first_ep": 102, "realm": "", "faction": "", "related": ["蛮胡子", "玄阴大法", "虚天殿", "极阴祖师"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/heavenbearing-devil-arts/"}, {"name": "玄阴大法", "category": "功法秘术", "tagline": "黑云鬼哭相伴的顶尖魔功", "desc": "玄阴大法是名列前茅的魔道功法，乌丑与极阴祖师均曾施展，黑云弥漫时伴有鬼哭尖啸。韩立从玄骨留下的玄阴经中确认其记载，并得知天都尸火须以此功为根基，且至少元婴境界才能修炼。", "first_ep": 81, "realm": "", "faction": "", "related": ["极阴祖师", "乌丑", "玄骨", "天都尸火", "托天魔功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/profound-yin-arts/"}, {"name": "三转重元功", "category": "功法秘术", "tagline": "三度散功重修以助结丹", "desc": "三转重元功是青元剑诀的辅助功法，通过三次散功重修压缩真元，以缓解结丹瓶颈；即便条件齐备，结丹把握也只有五成。韩立从金页中得知此法，完成前两转后意外结成四色金丹。", "first_ep": 18, "realm": "", "faction": "", "related": ["韩立", "青元剑诀", "结丹期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/threefold-essence-restoration/"}, {"name": "疾风九变", "category": "功法秘术", "tagline": "妖族禽鸟功法，人类难修", "desc": "妖族专为禽鸟类妖兽创制的功法，包含口诀、身法和两门秘术。人类强修口诀与身法会爆体而亡，其中隐匿气息的秘术则是无名敛气术的原型。韩立学会妖族文字后，从兽皮书中将其译出。", "first_ep": 147, "realm": "", "faction": "", "related": ["韩立", "妖族", "血影遁"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/nine-gale-transformations/"}, {"name": "天都尸火", "category": "功法秘术", "tagline": "极阴祖师的黑色魔道秘火", "desc": "天都尸火威力胜过青阳魔火，极阴极寒的法宝也只能稍加克制。此术载于玄阴经，须以玄阴大法为根基，并达到元婴期方可修炼，还会附带炼出天都尸。极阴祖师曾附身乌丑，以此火震慑众修士。", "first_ep": 81, "realm": "", "faction": "", "related": ["极阴祖师", "乌丑", "玄阴大法", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/heavenwide-corpsefire/"}, {"name": "剑影分光术", "category": "功法秘术", "tagline": "分化剑影的青元剑诀神通", "desc": "青元剑诀中的剑术神通，可从飞剑或飞刀上分出至多三道剑影。剑影初成时仅有本体十分之一的威力，剑诀练至第九层可达三分之一。韩立将青元剑诀练到第七层后，已能施展此术。", "first_ep": 16, "realm": "", "faction": "", "related": ["青元剑诀", "韩立", "青竹蜂云剑", "大庚剑阵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/swordshadow-phantasm-technique/"}, {"name": "素女轮回功", "category": "功法秘术", "tagline": "驻颜有术，法力定期轮回", "desc": "此功能让修炼者保持年轻容貌，但每隔几十年法力便会轮回一次，人也变回孩童模样。轮回期间，被封禁的法力可传给男子，修炼者自身却无法解封。南宫婉曾借此将法力传给韩立，使其暂时达到炼气十三层。", "first_ep": 15, "realm": "", "faction": "", "related": ["南宫婉", "韩立", "墨蛟", "朱雀环", "金光砖"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/greater-incarnation-arts/"}, {"name": "颠凤培元功", "category": "功法秘术", "tagline": "六道极圣所创的双修秘术", "desc": "六道极圣所创的女子双修秘术，与引龙诀配套。须由结丹期处子女修兼修，元婴男修首次采取其元阴时，可借势冲击修为瓶颈。韩立将功法收在粉红色玉简中，打算让慕沛灵结丹后兼修。", "first_ep": 158, "realm": "", "faction": "", "related": ["六道极圣", "韩立", "慕沛灵", "银月"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/techniques/inverted-phoenix-essence-art/"}, {"name": "金雷竹", "category": "丹药材料", "tagline": "万年灵竹，蕴藏辟邪神雷", "desc": "生长超过万年的天雷竹即为金雷竹，能放出克制邪术魔功的淡金色辟邪神雷。韩立以催熟之法培育出万年金雷竹，并借新竹笋解决材料不足的问题。此竹是炼制整套七十二口青竹蜂云剑的主材料。", "first_ep": 84, "realm": "", "faction": "", "related": ["天雷竹", "辟邪神雷", "青竹蜂云剑", "韩立", "玄骨"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/golden-lightning-bamboo/"}, {"name": "筑基丹", "category": "丹药材料", "tagline": "炼气修士冲击筑基的稀缺丹药", "desc": "可助炼气期修士突破筑基，越国各派合力十年也仅产千余颗，又称“升仙丸”。主药为玉髓芝、紫猴花和天灵果，均无法栽种。韩立服至第八颗时成功筑基。", "first_ep": 7, "realm": "", "faction": "", "related": ["韩立", "玉髓芝", "黄枫谷", "筑基期", "升仙令"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/foundation-establishment-pill/"}, {"name": "九曲灵参", "category": "丹药材料", "tagline": "可化身鸟兽的凝婴灵参", "desc": "天地灵气孕育的罕见灵草，能化为鸟兽虫豸，只有纯金之物能将其擒住。配合丹方可提高凝结元婴的几率。韩立在虚天殿将其捕获，后来以绿液恢复其生机并炼成丹药。", "first_ep": 95, "realm": "", "faction": "", "related": ["韩立", "玄骨", "补天丹", "虚天殿", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/ninecurl-spirit-ginseng/"}, {"name": "庚精", "category": "丹药材料", "tagline": "大庚剑阵必需的锐金之宝", "desc": "庚精是极为稀有的锐金之宝，掺入刀剑类法宝稍加祭炼，便能使其锋利程度成倍增长，乱星海已数千年未见其踪。韩立要布下大庚剑阵，须先用庚精重新祭炼青竹蜂云剑。他在阗天城的面具交换会上求购无果，交易会上出现的一份庚精最终以七十多万灵石被他人买走。", "first_ep": 158, "realm": "", "faction": "", "related": ["韩立", "大庚剑阵", "青竹蜂云剑", "青元剑诀", "乱星海"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/auric-essence/"}, {"name": "万年灵液", "category": "丹药材料", "tagline": "一口即可补满法力的珍稀灵液", "desc": "灵泉历经万年才能凝出少量灵液，小饮一口便可令法力立刻恢复，上万灵石也难买一滴。元瑶在虚天殿分赠韩立，韩立此后用它维持赶路、炼器和炼丹时的法力。", "first_ep": 118, "realm": "", "faction": "", "related": ["韩立", "元瑶", "风希", "温天仁", "虚天殿"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/myriad-year-spirit-milk/"}, {"name": "霓裳草", "category": "丹药材料", "tagline": "以异香诱妖的灵草", "desc": "生于乱星海珊瑚礁，又名诱妖草，每百年展叶一次，气味能吸引海中妖兽。韩立以绿液催熟，在外星海布阵猎妖，并用它喂养噬金虫，促使其繁衍进化。", "first_ep": 73, "realm": "", "faction": "", "related": ["韩立", "乱星海", "噬金虫", "血玉蜘蛛", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/rainbow-skirt-grass/"}, {"name": "补天丹", "category": "丹药材料", "tagline": "洗炼灵根的虚天殿奇丹", "desc": "据说能修补五行灵根，对结丹修士凝结元婴大有助益，彻底转化至少需百年。虚天殿中现出的丹药被蛮胡子夺得。韩立后来推测，极炫骸骨炼出的五色珠子才是真正的补天丹。", "first_ep": 96, "realm": "", "faction": "", "related": ["虚天鼎", "蛮胡子", "韩立", "玄骨", "九曲灵参"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/heavenmend-pill/"}, {"name": "天雷竹", "category": "丹药材料", "tagline": "三大神木之一，可炼辟邪飞剑", "desc": "天雷竹生长缓慢，是顶级木属性法宝的主材，万年以上可放淡金色雷电，克制邪术魔功。韩立从紫灵手中获得带根灵竹，以神秘小瓶绿液催熟并培育新竹，用以炼制青竹蜂云剑，飞剑因此带有辟邪神雷。", "first_ep": 78, "realm": "", "faction": "", "related": ["韩立", "紫灵", "青竹蜂云剑", "辟邪神雷", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/heaven-lightning-bamboo/"}, {"name": "黄龙丹", "category": "丹药材料", "tagline": "韩立早年服用的洗髓丹药", "desc": "黄龙丹能增长功力、洗髓炼体，韩立在神手谷以绿液催熟药材后首次炼成，并与金髓丸同服，助长春功突破。它对低阶修士尚有效果，但韩立修至长春功第十一层后完全失效；在小寰岛恢复修为时，仍将其用作低阶辅助丹药。", "first_ep": 3, "realm": "", "faction": "", "related": ["韩立", "金髓丸", "神手谷", "长春功", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/yellow-dragon-pill/"}, {"name": "养魂木", "category": "丹药材料", "tagline": "滋养魂魄元神的三神神木之一", "desc": "养魂木可滋养魂魄与元神、增强神识，也能供魂魄寄居而神智不散。韩立与元瑶在虚天殿破阵分取此木，元瑶留主干滋养妍丽元神，韩立取根须催熟，雕成木珠贴身佩戴，并在凝结元婴时借以护持自身。", "first_ep": 118, "realm": "", "faction": "", "related": ["韩立", "元瑶", "妍丽", "虚天殿", "天雷竹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/soul-nurturing-wood/"}, {"name": "金髓丸", "category": "丹药材料", "tagline": "与黄龙丹配套的洗髓灵药", "desc": "金髓丸据称能增长功力、改造体质，是韩立在神手谷照珍稀配方配成的丹药。它与黄龙丸同服，曾助韩立突破长春功瓶颈，也在太南会用于交换物品；长春功修至第十一层后，此丹对他完全失效，小寰岛期间仍被用于辅助炼气。", "first_ep": 3, "realm": "", "faction": "", "related": ["韩立", "黄龙丹", "神手谷", "长春功", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/gold-essence-pill/"}, {"name": "定颜丹", "category": "丹药材料", "tagline": "一服驻颜，容貌自此不改", "desc": "定颜丹只能让容貌停在服药之时，药材虽常见，却都须有千年以上药性。韩立炼成七八颗并自服一颗，此后容貌未变，也曾以此丹交换法器、丹方和珍稀之物；接待落云宗两位长老时，他以此解释自己的年轻外貌。", "first_ep": 10, "realm": "", "faction": "", "related": ["韩立", "筑基丹", "神秘小瓶", "孙二狗", "落云宗"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/face-setting-pill/"}, {"name": "降尘丹", "category": "丹药材料", "tagline": "乱星海稀有的结丹辅助丹药", "desc": "降尘丹能略微提高结丹成功几率，每次冲击结丹只能服用一颗，炼制需稀有妖丹与罕见灵药。六连殿以它作为围杀六级妖兽的报酬，韩立因此接下委托；他斩杀古长老后，从其储物袋中得到五颗，并着手筹备闭关结丹。", "first_ep": 67, "realm": "", "faction": "", "related": ["韩立", "曲魂", "结丹期", "六遁水波大阵", "雪灵水"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/materials/dustfall-pill/"}, {"name": "噬金虫", "category": "妖兽灵虫", "tagline": "上古群居灵虫，奇虫榜第十二", "desc": "能吞噬五金与灵气，不惧水火，除玉石、木头外几乎无所不食，克星是蜘蛛类灵虫。单只弱小，数万成群方显威力。韩立以绿液催熟的霓裳草喂养，使其相互吞噬产卵、逐代变强，后培育出不靠霓裳草繁衍的三色噬金虫，曾在虚天殿结甲护主。", "first_ep": 73, "realm": "", "faction": "", "related": ["韩立", "血玉蜘蛛", "霓裳草", "神秘小瓶", "虚天殿"], "img": "img/gold-devouring-beetles.jpg", "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/gold-devouring-beetles/"}, {"name": "啼魂兽", "category": "妖兽灵虫", "tagline": "专噬魂魄鬼物的魔道灵兽", "desc": "以魔道秘法炼制，以魂魄和鬼物为食，靠鸣魂珠驱使，原属青阳门少主且炼制仅完成一半。元瑶将它赠予韩立作为护送报酬。它在阴冥之地吞噬大量妖兽魂魄后可化银色巨猿，后沉睡进阶，破茧时毛发转黑，背生血红恶鬼花纹。", "first_ep": 96, "realm": "", "faction": "", "related": ["韩立", "元瑶", "鸣魂珠", "阴冥之地"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/weeping-soul-beast/"}, {"name": "天澜圣兽", "category": "妖兽灵虫", "tagline": "突兀人世代崇奉的守护神", "desc": "突兀人世代传说中供奉的守护神。韩立观察越国乱局、权衡逃遁去向时，在介绍慕兰人与突兀人的背景叙述中首次提及此兽，其余详情不详。", "first_ep": 60, "realm": "", "faction": "", "related": ["突兀人", "慕兰人", "慕兰草原"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/endless-sky-beast/"}, {"name": "血玉蜘蛛", "category": "妖兽灵虫", "tagline": "丝网坚韧、躯壳坚硬的蜘蛛妖兽", "desc": "韩立在地下洞窟斩杀四级蛛妖后收走两枚卵，孵化的幼蛛以精血禁制认他为主，后练至四级顶峰。其蛛丝不惧乾蓝冰焰，是拉取虚天鼎的关键。虚天殿中一只被星宫长老斩杀，残躯由玄骨炼尸助力取鼎，仅剩的一只元气大伤，仍由韩立饲养。", "first_ep": 24, "realm": "", "faction": "", "related": ["韩立", "虚天鼎", "极阴祖师", "玄骨", "乾蓝冰焰"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/bloodjade-spider/"}, {"name": "毒蛟", "category": "妖兽灵虫", "tagline": "为风希炼翅而殒命的八级毒蛟", "desc": "八级蛟龙，化形初期，战力堪比九级，血中毒光能化去噬金虫。曾为渡劫巨龟护法，后应风希之邀协助炼制风雷翅。服下韩立动过手脚的灵液后动弹不得，被十余万三色噬金虫啃噬至死，魂魄被韩立封入玉瓶。", "first_ep": 123, "realm": "", "faction": "", "related": ["风希", "韩立", "噬金虫", "啼魂兽", "风雷翅"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/venomous-flood-dragon/"}, {"name": "裂风兽", "category": "妖兽灵虫", "tagline": "外星海疾速妖兽，独酿碧焰酒", "desc": "裂风兽是栖息于外星海的高阶妖兽，介于海兽与妖鸟之间，以速度极快著称。成年个体为八级，八级后才开始繁衍，亲兽会照料幼兽至五级左右。其族独有的碧焰酒以化形阶妖丹为主料，需上百年酿成；韩立由文思月得知幼崽线索，后在巢穴附近遇到已化形的妖修风希。", "first_ep": 126, "realm": "", "faction": "", "related": ["风希", "外星海", "碧焰酒", "文思月", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/windbreaker-beast/"}, {"name": "墨蛟", "category": "妖兽灵虫", "tagline": "沼泽黑蟒蜕蛟，遗骸炼成神风舟", "desc": "水属性妖兽，外形如笼着黑雾的巨蟒，蜕皮化蛟后达二阶，实力堪比筑基中期修士。南宫婉率掩月宗弟子围攻时险象环生，韩立出手以金光砖砸烂蛟首。南宫婉摄走元神，韩立取得尸身材料，后以蛟鳍、蛟尾炼成神风舟。", "first_ep": 14, "realm": "", "faction": "", "related": ["韩立", "南宫婉", "神风舟", "金光砖", "朱雀环"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/inky-flood-dragon/"}, {"name": "金丝蚕", "category": "妖兽灵虫", "tagline": "金丝不惧冰焰，取鼎失败后归韩立", "desc": "罕见奇虫，等级仅接近二级妖兽，吐出的金丝却不会被乾蓝冰焰烧毁。万天明曾以天青花催动它们拉扯虚天鼎，药力消退后取鼎失败，便舍弃三只残蚕。韩立将其收下，后来用一对濒死雌雄蚕验证五色圆珠，又以霓裳草促其产卵，二蚕随即死去。", "first_ep": 96, "realm": "", "faction": "", "related": ["韩立", "万天明", "虚天鼎", "乾蓝冰焰", "霓裳草"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/gold-threaded-silkworm/"}, {"name": "尸魈", "category": "妖兽灵虫", "tagline": "元婴遗尸所化，刀剑难伤且嗜杀", "desc": "由身具木或土属性天灵根、含恨而死的元婴修士遗体所化，保留多数生前记忆，还能继续修炼。它不怕阳光，寻常金铁难伤，须以真火长期炼化或用抽魂术封印。韩立在石室发现被银链锁住的尸魈，试探后未曾毁尸，与银月借土遁离开。", "first_ep": 149, "realm": "", "faction": "", "related": ["韩立", "银月", "噬金虫"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/cadaver-demon/"}, {"name": "铁火蚁", "category": "妖兽灵虫", "tagline": "黑沙漠火蚁成群，反成噬金虫口粮", "desc": "火属性飞蚁，列奇虫榜第三十七位，能喷黑火、聚合变形，只有中阶以上水、冰属性法术等少数手段可制。它们栖于邻近铜铁矿的熔岩地带，无法认主，在虚天殿黑沙漠成群杀伤修士。韩立以噬金虫接连破蚁群，并吞食封有蚁群的晶柱，获得可祭炼飞剑的炼晶。", "first_ep": 105, "realm": "", "faction": "", "related": ["韩立", "噬金虫", "元瑶", "虚天殿", "青竹蜂云剑"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/creatures/ironfire-ants/"}, {"name": "灵界", "category": "地点", "tagline": "化神修士飞升所往的更高界面", "desc": "位于人界之上的更高层次世界，修士修炼至化神期后可飞升至此。这一名称最早见于银月的猜测，她认为能催熟灵草的神秘小瓶可能炼制于灵界或真仙界。", "first_ep": 156, "realm": "", "faction": "", "related": ["人界", "化神期", "银月", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/spirit-realm/"}, {"name": "人界", "category": "地点", "tagline": "凡人与修士共居，囊括三方的界面", "desc": "凡人与修士所在的界面，包括天南、乱星海和大晋。此名最早由阴冥之地一位老村民提及，他推测当地或是冥界与人界交汇处的空间裂缝，也可能是巨兽罗睺腹中；那里还会周期性喷发令修士失去法力的绝灵之气。", "first_ep": 141, "realm": "", "faction": "", "related": ["阴冥之地", "天南", "乱星海", "大晋", "灵界"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/human-world/"}, {"name": "乱星海", "category": "地点", "tagline": "星宫统辖的浩瀚群岛海域", "desc": "乱星海岛屿无数，已探明海域称内星海，其外为外星海，星宫坐镇天星城统辖此地。海域有妖兽、天风、阴雾三大天灾，资源丰富，炼丹多以妖丹为主材。韩立曾在此修炼、猎妖，后正魔两道组成逆星盟，占据大部分地区。", "first_ep": 64, "realm": "", "faction": "", "related": ["星宫", "天星城", "内星海", "外星海", "虚天殿"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/scattered-star-seas/"}, {"name": "大晋", "category": "地点", "tagline": "被修士誉为修仙圣地的大帝国", "desc": "大晋是人界一个幅员辽阔的帝国，韩立在天南时便听说过它。他在阴冥之地遇到一位来自大晋的矮胖老者，对方称大晋为此界修士的圣地。", "first_ep": 141, "realm": "", "faction": "", "related": ["人界", "阴冥之地", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/great-jin/"}, {"name": "天南", "category": "地点", "tagline": "四国势力分治的稠密修仙地域", "desc": "天南由众多凡人国家组成，人口稠密，灵脉多被宗门和修仙家族占据，北部以无边海为界。韩立返回时，此地由魔道、正道、天道盟和九国盟分治，各方因忌惮慕兰人而长期未爆发大战。阗天城是天南唯一的修士城市。", "first_ep": 19, "realm": "", "faction": "", "related": ["越国", "溪国", "阗天城", "九国盟", "天道盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/heavenly-south/"}, {"name": "慕兰草原", "category": "地点", "tagline": "资源贫瘠的慕兰人游牧故土", "desc": "慕兰草原极为辽阔，修炼资源贫乏，游牧之人需五年才能走完。慕兰人称本族修士为法士，法术融合五行功法与草原秘术；世代为敌的突兀人称此地为天澜草原。九国盟长年与慕兰法士交战。南陇侯一行横越草原边缘时撞上慕兰人入侵的先锋：风灵术掀起的沙暴、黄沙部法士布下的法阵，以及载着五名元婴的御风车。", "first_ep": 60, "realm": "", "faction": "", "related": ["慕兰人", "突兀人", "九国盟", "天南"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/moulan-plains/"}, {"name": "越国", "category": "地点", "tagline": "故事启程的十三州之国", "desc": "越国分为十三州，首都越京是全国经济文化中心，修仙界原由七派掌控。魔道六宗入侵后，灵兽山临阵倒戈，七派联军溃败并撤离，各宗最终控制越国。韩立潜回时，越国已由鬼灵门控制，总坛设在掩月宗旧址。", "first_ep": 1, "realm": "", "faction": "", "related": ["七派", "黄枫谷", "越京", "岚州", "鬼灵门"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/state-of-yue/"}, {"name": "虚天殿", "category": "地点", "tagline": "三百年降临一次的悬浮秘殿", "desc": "虚天殿是悬于海上的巨大玉殿，约每三百年降临乱星海偏远海域，据传为上古修士所建。殿中藏有灵药、古宝和功法，进入内殿须闯过三关，内殿尤为凶险。韩立入殿取得九曲灵参，后与元瑶脱困，但未能打开虚天鼎。", "first_ep": 80, "realm": "", "faction": "", "related": ["乱星海", "虚天鼎", "补天丹", "星宫", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/heavenvoid-hall/"}, {"name": "天星城", "category": "地点", "tagline": "星宫统辖的乱星海第一大城", "desc": "全城沿岛上巨山盘旋而建，八十一层圣山的下五十层可供外来修士租住。城内禁止动手，并设有通往外星海的传送阵。韩立曾携曲魂在此租下洞府、经营青竹小轩，也曾借传送阵外出猎妖。", "first_ep": 73, "realm": "", "faction": "", "related": ["乱星海", "星宫", "天星双圣", "韩立", "外星海"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/heavenly-star-city/"}, {"name": "云梦山", "category": "地点", "tagline": "三派共据的溪国灵脉", "desc": "云梦山由古剑门、落云宗与百巧院共同占据，山中的灵眼之树每两百年产出一次醇液，是炼制定灵丹的主药。韩立伪装成低阶弟子混入落云宗，取得一段灵树树根，随后在山中凝结元婴，并答应担任落云宗长老。", "first_ep": 145, "realm": "", "faction": "", "related": ["溪国", "落云宗", "古剑门", "百巧院", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/dreamcloud-mountains/"}, {"name": "外星海", "category": "地点", "tagline": "妖兽横行的乱星海外围海域", "desc": "外星海是乱星海未经探索的外围海域，部分妖兽足以与元婴修士交手，可由天星城传送阵前往。韩立曾在红瑚岛以霓裳草诱妖，五年间猎杀数百头五级妖兽。此后黑石城被兽潮攻破，这片海域转由妖兽占据。", "first_ep": 73, "realm": "", "faction": "", "related": ["乱星海", "天星城", "韩立", "霓裳草", "妖族"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/outer-star-seas/"}, {"name": "元武国", "category": "地点", "tagline": "越国以北的修仙国度", "desc": "元武国位于越国建州以北，原有天星宗、神兵门、万妙观等正道宗门，正魔两道一度相持不下。韩立曾在此购得颠倒五行阵，并结识齐云霄与辛如音。此地后受魔道控制，他依约灭尽付家嫡系，以付家老祖首级告慰辛如音。", "first_ep": 9, "realm": "", "faction": "", "related": ["越国", "齐云霄", "辛如音", "付家", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/state-of-yuan-wu/"}, {"name": "溪国", "category": "地点", "tagline": "天道盟最北端的七州之国", "desc": "溪国位于天南最北端，面积约为越国的三分之二，共分七州，与两个邻国同属天道盟。境内云梦山由落云宗、古剑门和百巧院共据。韩立渡过无边海后抵达此地，加入落云宗并开辟洞府，之后由此前往阗天城交易会。", "first_ep": 145, "realm": "", "faction": "", "related": ["天南", "天道盟", "云梦山", "落云宗", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/state-of-xi/"}, {"name": "阴冥之地", "category": "地点", "tagline": "法力尽失的百里封闭空间", "desc": "此地与外界隔绝，修士无法使用灵力，只能依靠阴冥之气和武技求生，境内分布着人族村落、妖兽与阴兽。韩立和梅凝被空间裂缝卷入后，收集阴兽晶石并前往暴风山，最终借风雷翅带两女离开。", "first_ep": 140, "realm": "", "faction": "", "related": ["韩立", "梅凝", "紫灵", "啼魂兽", "风雷翅"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/umbra-realm/"}, {"name": "墨府", "category": "地点", "tagline": "嘉元城中的墨家府邸与惊蛟会总堂", "desc": "墨府是墨大夫一家在嘉元城的居所，也是由严氏代理主持的惊蛟会总堂。韩立为求暖阳宝玉潜入府中，与严氏等人交锋后谈妥条件，以欧阳飞天的首级换得宝玉。墨府后来被毁，旧址匾额换成“李府”。", "first_ep": 7, "realm": "", "faction": "", "related": ["嘉元城", "墨大夫", "严氏", "韩立", "墨彩环"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/mo-estate/"}, {"name": "嘉元城", "category": "地点", "tagline": "岚州第一大城，帮派林立的水运枢纽", "desc": "嘉元城位于越国岚州中部，乡鲁大运河穿城而过，是舟船往来的繁华港城。城中大小帮派众多，兄弟盟、惊蛟会和天霸门势力最大。韩立曾在此收服孙二狗、寻访墨府，后来又为曲魂和墨家旧账重返此地。", "first_ep": 7, "realm": "", "faction": "", "related": ["墨府", "岚州", "孙二狗", "韩立", "曲魂"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/jia-yuan-city/"}, {"name": "阗天城", "category": "地点", "tagline": "天南唯一的修士之城，交易会举办地", "desc": "阗天城是九国盟设在虞国的总部，以巨石筑成，城外布有禁空禁制。城内只以灵石交易，唯一拍卖行也由九国盟经营。韩立、吕洛带慕沛灵前来参加百年一次的交易会，韩立在城中搜寻庚精与制符材料。", "first_ep": 167, "realm": "", "faction": "", "related": ["九国盟", "天南", "韩立", "吕洛", "天晶真人"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/soaring-heavens-city/"}, {"name": "神手谷", "category": "地点", "tagline": "七玄门药谷，韩立早年修炼之地", "desc": "神手谷原是墨大夫掌管的药谷，韩立与张铁被收为弟子后随他入住。韩立在此修炼、炼药，并用神秘小瓶中的绿液催生药草。墨大夫死后，他借伪造书信接任大夫，独居谷中，以谷口铃铛隔绝访客。", "first_ep": 1, "realm": "", "faction": "", "related": ["七玄门", "墨大夫", "韩立", "张铁", "神秘小瓶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/god-hand-valley/"}, {"name": "越京", "category": "地点", "tagline": "越国都城，秦宅与黑煞教风波之地", "desc": "越京是越国都城和最大城市，分为皇城、官员区、富商区与贫民区。韩立奉李化元之命假扮秦家穷亲戚，驻守东区秦宅，却因馨王府宴会卷入修士失踪之事。他由此追查黑煞教，并与众同门准备进入皇宫。", "first_ep": 30, "realm": "", "faction": "", "related": ["越国", "秦家", "黑煞教", "韩立", "李化元"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/yuejing/"}, {"name": "魁星岛", "category": "地点", "tagline": "乱星海西南主岛，修士可定居开辟洞府", "desc": "魁星岛是乱星海西南三座大岛中的主岛，灵脉为周边海域最佳，由木龙真人与两位副岛主掌管。韩立代顾家参加斗法，取得长期定居资格，随后选择偏僻的小寰岛。他也曾到魁星城购买结丹所需之物。", "first_ep": 64, "realm": "", "faction": "", "related": ["乱星海", "韩立", "曲魂", "雪灵水", "元瑶"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/stalwart-star-island/"}, {"name": "岚州", "category": "地点", "tagline": "越国富庶水乡，墨大夫的故地", "desc": "越国十三州之一，土地肥沃、水道纵横，是首要产粮区，最大城池为州中央的嘉元城。这里最早作为墨大夫的故乡被提及，韩立曾到此寻访墨府并参加升仙大会。七派默认其属灵兽山势力范围。", "first_ep": 3, "realm": "", "faction": "", "related": ["越国", "嘉元城", "墨大夫", "灵兽山", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/lan-province/"}, {"name": "内星海", "category": "地点", "tagline": "乱星海已探明海域，人族修士之地", "desc": "乱星海中已探明的海域，通常所说的乱星海即指这里，是人类修士活动的地盘。它与更荒蛮的外星海以传送法阵相连。星宫与逆星盟在此激战，战事一度使法阵只能向外星海传送。", "first_ep": 73, "realm": "", "faction": "", "related": ["乱星海", "外星海", "星宫", "逆星盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/inner-star-seas/"}, {"name": "太岳山脉", "category": "地点", "tagline": "黄枫谷旧总坛与韩立旧洞府所在", "desc": "位于越国建州，黄枫谷总坛隐于山脉中部的大阵幻象内，坊市则在东北边缘。韩立曾在西北外围发现灵眼之泉并开辟洞府，撤离时将洞府掩埋。旧址成为鬼灵门分坛后，他重返此地取走灵泉。", "first_ep": 9, "realm": "", "faction": "", "related": ["黄枫谷", "韩立", "鬼灵门", "李化元", "越国"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/taiyue-mountains/"}, {"name": "极西之地", "category": "地点", "tagline": "以机关傀儡之术闻名的遥远地域", "desc": "越国以外的一处遥远地域，越国地火室所用耐高温坞石由那里的国家运来。当地盛行傀儡术，千竹教专精此道，以毒术闻名的蛊毒宗也在此立足。韩立有意前往求取大衍诀余下三层。", "first_ep": 15, "realm": "", "faction": "", "related": ["傀儡术", "大衍诀", "韩立", "越国"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/far-west/"}, {"name": "燕翎堡", "category": "地点", "tagline": "禁制遮掩的燕家堡城", "desc": "燕家位于燕梁山中的重要据点，平时由禁制遮蔽，须凭令牌注入灵力方能显现。堡中居民超过十万，多为凡人。韩立护送董萱儿参加夺宝大会，在此重逢墨彩环母女，并发现燕家已与鬼灵门勾结。", "first_ep": 18, "realm": "", "faction": "", "related": ["燕家", "董萱儿", "鬼灵门", "墨彩环", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/places/yan-ling-castle/"}, {"name": "落云宗", "category": "宗门势力", "tagline": "云梦山炼丹宗门，韩立出任长老", "desc": "位于溪国云梦山东部，与古剑门、百巧院共占山中灵脉，同为天道盟核心宗门。宗门以炼丹见长，山门设在六奇峰。韩立曾隐瞒修为一入门，后于宗内结成元婴，应邀出任不必管事的太上长老。", "first_ep": 145, "realm": "", "faction": "", "related": ["韩立", "云梦山", "天道盟", "程天坤", "吕洛"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/drifting-cloud-sect/"}, {"name": "魔道", "category": "宗门势力", "tagline": "以弱肉强食为信条的旁门势力", "desc": "魔道以阴邪功法追求法力与杀伤力的快速增长，修习者往往偏激嗜杀。天南魔道以六宗为组织，根据地在天罗国，曾入侵越国并击败七派联军。乱星海魔道则以六道极圣为第一人，后与正道合组逆星盟。", "first_ep": 11, "realm": "", "faction": "", "related": ["鬼灵门", "御灵宗", "六道极圣", "极阴祖师", "逆星盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/devil-dao/"}, {"name": "黄枫谷", "category": "宗门势力", "tagline": "韩立凭升仙令拜入的越国宗门", "desc": "黄枫谷是越国七派之一，驻于太岳山脉，弟子逾万，掌门为钟灵道。韩立持升仙令入门，后被李化元收为记名弟子。灵兽山倒戈导致联军溃败后，令狐老祖下令撤离越国，韩立趁乱离宗；流亡九国盟的宗门全靠令狐老祖支撑。", "first_ep": 7, "realm": "", "faction": "", "related": ["韩立", "李化元", "令狐老祖", "钟灵道", "七派"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/yellow-maple-valley/"}, {"name": "叶家", "category": "宗门势力", "tagline": "秦叶岭颇有名气的修仙家族", "desc": "叶家弟子衣领绣有叶形图案，金光上人曾自称其门下。叶家与秦家曾同居秦叶岭并彼此联姻，秦家衰落后，叶家觊觎其宝物与升仙令，金光上人遂携令逃走。韩立杀死金光上人后，一度担心叶家报复。", "first_ep": 6, "realm": "", "faction": "", "related": ["金光上人", "升仙令", "秦家", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/ye-clan/"}, {"name": "鬼灵门", "category": "宗门势力", "tagline": "精于驱鬼役妖的魔道六宗之一", "desc": "鬼灵门驻于天罗国，虽在魔道六宗中最弱，实力仍胜过掩月宗。少门主王蝉在燕翎堡推动燕家归附，并图谋困杀七派修士，追击韩立时中毒退走。此后鬼灵门控制越国，总坛设于掩月宗旧址，并在黄枫谷故地设立分坛。门主王天古是著名阵法大师，也是王蝉的二伯。", "first_ep": 19, "realm": "", "faction": "", "related": ["王蝉", "魔道", "燕如嫣", "越国", "黄枫谷", "王天古"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/ghost-spirit-sect/"}, {"name": "星宫", "category": "宗门势力", "tagline": "坐镇天星城、统辖乱星海的古势力", "desc": "星宫由天星双圣执掌，既不属正道也不属魔道，惯于压制势强的一方，并掌管通往外星海的传送阵。其执法长老曾在虚天殿暗中削弱正魔修士。正魔两道组成逆星盟后，星宫与其交战，天星城一度戒严。", "first_ep": 73, "realm": "", "faction": "", "related": ["天星双圣", "天星城", "乱星海", "逆星盟", "凌玉灵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/star-palace/"}, {"name": "七派", "category": "宗门势力", "tagline": "曾共同主宰越国修仙界的中立七宗", "desc": "七派包括黄枫谷、掩月宗、灵兽山、清虚门、巨剑门、化刀坞和天阙堡，以掩月宗最强。它们通过升仙大会收徒，并共同开启血色试炼禁地。与魔道六宗交战时，灵兽山倒戈令联军溃败，各派撤离越国，残部后来并入九国盟。", "first_ep": 7, "realm": "", "faction": "", "related": ["黄枫谷", "掩月宗", "灵兽山", "越国", "九国盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/seven-sects/"}, {"name": "七玄门", "category": "宗门势力", "tagline": "镜州武林门派，韩立修仙之路的起点", "desc": "七玄门由七绝上人创立，总坛位于彩霞山落日峰，与野狼帮分庭抗礼。韩立十岁经三叔推荐入门，虽未通过测试，仍与张铁同被收为记名弟子，随后进入神手谷。野狼帮攻山时，韩立击败金光上人、扭转战局，之后离门。", "first_ep": 1, "realm": "", "faction": "", "related": ["韩立", "墨大夫", "厉飞雨", "王绝楚", "张铁"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/seven-mysteries-sect/"}, {"name": "掩月宗", "category": "宗门势力", "tagline": "越国七派之首，以双修之道著称", "desc": "掩月宗是越国七派中实力最强者，门下至少一半是女子，且只收容貌出众者，推崇双修。该宗曾凭月阳宝珠在禁地采集灵药而崛起，血色试炼中由南宫婉率队。七派战败后，掩月宗守住山门，其旧址后来被鬼灵门用作越国总坛。", "first_ep": 7, "realm": "", "faction": "", "related": ["南宫婉", "宣乐", "七派", "越国"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/masked-moon-sect/"}, {"name": "御灵宗", "category": "宗门势力", "tagline": "魔道宗门，精于培育驱使灵虫灵兽", "desc": "御灵宗驻于天罗国西部奇灵山，灵兽山是其数千年前安插在越国的分支。韩立获得该宗修士留下的玉简，依其中奇虫培育之法养出噬金虫。至木灵婴被禁锢后，宗门派菡云芝、柳玉追索；柳玉被韩立擒住，后化名柳眉加入落云宗。", "first_ep": 23, "realm": "", "faction": "", "related": ["灵兽山", "噬金虫", "至木灵婴", "菡云芝", "柳玉"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/controlling-spirit-sect/"}, {"name": "九国盟", "category": "宗门势力", "tagline": "越国以南九国结盟，共御慕兰法士", "desc": "九国盟由九国修仙界组建，以抵御慕兰法士为宗旨，是与魔道、正道、天道盟并称的天南四大势力之一，立场中立。其总部位于虞国阗天城，城中有上元灭光阵守护，并由九国盟主办天南大型交易会。", "first_ep": 60, "realm": "", "faction": "", "related": ["阗天城", "慕兰人", "天南", "上元灭光阵", "天道盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/nine-nations-union/"}, {"name": "逆星盟", "category": "宗门势力", "tagline": "正魔两道结盟，力图打破星宫统治", "desc": "逆星盟由正道与魔道共同创立，首领为万三姑和六道极圣，另有十余名元婴期散修担任长老，神鸠堂是其下属机构。韩立重返乱星海时，该盟已进攻星宫外围诸岛并占据上风。温天仁以少主身份逼韩立加入神鸠堂，遭拒后与其交手。", "first_ep": 119, "realm": "", "faction": "", "related": ["星宫", "六道极圣", "温天仁", "乱星海", "紫灵"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/starfall-coalition/"}, {"name": "妙音门", "category": "宗门势力", "tagline": "乱星海女修宗门，亦以商会方式经营", "desc": "妙音门以女弟子为主，门主之下设左右门使，并常聘结丹修士为客卿。汪门主遇害后，紫灵将宗门迁至天星城，以天雷竹等条件请韩立担任挂名长老。此后范夫人勾结魔道夺权，带弟子前往外星海，实权落入云天啸手中；韩立最终斩杀云天啸。", "first_ep": 77, "realm": "", "faction": "", "related": ["紫灵", "范夫人", "文思月", "韩立", "云天啸"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/exquisite-sound-sect/"}, {"name": "天道盟", "category": "宗门势力", "tagline": "天南诸国宗门结成的松散联盟", "desc": "天道盟由天南十余国宗门组成，以对抗魔道和正道，组织较为松散。它与魔道、正道盟、九国盟并立，各方因慕兰人的威胁已百余年未爆发大战。溪国及相邻两国均属此盟，云梦山的古剑门、落云宗、百巧院是其核心宗门。", "first_ep": 63, "realm": "", "faction": "", "related": ["天南", "溪国", "云梦山", "落云宗", "九国盟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/heavenly-dao-alliance/"}, {"name": "灵兽山", "category": "宗门势力", "tagline": "越国七派中的驭兽宗门", "desc": "灵兽山实力仅次于掩月宗，弟子擅长饲养、驱使灵兽，并以虫类布设警戒网，岚州是其默认地盘。它实为御灵宗分支，是魔道数千年前埋下的暗棋；所谓叛离只是障眼法。决战时它为魔道打开法阵，导致七派联军大败，战前已重归御灵宗。", "first_ep": 7, "realm": "", "faction": "", "related": ["越国", "七派", "御灵宗", "菡云芝", "岚州"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/spirit-beast-mountain/"}, {"name": "百巧院", "category": "宗门势力", "tagline": "云梦山以炼器闻名的宗门", "desc": "百巧院占据云梦山西部，与古剑门、落云宗共享灵脉和灵眼之树，同为天道盟核心宗门。门下擅长炼制法器，还保存顶阶法宝的炼制方法。它由五个修仙大家族共同掌控，很少招收外人，实力略强于落云宗而不及古剑门。", "first_ep": 145, "realm": "", "faction": "", "related": ["云梦山", "天道盟", "古剑门", "落云宗", "付家"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/hundred-possibilities-pavilion/"}, {"name": "古剑门", "category": "宗门势力", "tagline": "云梦山三宗中最强的剑修宗门", "desc": "古剑门占据云梦山主脉，与落云宗、百巧院同为天道盟核心宗门。其招牌功法太白剑诀对灵根要求极高，故弟子最少，却凭剑修成为三宗最强。三宗以试剑大会争夺醇液份额，自落云宗迁入以来，魁首一直归古剑门。", "first_ep": 145, "realm": "", "faction": "", "related": ["云梦山", "天道盟", "百巧院", "落云宗", "火龙童子"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/ancient-sword-sect/"}, {"name": "黑煞教", "category": "宗门势力", "tagline": "盘踞越京皇宫的邪修教派", "desc": "黑煞教是越国邪教，以筑基为诱饵招揽外围弟子，掳掠修士血祭，供教主修炼邪功。教中设教主、四血侍和坛主，老巢位于越京皇宫，越皇正是教主。其各门功法都提及玄阴经，且几乎都有无法结丹的缺陷。", "first_ep": 34, "realm": "", "faction": "", "related": ["越国", "越京", "越皇", "青纹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/sects/black-fiend-school/"}, {"name": "炼气期", "category": "境界", "tagline": "修仙下境界的第一阶", "desc": "炼气期以基础功法层数衡量进度，最高为第十三层。修至第七层后，可借筑基丹寻求筑基机会，多数散修却终生停在这一境界。此境修士斗法通常最多同时操控两件法器，实力与筑基期差距悬殊，在战场上往往只能充作后备。", "first_ep": 1, "realm": "", "faction": "", "related": ["筑基期", "筑基丹", "青元剑诀", "黄枫谷", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/realms/qi-condensation/"}, {"name": "筑基期", "category": "境界", "tagline": "跨过此关，才算真正踏入修仙界", "desc": "筑基位于炼气之后、结丹之前，修士寿元可达二百余岁，通常须将基础功法练至七层以上并借助筑基丹。境界分初、中、后期，筑基顶峰称假丹；在宗门中可自开洞府、免去杂务，实力远胜炼气修士。", "first_ep": 1, "realm": "", "faction": "", "related": ["炼气期", "结丹期", "筑基丹", "韩立", "三转重元功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/realms/foundation-establishment/"}, {"name": "结丹期", "category": "境界", "tagline": "金丹凝成，寿元与神通再进一步", "desc": "结丹上承筑基、下接元婴，修士体内凝成金丹，寿元可达四五百年，并能炼制法宝、制作符宝。筑基顶峰称假丹，结丹后期巅峰称假婴；此境修士已是宗门实力的重要支柱。韩立修炼三转重元功后成功结丹。", "first_ep": 1, "realm": "", "faction": "", "related": ["筑基期", "元婴期", "韩立", "曲魂", "三转重元功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/realms/core-formation/"}, {"name": "元婴期", "category": "境界", "tagline": "元婴凝成，寿元近千，遁走难杀", "desc": "元婴位于结丹之上，分初、中、后期，修士寿元接近千年。元婴形貌与主人相同，可离体施法或瞬移，但会耗损元气并使肉身失去守护，因此元婴修士易败难杀。结婴还须熬过幻象和心魔，多数修士终生停留在初期。", "first_ep": 1, "realm": "", "faction": "", "related": ["结丹期", "化神期", "韩立", "九曲灵参"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/realms/nascent-soul/"}, {"name": "化神期", "category": "境界", "tagline": "下境界之巅，圆满后据传离此界", "desc": "化神是第五个大境界，位于元婴之上，也是下境界的最高一层。据传修至大圆满后必须离开此界、前往更高空间，且从无人回来。", "first_ep": 1, "realm": "", "faction": "", "related": ["元婴期", "炼气期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/realms/deity-transformation/"}, {"name": "大庚剑阵", "category": "阵法", "tagline": "庚精炼剑，百道剑气方可成阵", "desc": "大庚剑阵是青元剑诀的最后一种神通，须以庚精重新祭炼飞剑，并至少聚齐一百道剑气才能布阵；飞剑越强、剑气越多，威力越大。韩立结婴后破开金页封印得到此法，因缺少庚精暂时搁置。", "first_ep": 158, "realm": "", "faction": "", "related": ["青元剑诀", "庚精", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/formations/aureate-sword-formation/"}, {"name": "颠倒五行阵", "category": "阵法", "tagline": "隐匿困敌的小型禁制法阵", "desc": "此阵擅长隐蔽、迷惑与困敌，本身不能杀敌；以便携阵盘阵旗布设，以灵石供灵、主旗操控。韩立从齐云霄处换得成套器具，后获改进版本，曾用于守护洞府、困杀强敌与妖兽。", "first_ep": 16, "realm": "", "faction": "", "related": ["齐云霄", "韩立", "越皇", "王蝉"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/formations/five-elements-reversal-formation/"}, {"name": "妖族", "category": "种族", "tagline": "以化形阶段划分等级的妖兽与妖修", "desc": "妖族由妖兽与妖修组成，以化为人形的阶段划分等级，初期相当于八级妖修，第二阶段相当于九级妖兽。裂风兽风希刚完成第二阶段。韩立掌握妖文后，译出了为禽类妖族所创的《疾风九变》。", "first_ep": 127, "realm": "", "faction": "", "related": ["风希", "裂风兽", "疾风九变", "韩立"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/demon-race/"}, {"name": "慕兰人", "category": "种族", "tagline": "以灵术斗法的草原游牧民族", "desc": "慕兰人是草原游牧民族，族中修士称法士，结丹前多以融合五行道术与草原秘术的灵术对敌。他们与燕族人、突兀人为敌，越国以南九国为抵御他们而结成九国盟。如今他们以风灵术沙暴为前奏，掀起新一轮入侵。", "first_ep": 60, "realm": "", "faction": "", "related": ["慕兰草原", "突兀人", "九国盟", "越国"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/moulan/"}, {"name": "突兀人", "category": "种族", "tagline": "信奉天澜圣兽的草原游牧民族", "desc": "突兀人生活在慕兰人所居草原的另一端，并将这片草原称为天澜草原。他们奉天澜圣兽为守护神，与慕兰人是世仇，两族每隔百年便会爆发大战。", "first_ep": 60, "realm": "", "faction": "", "related": ["天澜圣兽", "慕兰人", "慕兰草原"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/soaring-tribes/"}, {"name": "燕家", "category": "宗门势力", "tagline": "归附鬼灵门的越国第一修仙家族", "desc": "燕家根基在越国蔺州燕翎堡，是姑雨山首屈一指的修仙家族，也是各大宗门外唯一拥有结丹修士的家族，豢养双首鹜。其曾举办夺宝大会，因先祖出自鬼灵门而归附该门并整体撤离，被七派记为叛离。", "first_ep": 8, "realm": "", "faction": "", "related": ["燕翎堡", "鬼灵门", "王蝉", "燕如嫣", "越国"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/yan-clan/"}, {"name": "付家", "category": "宗门势力", "tagline": "依附魔焰门的元武国修仙家族", "desc": "付家是元武国大修仙家族，主堡位于紫道山，依附魔焰门，有三名结丹修士。其追杀齐云霄，致其重伤身死，辛如音因此托付韩立报仇。韩立在付天化寿宴上动手，付家嫡系被灭，他带着老祖首级祭奠辛如音与齐云霄。", "first_ep": 58, "realm": "", "faction": "", "related": ["元武国", "辛如音", "齐云霄", "韩立", "银月"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/fu-clan/"}, {"name": "秦家", "category": "宗门势力", "tagline": "受李化元扶持的越京凡人家族", "desc": "秦家是越京东区的凡人商贾家族，家主秦言，掌控越国四分之一铜矿生意，受李化元扶持。韩立奉命扮作旁支亲戚驻守秦宅，保护族人免受魔道威胁。墨凤舞以守寡表小姐的身份化名住在宅中。", "first_ep": 31, "realm": "", "faction": "", "related": ["越京", "李化元", "韩立", "墨凤舞"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/qin-clan/"}, {"name": "韩家", "category": "宗门势力", "tagline": "韩立出身之乡，已成镜州大族", "desc": "韩家原是偏远乡下一户人家，除三叔外几乎无人走出山坳。百余年后，韩家迁入镜州韩家堡，世代有人为官，祖宅仍在五里沟。韩立以家主韩天啸确认的“四叔祖”身份留下噬金虫灵剑护族，此剑只能动用三次。", "first_ep": 1, "realm": "", "faction": "", "related": ["韩立", "厉飞雨", "噬金虫", "七玄门"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/races/han-clan/"}, {"name": "玉如意", "category": "法宝宝物", "tagline": "藏有银月的古宝", "desc": "韩立所持古宝，器灵银月本为银狼，后以灵魂吞噬之能附体四瞳灵狐。玉如意若被毁去，银月也会随之消散；她后来将主元神移入飞剑。韩立与妙鹤真人交手时，曾用此宝挡下一击。", "first_ep": 114, "realm": "", "faction": "", "related": ["银月", "韩立", "乌丑", "妙鹤真人"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "青蛟旗", "category": "法宝宝物", "tagline": "韩立自陆师兄处所得的旗宝", "desc": "韩立击杀陆师兄后，与两枚筑基丹一同取得此旗。禁地迎战封岳时，他挥动青蛟旗吸引对方注意，暗中把天雷子藏在混元珠后送出。", "first_ep": 11, "realm": "", "faction": "", "related": ["韩立", "封岳", "混元珠", "天雷子", "筑基丹"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "金光砖", "category": "法宝宝物", "tagline": "以巨力砸敌的韩立符宝", "desc": "韩立所持符宝，胜在力量，但速度较慢。南宫婉以朱雀环压制墨蛟时，韩立用金光砖砸烂蛟首；两人脱困时，又借它与朱雀环打出通往地面的隧道。", "first_ep": 13, "realm": "", "faction": "", "related": ["韩立", "南宫婉", "朱雀环", "墨蛟"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "朱雀环", "category": "法宝宝物", "tagline": "南宫婉困敌脱困之法宝", "desc": "南宫婉的法宝，可套住并压制墨蛟，配合韩立的金光砖将其击杀。她将法力渡给韩立后，两人又用朱雀环与金光砖打出隧道脱困。", "first_ep": 15, "realm": "", "faction": "", "related": ["南宫婉", "韩立", "金光砖", "墨蛟", "素女轮回功"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "八门金光镜", "category": "法宝宝物", "tagline": "温天仁耗精血催动的八面古镜", "desc": "温天仁最强的法宝，由八面古镜组成，能以其精血为代价催生金光神焰。与韩立斗法时，镜中光柱被雷遁和风雷翅避开，但韩立随后仍被金光困住。", "first_ep": 138, "realm": "", "faction": "", "related": ["温天仁", "韩立", "风雷翅", "雷遁术"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "引魂钟", "category": "法宝宝物", "tagline": "可驱使曲魂的操控法器", "desc": "韩立曾把引魂钟交给孙二狗，让他驱使曲魂夺取四平帮帮主之位，事后收回。韩立还凭它找到被占据的躯体，并以钟声配合对敌；后来此钟对曲魂不再起作用。", "first_ep": 7, "realm": "", "faction": "", "related": ["曲魂", "孙二狗", "韩立", "血灵钻"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "混元钵", "category": "法宝宝物", "tagline": "古长老遗下、归曲魂所用", "desc": "曲魂协助韩立斩杀古长老后拾起混元钵。曲魂结成煞丹、进入结丹初期时，韩立将此钵与两件符宝交给它；曲魂脱离控制后，曾用混元钵砸向韩立，被飞剑挡开。", "first_ep": 73, "realm": "", "faction": "", "related": ["曲魂", "韩立", "血灵钻", "结丹期"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "遮天钟", "category": "法宝宝物", "tagline": "能巨大化罩敌的黄色小钟", "desc": "宣乐的黄色小钟掺有铜精炼制，能变得极为巨大，曾将血玉蜘蛛罩在钟下。宣乐死后，韩立收走遮天钟，并用它困住过一名血侍。", "first_ep": 27, "realm": "", "faction": "", "related": ["宣乐", "韩立", "血玉蜘蛛"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "混元珠", "category": "法宝宝物", "tagline": "韩立用来掩藏天雷子的珠形法器", "desc": "韩立在禁地与封岳交手时，从葫芦中放出混元珠，又挥动青蛟旗吸引其注意。他暗中把一颗天雷子藏在混元珠后面送出，以此配合攻敌。", "first_ep": 13, "realm": "", "faction": "", "related": ["韩立", "封岳", "天雷子", "青蛟旗"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "飞天盾", "category": "法宝宝物", "tagline": "韩立购入的玄铁防御法器", "desc": "万宝楼田掌柜曾把玄铁飞天盾与金蚨子母刃、天雷子一同拿给韩立看。与封岳交手时，韩立用飞天盾挡下小刀符宝，但盾牌在对方紧逼下渐渐被消磨。", "first_ep": 11, "realm": "", "faction": "", "related": ["韩立", "封岳", "金蚨子母刃", "天雷子"], "img": null, "img_ai": null, "source_url": "https://rmji.wiki/zh/"}, {"name": "鬼头令", "category": "法宝宝物", "tagline": "古长老表明身份所用的令牌", "desc": "乌丑要求古长老与苗长老证明身份，古长老便抛给他一块鬼头令牌作为凭证。从这块令牌来看，两名六连殿长老暗中站在极阴岛一边。", "first_ep": 72, "realm": "", "faction": "",
