:root{--pink:#ff3d8b;--hot:#ff6a3d;--gold:#ffc65c;--teal:#2de2d4;--ink:#0b0618}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:#fff;overflow:hidden;
 font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;
 padding:max(22px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.ui>*{pointer-events:auto}
.kicker{font:12px/1 "Anton";letter-spacing:.5em;color:#ffe3c9;opacity:.85;text-transform:uppercase;margin-left:.5em}
.title{font-family:"Anton";font-size:clamp(40px,9vw,104px);line-height:.9;letter-spacing:.02em;margin-top:10px;text-align:center;
 background:linear-gradient(180deg,#fff6d6 0%,#ffc65c 30%,#ff6a3d 55%,#ff3d8b 78%,#b03cff 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 rgba(20,0,40,.55)) drop-shadow(0 0 24px rgba(255,61,139,.45))}
.title .vi{display:inline-block;font-size:1.35em;transform:skewX(-8deg);margin-left:.08em;
 background:linear-gradient(160deg,#2de2d4,#7af7ff 40%,#ff3d8b 75%,#ffc65c);-webkit-background-clip:text;background-clip:text}
.sub{margin-top:8px;font-size:13px;letter-spacing:.35em;color:#ffd9ec;opacity:.9;text-indent:.35em}

.clock{display:flex;gap:clamp(8px,2vw,18px);margin-top:clamp(18px,4vh,36px);align-items:flex-start}
.unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.digits{display:flex;gap:4px}
.cell{position:relative;width:clamp(34px,7.4vw,74px);height:clamp(52px,11vw,110px);border-radius:10px;overflow:hidden;
 background:linear-gradient(180deg,rgba(40,10,60,.72),rgba(15,4,30,.82));
 box-shadow:inset 0 0 0 1px rgba(255,180,220,.22),0 10px 30px rgba(0,0,0,.35),0 0 30px rgba(255,61,139,.12);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.06)}

  </div>
</div>

<script>
(()=>{
// ---------- data ----------
const R=[
 {k:"nz",n:"新西兰",f:"🇳🇿",tz:"Pacific/Auckland",u:"2026-11-18T11:00:00Z",z:"NZDT"},
 {k:"au",n:"澳大利亚东部",f:"🇦🇺",tz:"Australia/Sydney",u:"2026-11-18T13:00:00Z",z:"AEDT"},

 {k:"th",n:"泰国 · 印尼",f:"🇹🇭",tz:"Asia/Bangkok",u:"2026-11-18T17:00:00Z",z:"UTC+7"},

const guess={"Asia/Shanghai":"hk","Asia/Hong_Kong":"hk","Asia/Taipei":"hk","Asia/Singapore":"hk","Asia/Kuala_Lumpur":"hk","Asia/Macau":"hk","Asia/Chongqing":"hk","Asia/Urumqi":"hk",
 "Asia/Tokyo":"jp","Asia/Seoul":"jp","Pacific/Auckland":"nz","Australia/Sydney":"au","Australia/Melbourne":"au","Asia/Bangkok":"th","Asia/Jakarta":"th","Asia/Kolkata":"in",
 "Asia/Dubai":"ae","Asia/Riyadh":"sa","Europe/Istanbul":"sa","Europe/London":"uk","Europe/Dublin":"uk","Europe/Lisbon":"uk","America/Sao_Paulo":"br","America/Mexico_City":"mx"};

if(!R.find(r=>r.k===sel))sel="hk";

// ---------- UI ----------
const $=id=>document.getElementById(id);
const fmt=(t,tz,o)=>new Intl.DateTimeFormat("zh-CN",Object.assign({timeZone:tz,hour12:false},o)).format(t);
const regBox=$("regions"),track=$("track");
R.forEach((r,i)=>{
  const b=document.createElement("button");b.className="chip";b.dataset.k=r.k;b.textContent=r.f+" "+r.n;
  b.onclick=()=>pick(r.k);regBox.appendChild(b);r.chip=b;
  const n=document.createElement("div");n.className="node";n.style.left=((r.t-W0)/(W1-W0)*100)+"%";
  n.title=r.n;n.innerHTML="<i>"+r.f+"</i>";n.onclick=()=>pick(r.k);track.appendChild(n);r.node=n;
});
let first=true;function pick(k){sel=k;store.set("gta6-region",k);R.forEach(r=>{r.chip.classList.toggle("on",r.k===k);r.node.classList.toggle("sel",r.k===k)});
  try{const c=cur().chip;regBox.scrollTo({left:c.offsetLeft-regBox.clientWidth/2+c.offsetWidth/2,behavior:first?"auto":"smooth"})}catch(e){}first=false;last={};render(true)}

function cells(el,n){while(el.children.length<n){const c=document.createElement("div");c.className="cell";c.innerHTML="<span></span>";el.appendChild(c)}
  while(el.children.length>n)el.removeChild(el.lastChild)}
let last={};
function setDigits(id,str){const el=$(id);cells(el,str.length);
  [...str].forEach((ch,i)=>{const c=el.children[i],key=id+i;if(last[key]===ch)return;
    const old=c.querySelector("span:not(.out)");const s=document.createElement("span");s.textContent=ch;
    if(last[key]!==undefined&&old){old.className="out";s.className="in";setTimeout(()=>old.remove(),430)}else if(old)old.remove();
    c.appendChild(s);last[key]=ch});}

// ---------- scene state ----------
let P=0, Pnight=0, launched=false;
function progressOf(now,T){ // nonlinear road: first 60% = history, last 40% = final 30 days
  const F=T-30*864e5; if(now<=START)return 0; if(now>=T)return 1;
  if(now<F)return .6*(now-START)/(F-START); return .6+.4*(now-F)/(T-F);}

function render(force){
  const now=Date.now(),r=cur(),T=r.t,left=Math.max(0,T-now);
  launched=left<=0;document.body.classList.toggle("launched",launched);$("ui").classList.toggle("launched",launched);
  const d=Math.floor(left/864e5),h=Math.floor(left%864e5/36e5),m=Math.floor(left%36e5/6e4),s=Math.floor(left%6e4/1e3);
  setDigits("d",String(d).padStart(2,"0"));setDigits("h",String(h).padStart(2,"0"));setDigits("m",String(m).padStart(2,"0"));setDigits("s",String(s).padStart(2,"0"));
  P=progressOf(now,T);
  const pct=((now-START)/(T-START)*100);
  const loc=fmt(T,r.tz,{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const mine=fmt(T,userTZ,{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
  const clock=fmt(now,r.tz,{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const pre=Date.parse(new Date(T-9*864e5).toISOString()); // PS5 预载：当地 11/10 零点 = 解锁前 9 天
  const preTxt=now<pre?`PS5 预载还有 <b>${Math.ceil((pre-now)/864e5)}</b> 天`:(launched?"":"PS5 预载已开放");
  $("meta").innerHTML=launched?`${r.f} ${r.n} 已于当地 ${loc} 解锁`:
   `${r.f} ${r.n} · 当地 ${loc}（${r.z}）解锁 · 当地现在 ${clock}<br>你的时间：<b>${mine}</b>　${preTxt}　·　旅程已走完 <span class="pct">${Math.min(100,pct).toFixed(4)}%</span>`;
  // wave
  const wp=(now-W0)/(W1-W0);const nowEl=$("now");
  if(wp>=0&&wp<=1){nowEl.style.display="block";nowEl.style.left=(wp*100)+"%"}else nowEl.style.display="none";
  $("fill").style.width=(Math.max(0,Math.min(1,wp))*100)+"%";
  R.forEach(x=>{const lit=now>=x.t;x.node.classList.toggle("lit",lit);x.chip.classList.toggle("done",lit)});
}
pick(sel);setInterval(render,250);

// ---------- canvas scene ----------
const cv=$("sky"),cx=cv.getContext("2d");let W,H,DPR;
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
let city=[],HZ=0,stars=[],birds=[],fw=[];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);build()}
function build(){const r=rnd(42);city=[];let x=-20;const wt=document.querySelector('.wave').getBoundingClientRect().top;const hz=Math.min(H*.64,Math.min(H*.86,wt-22)-H*.1);
  while(x<W+40){const w=14+r()*34,tall=r()<.12;const h=(tall?.22:.06)*H+r()*H*(tall?.12:.09);
    const win=[];for(let yy=hz-h+8;yy<hz-6;yy+=9)for(let xx=x+4;xx<x+w-4;xx+=7)if(r()<.5)win.push([xx,yy,r()]);
    city.push({x,w,h,win,tower:tall&&r()<.5});x+=w+(r()<.3?r()*10:1)}
  stars=Array.from({length:160},()=>[r()*W,r()*H*.5,r()*1.4+.2,r()*6.28]);
  birds=Array.from({length:5},()=>({x:r()*W,y:H*(.18+r()*.2),s:.6+r()*.6,v:.15+r()*.25,p:r()*6}));}
addEventListener("resize",resize);resize();

const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function palm(x,base,h,lean,t,sc){cx.save();cx.translate(x,base);cx.fillStyle=cx.strokeStyle="#12051c";
  const sway=Math.sin(t*.0009+x)*0.04;const tx=lean*h+Math.sin(t*.0007+x)*4,ty=-h;
  cx.lineWidth=7*sc;cx.lineCap="round";cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(lean*h*.2,-h*.55,tx,ty);cx.stroke();
  for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.42+sway*(i%2?1:-1)+Math.sin(t*.0012+i)*.03;const L=h*(.42+(i%3)*.06);
    cx.beginPath();cx.moveTo(tx,ty);const ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.55+L*.38;
    cx.quadraticCurveTo(tx+Math.cos(a)*L*.55,ty+Math.sin(a)*L*.6-6*sc,ex,ey);cx.lineWidth=4.2*sc;cx.stroke();
    for(let j=1;j<7;j++){const q=j/7,px=tx+(ex-tx)*q,py=ty+(ey-ty)*q-Math.sin(q*Math.PI)*10*sc;
      cx.lineWidth=1.6*sc;cx.beginPath();cx.moveTo(px,py);cx.lineTo(px+Math.cos(a+1.2)*10*sc*(1-q*.5),py+9*sc);cx.stroke();
      cx.beginPath();cx.moveTo(px,py);cx.lineTo(px+Math.cos(a-1.2)*10*sc*(1-q*.5),py+9*sc);cx.stroke()}}
  cx.restore()}

function frame(t){
  const wt=document.querySelector('.wave').getBoundingClientRect().top; const roadY=Math.min(H*.86,wt-22), hz=Math.min(H*.64,roadY-H*.1);
  // sun position from last-30-day progress
  const q=Math.max(0,(P-.6)/.4);const e=1-Math.pow(1-q,2);
  const sunR=Math.min(W,H)*.15; const sunY=launched?hz+sunR*1.6:(H*.22+(hz+sunR*.25-H*.22)*e);
  const dusk=launched?1:Math.max(0,Math.min(1,(sunY-(hz-sunR*1.2))/(sunR*1.5)));
  // sky
  const top=mix([36,24,92],[10,6,30],dusk),mid=mix([196,64,140],[70,20,90],dusk*.85),low=mix([255,150,80],[255,70,110],dusk*.6);
  let g=cx.createLinearGradient(0,0,0,hz);g.addColorStop(0,rgb(top));g.addColorStop(.55,rgb(mid));g.addColorStop(1,rgb(low));
  cx.fillStyle=g;cx.fillRect(0,0,W,hz+1);

  if(dusk>.2){stars.forEach(s=>{cx.globalAlpha=(dusk-.2)*(.5+.5*Math.sin(t*.002+s[3]));cx.fillStyle="#fff";cx.fillRect(s[0],s[1],s[2],s[2])});cx.globalAlpha=1}
  // sun glow + striped sun

  let gg=cx.createRadialGradient(sx,sunY,sunR*.3,sx,sunY,sunR*3.4);gg.addColorStop(0,"rgba(255,200,120,.55)");gg.addColorStop(1,"rgba(255,80,140,0)");
  cx.fillStyle=gg;cx.fillRect(0,0,W,hz);
  cx.save();cx.beginPath();cx.rect(0,0,W,hz);cx.clip();
  let sg=cx.createLinearGradient(0,sunY-sunR,0,sunY+sunR);sg.addColorStop(0,"#fff3b0");sg.addColorStop(.45,"#ffb347");sg.addColorStop(1,"#ff3d8b");
  cx.fillStyle=sg;cx.beginPath();cx.arc(sx,sunY,sunR,0,7);cx.fill();
  cx.globalCompositeOperation="destination-out";
  for(let i=0;i<8;i++){const yy=sunY+sunR*(.12+i*.12)-((t*.012)%(sunR*.12));const hh=2+i*1.3;cx.fillRect(sx-sunR,yy,sunR*2,hh)}
  cx.restore();cx.globalCompositeOperation="source-over";
  // clouds strips
  cx.fillStyle=`rgba(${mix([255,120,170],[90,30,110],dusk).join(",")},.35)`;
  for(let i=0;i<5;i++){const y=H*(.12+i*.07),off=(t*.004*(i+1))%(W+400);cx.beginPath();cx.ellipse((W+200-off+i*230)%(W+400)-200,y,170-i*18,7+i,0,0,7);cx.fill()}
  // birds
  if(!launched)birds.forEach(b=>{b.x+=b.v;if(b.x>W+30)b.x=-30;const f=Math.sin(t*.008+b.p)*5*b.s;cx.strokeStyle="rgba(30,8,40,.75)";cx.lineWidth=1.6;
    cx.beginPath();cx.moveTo(b.x-9*b.s,b.y-f);cx.quadraticCurveTo(b.x-4*b.s,b.y-2,b.x,b.y);cx.quadraticCurveTo(b.x+4*b.s,b.y-2,b.x+9*b.s,b.y-f);cx.stroke()});
  // city
  const cityCol=rgb(mix([70,22,80],[14,6,32],dusk));
  city.forEach(c=>{cx.fillStyle=cityCol;cx.fillRect(c.x,hz-c.h,c.w,c.h);
    if(c.tower){cx.fillRect(c.x+c.w/2-1,hz-c.h-26,2,26);cx.fillStyle=(Math.floor(t/600)%2)?"#ff3d8b":"#3a0f2a";cx.fillRect(c.x+c.w/2-2,hz-c.h-28,4,4)}
    const on=.15+dusk*.85;c.win.forEach(w=>{if(w[2]<on){cx.fillStyle=w[2]<.33?"rgba(122,247,255,.8)":w[2]<.66?"rgba(255,198,92,.85)":"rgba(255,61,139,.8)";cx.fillRect(w[0],w[1],3,4)}})});
  // sea
  let sea=cx.createLinearGradient(0,hz,0,H);sea.addColorStop(0,rgb(mix([255,120,120],[60,16,80],dusk)));sea.addColorStop(1,rgb(mix([40,14,70],[6,3,18],dusk)));
  cx.fillStyle=sea;cx.fillRect(0,hz,W,H-hz);
  // sun reflection shimmer
  for(let i=0;i<26;i++){const y=hz+4+i*i*.45;if(y>roadY)break;const w=sunR*(1.4-i*.03)*(.6+.4*Math.sin(t*.003+i*1.7));
