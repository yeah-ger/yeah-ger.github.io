*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07020f;color:#fff;overflow:hidden;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#bv,#bvt{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s;pointer-events:none}
#bvt{background:linear-gradient(180deg,rgba(60,14,110,.55),rgba(150,30,120,.25) 45%,rgba(0,0,0,0) 70%);mix-blend-mode:screen}
body.vid #bv,body.vid #bvt{opacity:1}
.top{position:fixed;left:0;right:0;top:0;padding:max(16px,env(safe-area-inset-top)) 18px 0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:3}
.kick{font:10px/1 "Anton";letter-spacing:.55em;color:#ffe3c9;opacity:.75;margin-left:.55em}
.title{font:clamp(30px,8.4vw,76px)/.9 "Anton";margin-top:7px;letter-spacing:.02em;
 background:linear-gradient(180deg,#fff6d6,#ffc65c 30%,#ff6a3d 55%,#ff3d8b 78%,#b03cff);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 rgba(20,0,40,.6)) drop-shadow(0 0 22px rgba(255,61,139,.5))}
.title i{font-style:normal;display:inline-block;font-size:1.35em;transform:skewX(-8deg);margin-left:.06em;
 background:linear-gradient(160deg,#2de2d4,#7af7ff 40%,#ff3d8b 75%,#ffc65c);-webkit-background-clip:text;background-clip:text}
.when{margin-top:8px;font-size:11.5px;letter-spacing:.18em;color:#ffd9ec;opacity:.85;text-shadow:0 1px 6px #000}
.when b{color:#7af7ff;font-weight:600}

/* dashboard */
.dash{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 6px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.cluster{position:relative;width:min(680px,100%);aspect-ratio:1.72/1;border-radius:999px 999px 26px 26px;

<script>
(()=>{
const $=id=>document.getElementById(id);
const T=Date.UTC(2026,10,18,16,0,0);          // 2026-11-19 00:00 北京时间
const START=Date.UTC(2023,11,4,23,0,0);       // 首支预告
let off=0; // for testing: ?t=seconds-left
try{const q=new URLSearchParams(location.search).get("t");if(q!==null)off=T-Number(q)*1e3-Date.now()}catch(e){}
const now=()=>Date.now()+off;

// ---------- canvas ----------
const cv=$("c"),cx=cv.getContext("2d");let W,H,DPR,HZ;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  // iOS 主屏幕 Web App：视口比屏幕少一截状态栏高度，底部会露黑边 → 按整屏铺满

function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
let city=[],stars=[],hills=[],cityW=1;
function build(){const r=rnd(7);city=[];let x=-40;
  while(x<W*2+80){const w=10+r()*30,tall=r()<.13,h=(tall?.13:.03)*H+r()*H*(tall?.08:.05),win=[];
    for(let yy=6;yy<h-4;yy+=7)for(let xx=3;xx<w-3;xx+=5)if(r()<.45)win.push([xx,yy,r()]);
    city.push({x,w,h,win,ant:tall&&r()<.5});x+=w+(r()<.25?r()*8:1)}
  cityW=x;
  stars=Array.from({length:150},()=>[r()*W,r()*HZ*.85,r()*1.3+.2,r()*6.3]);
  hills=Array.from({length:9},(_,i)=>[i/8,.04+r()*.05])}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,300));setTimeout(resize,500);

// road
const SEG=200,RW=2200,LEN=1600,DRAW=150,CAMH=950,DEPTH=.84;
const curveAt=n=>Math.sin(n/97)*2.2+Math.sin(n/41+1)*1.2+Math.sin(n/233)*1.6;
const HIST=["1997 · GTA 初代问世","1999 · GTA 2","2001 · GTA III 闯入 3D","2002 · 罪恶都市","2004 · 圣安地列斯","2008 · GTA IV","2013 · GTA V","2023.12.05 · VI 首支预告","2025.05.06 · VI 第二支预告","2026.11.19 · 欢迎来到雷奥尼达"];
let pos=0,bgX=0,speed=-1,dash=0;

const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),rgb=c=>`rgb(${c})`;
function quad(c,x1,y1,w1,x2,y2,w2){cx.fillStyle=c;cx.beginPath();cx.moveTo(x1-w1,y1);cx.lineTo(x2-w2,y2);cx.lineTo(x2+w2,y2);cx.lineTo(x1+w1,y1);cx.closePath();cx.fill()}

function palm(x,y,s,t){cx.save();cx.translate(x,y);cx.scale(s,s);cx.strokeStyle="#0d0418";cx.lineCap="round";
  cx.lineWidth=9;cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(14,-130,26,-260);cx.stroke();
  for(let i=0;i<8;i++){const a=-Math.PI/2+(i-3.5)*.48+Math.sin(t*.001+i)*.04,L=95+(i%3)*14;
    cx.lineWidth=7;cx.beginPath();cx.moveTo(26,-260);const ex=26+Math.cos(a)*L,ey=-260+Math.sin(a)*L*.5+L*.42;
    cx.quadraticCurveTo(26+Math.cos(a)*L*.55,-268+Math.sin(a)*L*.55,ex,ey);cx.stroke()}
  cx.restore()}
function lamp(x,y,s,side){cx.save();cx.translate(x,y);cx.scale(s,s);cx.fillStyle="#140726";cx.fillRect(-4,-300,8,300);
  cx.fillRect(side>0?-70:0,-300,70,7);const hx=side>0?-66:66;
  const g=cx.createRadialGradient(hx,-290,0,hx,-290,90);g.addColorStop(0,"rgba(255,210,150,.95)");g.addColorStop(.15,"rgba(255,140,190,.45)");g.addColorStop(1,"rgba(255,61,139,0)");
  cx.fillStyle=g;cx.beginPath();cx.arc(hx,-290,90,0,7);cx.fill();cx.restore()}
function board(x,y,s,txt,hot){cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle="#120623";cx.fillRect(-6,-200,12,200);cx.fillRect(-150,-330,300,140);
  cx.strokeStyle=hot?"#ffc65c":"#ff3d8b";cx.lineWidth=6;cx.shadowColor=cx.strokeStyle;cx.shadowBlur=24;cx.strokeRect(-140,-320,280,120);cx.shadowBlur=0;
  cx.fillStyle=hot?"#ffe9a8":"#ffe3f0";cx.textAlign="center";cx.textBaseline="middle";
  cx.font=`700 ${txt.length>8?30:38}px -apple-system,"PingFang SC",sans-serif`;cx.fillText(txt,0,-260);cx.restore()}

let fw=[];
const bv=$("bv");let VID=false;
bv.addEventListener("playing",()=>{if(!VID){VID=true;document.body.classList.add("vid");resize()}});
const tryPlay=()=>{const p=bv.play();p&&p.catch(()=>{})};tryPlay();addEventListener("touchstart",tryPlay,{once:true});
function frame(ts){
  const t=ts||0,n=now(),left=T-n,done=left<=0;
  // target speed: cruise 88 → 320 in final 30 days, 360 final minute
  const k=Math.max(0,Math.min(1,1-left/(30*864e5)));
  let target=done?40:left<60e3?360:88+232*Math.pow(k,1.6);
  if(speed<0)speed=target;
  speed+=(target-speed)*.025;
  const dt=Math.min(.05,(t-(frame.l||t))/1000);frame.l=t;
  pos+=speed*dt*55;
  // sky colors: dusk early → deep night near launch → sunrise after
  const night=done?.2:Math.min(1,.35+k*.65);
  const top=mix([40,22,96],[8,4,26],night),mid=mix([206,70,140],[60,16,92],night),low=mix([255,156,86],[255,64,120],night*.7);
  if(VID){cx.clearRect(0,0,W,H);bv.playbackRate=Math.max(.5,Math.min(2.5,speed/110))}
  if(!VID){
  let g=cx.createLinearGradient(0,0,0,HZ);g.addColorStop(0,rgb(top));g.addColorStop(.6,rgb(mid));g.addColorStop(1,rgb(low));
  cx.fillStyle=g;cx.fillRect(0,0,W,HZ+2);
  stars.forEach(s=>{cx.globalAlpha=night*(.4+.6*Math.sin(t*.002+s[3]));cx.fillStyle="#fff";cx.fillRect(s[0],s[1],s[2],s[2])});cx.globalAlpha=1;
  // sun
  const sr=Math.min(W,H)*.15,sx=W/2-bgX*.15%W*0,sy=HZ-sr*.25;
  let gg=cx.createRadialGradient(sx,sy,sr*.3,sx,sy,sr*3.2);gg.addColorStop(0,"rgba(255,190,120,.55)");gg.addColorStop(1,"rgba(255,61,139,0)");cx.fillStyle=gg;cx.fillRect(0,0,W,HZ);
  cx.save();cx.beginPath();cx.rect(0,0,W,HZ);cx.clip();
  let sg=cx.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,"#fff3b0");sg.addColorStop(.45,"#ffb347");sg.addColorStop(1,"#ff3d8b");
  cx.fillStyle=sg;cx.beginPath();cx.arc(sx,sy,sr,0,7);cx.fill();

  for(let i=0;i<7;i++){const yy=sy-sr*.05+i*sr*.13+((t*.01)%(sr*.13));cx.fillRect(sx-sr,yy,sr*2,2+i*1.4)}
  cx.restore();
  // hills + city (parallax with curves)
  const hc=rgb(mix([96,30,110],[30,10,58],night));cx.fillStyle=hc;cx.beginPath();cx.moveTo(0,HZ);
  for(let x=0;x<=W;x+=8){const u=(x+bgX*.3)/W;cx.lineTo(x,HZ-H*(.035+.03*Math.sin(u*6.2)+.02*Math.sin(u*17+1)))}cx.lineTo(W,HZ);cx.fill();
  const cc=rgb(mix([62,18,76],[12,5,30],night)),cw=cityW,ox=((bgX*.6)%cw+cw)%cw;
  city.forEach(c=>{let x=c.x-ox;if(x<-60)x+=cw;if(x>W+40)return;cx.fillStyle=cc;cx.fillRect(x,HZ-c.h,c.w,c.h);
    if(c.ant){cx.fillRect(x+c.w/2-1,HZ-c.h-18,2,18);cx.fillStyle=(Math.floor(t/600)%2)?"#ff3d8b":"#3a0f2a";cx.fillRect(x+c.w/2-2,HZ-c.h-20,4,4)}
    const on=.2+night*.8;c.win.forEach(w=>{if(w[2]<on){cx.fillStyle=w[2]<.3?"rgba(122,247,255,.8)":w[2]<.65?"rgba(255,198,92,.85)":"rgba(255,61,139,.8)";cx.fillRect(x+w[0],HZ-c.h+w[1],2,3)}})});
  // ground
  let gr=cx.createLinearGradient(0,HZ,0,H);gr.addColorStop(0,rgb(mix([70,20,80],[22,6,44],night)));gr.addColorStop(1,"#07020f");cx.fillStyle=gr;cx.fillRect(0,HZ,W,H-HZ);
  }
  // road projection
  const base=Math.floor(pos/SEG),pct=(pos%SEG)/SEG;
  let x=0,dx=-curveAt(base)*pct,maxy=H;const P=[];
  for(let i=0;i<DRAW;i++){const nIdx=base+i,z=i*SEG-pos%SEG+1;
    const sc=DEPTH/Math.max(1,z)*1.0;const X=W/2-x*sc*W/2,Y=HZ+sc*CAMH*H/2*.9,Wd=sc*RW*W/2;
    P.push({X,Y,Wd,sc,n:nIdx,clip:maxy});x+=dx;dx+=curveAt(nIdx)*1.0;}
  bgX+=curveAt(base)*speed*dt*.9;
  if(!VID)for(let i=DRAW-1;i>0;i--){const a=P[i-1],b=P[i];if(b.Y>=a.Y)continue;
    const alt=Math.floor(b.n/3)%2,fog=Math.min(1,i/DRAW*1.4);
    const shade=c=>rgb(mix(c,[60,18,80],fog*.8));
    quad(shade(alt?[26,8,46]:[20,6,38]),a.X,a.Y,a.Wd*3,b.X,b.Y,b.Wd*3);
    quad(alt?shade([255,61,139]):shade([122,247,255]),a.X,a.Y,a.Wd*1.12,b.X,b.Y,b.Wd*1.12);
    quad(shade(alt?[34,22,62]:[30,19,56]),a.X,a.Y,a.Wd,b.X,b.Y,b.Wd);
    if(alt){quad(shade([255,230,245]),a.X,a.Y,a.Wd*.018,b.X,b.Y,b.Wd*.018);
      quad(shade([200,180,220]),a.X-a.Wd*.5,a.Y,a.Wd*.01,b.X-b.Wd*.5,b.Y,b.Wd*.01);quad(shade([200,180,220]),a.X+a.Wd*.5,a.Y,a.Wd*.01,b.X+b.Wd*.5,b.Y,b.Wd*.01)}}
  // road text far → near
  const dl0=Math.max(0,Math.floor(left/864e5));
  cx.textAlign="center";cx.textBaseline="alphabetic";
  for(let i=DRAW-8;i>=1;i--){const p=P[i];if(p.n%30)continue;const q=P[i+7];if(!q||q.Y>=p.Y)continue;
    const k=p.n/30,txt=k%2?(done?"已解锁 · 出发":(dl0>0?`还有 ${dl0} 天`:"最后 24 小时")):HIST[(k/2)%HIST.length];
    const hgt=p.Y-q.Y;if(hgt<2)continue;const fog=Math.min(1,i/DRAW*1.6);
    cx.save();cx.font='900 100px -apple-system,"PingFang SC",sans-serif';const tw=cx.measureText(txt).width;
    const wid=(p.Wd+q.Wd)*.8;cx.translate((p.X+q.X)/2,p.Y);cx.transform(wid/tw,0,(q.X-p.X)/hgt*0,hgt/86,0,0);
    cx.globalAlpha=1-fog*.85;cx.shadowColor=k%2?"#ffc65c":"#ff3d8b";cx.shadowBlur=18;
    cx.fillStyle=k%2?"#ffe9a8":"#fff0f7";cx.fillText(txt,0,0);cx.restore()}
  // sprites far → near
  const day=Math.floor((n+8*36e5)/864e5),dleft=Math.max(0,Math.ceil(left/864e5));
  if(!VID)for(let i=DRAW-1;i>1;i--){const p=P[i],m=p.n,s=p.Wd/380;if(s<.02)continue;
    if(m%6===0){palm(p.X-p.Wd*1.55,p.Y,s,t);palm(p.X+p.Wd*1.55,p.Y,s*1.05,t)}
    else if(m%6===3){lamp(p.X-p.Wd*1.25,p.Y,s,-1);lamp(p.X+p.Wd*1.25,p.Y,s,1)}}
  // speed streaks
  const sp=Math.max(0,(speed-140)/220);
  if(sp>0){cx.strokeStyle=`rgba(255,220,240,${.18*sp})`;cx.lineWidth=1.2;for(let i=0;i<28;i++){const a=(i*2.399+t*.0003)%6.28,r0=(t*.9*(1+i%3)+i*90)%(Math.max(W,H)*.8);
    const ux=Math.cos(a),uy=Math.abs(Math.sin(a))*.6+.1,r1=r0+40+90*sp;cx.beginPath();cx.moveTo(W/2+ux*r0,HZ+uy*r0);cx.lineTo(W/2+ux*r1,HZ+uy*r1);cx.stroke()}}

  // fireworks after launch
  if(done){if(Math.random()<.05){const fx=W*(.15+Math.random()*.7),fy=H*(.1+Math.random()*.3),c=["#ff3d8b","#7af7ff","#ffc65c","#c04dff"][Math.random()*4|0];
      for(let i=0;i<70;i++){const a=Math.random()*6.28,v=1+Math.random()*3;fw.push({x:fx,y:fy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}}
    fw=fw.filter(p=>(p.l-=.012)>0);fw.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,2.2,2.2)});cx.globalAlpha=1}

  requestAnimationFrame(frame)}

// ---------- dashboard ----------
const svg=$("g"),NS="http://www.w3.org/2000/svg";
const el=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const CX=280,CY=262,R1=232;
svg.innerHTML=`<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#2de2d4"/><stop offset=".55" stop-color="#ff3d8b"/><stop offset="1" stop-color="#ffc65c"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
const arc=(r,a0,a1)=>{const p=a=>[CX+Math.cos(a)*r,CY+Math.sin(a)*r];const[s0,s1]=p(a0),[e0,e1]=p(a1);return `M${s0} ${s1} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${e0} ${e1}`};
const A0=Math.PI*1.04,A1=Math.PI*1.96;
el("path",{d:arc(R1,A0,A1),stroke:"rgba(255,255,255,.08)","stroke-width":14,fill:"none","stroke-linecap":"round"});
for(let i=0;i<=40;i++){const a=A0+(A1-A0)*i/40,big=i%5===0,r0=R1-20,r1=R1-(big?36:27);
  el("line",{x1:CX+Math.cos(a)*r0,y1:CY+Math.sin(a)*r0,x2:CX+Math.cos(a)*r1,y2:CY+Math.sin(a)*r1,stroke:i>32?"#ff3355":"rgba(255,230,245,.55)","stroke-width":big?3:1.4})}
const sArc=el("path",{d:arc(R1,A0,A0+.001),stroke:"url(#sg)","stroke-width":14,fill:"none","stroke-linecap":"round",filter:"url(#gl)"});
const secArc=el("path",{d:"",stroke:"#7af7ff","stroke-width":3,fill:"none","stroke-linecap":"round",opacity:.85});
const needle=el("line",{x1:CX,y1:CY,x2:CX,y2:CY-R1+40,stroke:"#ff3d8b","stroke-width":4,"stroke-linecap":"round",filter:"url(#gl)"});
el("circle",{cx:CX,cy:CY,r:9,fill:"#ff3d8b"});
const odo=$("odo");const cells=[];"00:00:00".split("").forEach(ch=>{const s=document.createElement("span");if(ch===":")s.className="sep";s.textContent=ch;odo.appendChild(s);cells.push(s)});
let ign=0,lastFin="";
function hud(t,left,done){
  // ignition sweep 0→max→value during first 2.2s
  const st=Math.min(1,t/2200);let shown;
  const real=Math.min(1,speed/360);
  if(st<1){const sw=st<.45?st/.45:1-(st-.45)/.55;shown=Math.max(real,Math.sin(sw*Math.PI/2))}else shown=real;
  const a=A0+(A1-A0)*shown;
  sArc.setAttribute("d",arc(R1,A0,Math.max(A0+.001,a)));
  needle.setAttribute("x2",CX+Math.cos(a)*(R1-44));needle.setAttribute("y2",CY+Math.sin(a)*(R1-44));
  const L=Math.max(0,left),d=Math.floor(L/864e5),h=Math.floor(L%864e5/36e5),m=Math.floor(L%36e5/6e4),s=Math.floor(L%6e4/1e3),ms=L%6e4/6e4;
  secArc.setAttribute("d",arc(R1-48,A0,A0+(A1-A0)*(1-ms)+.001));
  $("days").textContent=st<1?String(Math.round(d*Math.min(1,st*1.3))).padStart(2,"0"):String(d).padStart(2,"0");
  const str=[h,m,s].map(v=>String(v).padStart(2,"0")).join(":");str.split("").forEach((c,i)=>{if(cells[i].textContent!==c)cells[i].textContent=c});
  $("spd").textContent=Math.round(st<1?shown*360:speed);
  const tot=(T-START),p=Math.max(0,Math.min(100,L/tot*100));$("pct").textContent=(p<1?p.toFixed(2):p.toFixed(1))+"%";
  const lv=[30*864e5,9*864e5,864e5,36e5];lv.forEach((v,i)=>$("l"+(i+1)).classList.toggle("on",done||L<=v));
  document.body.classList.toggle("on",t>300);
  document.body.classList.toggle("done",done);
  const fin=!done&&L<=60e3;document.body.classList.toggle("fin",fin);document.body.classList.toggle("shake",!done&&L<=10e3);
  if(fin){const v=String(Math.ceil(L/1e3));if(v!==lastFin){lastFin=v;const f=$("final");f.textContent=v;f.classList.remove("pop");void f.offsetWidth;f.classList.add("pop")}}
  if(done&&!frame.flashed){frame.flashed=1;const f=$("flash");f.style.transition="none";f.style.opacity=1;requestAnimationFrame(()=>{f.style.transition="opacity 1.2s";f.style.opacity=0})}
}
resize();requestAnimationFrame(frame);
})();
</script>
