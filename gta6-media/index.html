<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000">
<link rel="apple-touch-icon" href="icon.png">
<title>GTA VI 官方媒体原图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b0d;--fg:#f2f0ec;--mute:#8d8a85;--line:rgba(255,255,255,.09);--pink:#ff5ca8;--gut:max(16px,env(safe-area-inset-left));--gutr:max(16px,env(safe-area-inset-right))}
html,body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lat{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
/* hero */
.hero{position:relative;height:min(78vh,760px);min-height:460px;overflow:hidden;background:#000}
.hero picture,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.35) 0,rgba(11,11,13,0) 28%,rgba(11,11,13,.25) 55%,var(--bg) 100%)}
.hero .in{position:absolute;z-index:1;left:var(--gut);right:var(--gutr);bottom:28px;max-width:1240px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hero h1{font-size:clamp(56px,13vw,132px);line-height:.88;font-weight:900;letter-spacing:-.035em;margin:10px 0 12px;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero .sub{font-size:clamp(17px,2.6vw,22px);font-weight:600;letter-spacing:.02em}
.stats{display:flex;gap:22px;margin:16px 0 20px;flex-wrap:wrap}
.stats div{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.06em}
.stats b{display:block;font-size:22px;line-height:1.1;color:#fff;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;border:0;font-size:15px;font-weight:600}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.pri{background:#fff;color:#000}
.btn.sec{background:rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn.sec.on{background:var(--pink);color:#fff}
.cta small{font-size:12px;color:rgba(255,255,255,.6)}
/* nav */
nav{position:sticky;top:0;z-index:3;background:rgba(11,11,13,.86);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav .in{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gutr) 10px var(--gut);scrollbar-width:none;max-width:1272px;margin:0 auto}
nav .in::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--mute);height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:600;white-space:nowrap}
nav button i{font-style:normal;font-weight:500;font-size:11px;margin-left:5px;opacity:.6;font-variant-numeric:tabular-nums}
nav button.on{background:var(--fg);color:#000}
/* content */
main{max-width:1272px;margin:0 auto;padding:0 var(--gutr) calc(40px + env(safe-area-inset-bottom)) var(--gut)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:36px 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh .no{font-size:13px;font-weight:700;color:var(--pink);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.sh h2{font-size:clamp(28px,5vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.sh .en{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.sh .meta{text-align:right;font-size:12px;color:var(--mute);line-height:1.6;flex:none;font-variant-numeric:tabular-nums}
.sh .sb{display:flex;gap:6px;justify-content:flex-end}
.sh .sl{display:block;font-size:11px;margin-top:4px;opacity:.75}
.sh .meta button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.sh .meta button{margin-top:8px;height:34px;padding:0 14px;font-size:13px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.gs{display:grid;grid-template-columns:repeat(2,1fr);column-gap:6px;grid-auto-flow:dense}
.grp{padding-top:22px;min-width:0;grid-column:1/-1}
.grp.k1{grid-column:span 1}
.k1 .g{grid-template-columns:1fr}
@media(min-width:640px){.gs{grid-template-columns:repeat(3,1fr);column-gap:8px}.grp.k2{grid-column:span 2}.k2 .g{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.gs{grid-template-columns:repeat(4,1fr)}.grp.k3{grid-column:span 3}.k3 .g{grid-template-columns:repeat(3,1fr)}}
.gh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.gh h3{font-size:16px;font-weight:700;letter-spacing:.01em}
.gh span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gh:after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;grid-auto-flow:dense}
@media(min-width:640px){.g{grid-template-columns:repeat(3,1fr);gap:8px}}
@media(min-width:1000px){.g{grid-template-columns:repeat(4,1fr)}}
.c{position:relative;background:#16161a;cursor:pointer;overflow:hidden;border-radius:6px;aspect-ratio:16/9;content-visibility:auto;contain-intrinsic-size:auto 120px}
.c.f{grid-column:span 2;grid-row:span 2}
@media(max-width:639px){.c.l{grid-column:span 2}}
.c.art{aspect-ratio:4/5}
.c.art.f{aspect-ratio:auto}
@media(max-width:639px){.c.art.l{aspect-ratio:8/5}}
.c img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
@media(hover:hover){.c img{transition:transform .5s,opacity .3s}.c:hover img{transform:scale(1.03)}}
.c b{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.c b i{display:block;font-style:normal;font-weight:400;font-size:10px;opacity:.7;margin-top:1px}
footer{max-width:1272px;margin:0 auto;padding:28px var(--gutr) calc(36px + env(safe-area-inset-bottom)) var(--gut);border-top:1px solid var(--line);color:var(--mute);font-size:12px;line-height:1.8}
footer kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}
/* viewer */
.v{position:fixed;inset:0;z-index:9;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.v.open{display:block}
.st{position:absolute;inset:0;overflow:hidden}
.st img{position:absolute;left:0;top:0;max-width:none;max-height:none;-webkit-user-drag:none}
.ui{position:absolute;left:0;right:0;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));transition:opacity .2s}
.top{top:0;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:28px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.bot{bottom:0;padding-top:36px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.v.hide .ui,.v.hide #ld{opacity:0;pointer-events:none}
.ttl{flex:1;min-width:0;line-height:1.3}
.ttl b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:11px;color:rgba(255,255,255,.65);letter-spacing:.04em}
#ct{font-size:12px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.big{width:56px;height:56px;border-radius:28px;background:#fff;color:#000}
.ib.big svg{width:22px;height:22px;fill:currentColor;stroke:none}
.trans{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{height:30px;padding:0 12px;border-radius:15px;border:0;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.chip.on{background:#fff;color:#000}
.sep{width:1px;height:16px;background:rgba(255,255,255,.2);margin:0 4px}
#inf{display:block;text-align:center;font-size:11px;color:rgba(255,255,255,.55);margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.vars{display:contents}
.vars .chip{height:26px;font-size:11px;padding:0 9px}
#ld{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));font-size:11px;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:4px 10px;border-radius:11px;white-space:nowrap;transition:opacity .2s}
@media(min-width:900px){.bot{display:flex;align-items:center;justify-content:space-between;gap:16px}.trans{margin:0;order:2}.tools{order:1;justify-content:flex-start;flex:1}#inf{order:3;flex:1;text-align:right;margin:0}}
</style>
</head>
<body>
<section class="hero">
  <picture><source media="(max-aspect-ratio:3/4)" srcset="hero-m.webp"><img src="hero.webp" alt="" fetchpriority="high"></picture>
  <div class="in">
    <div class="eyebrow">Official Media · Rockstar Games</div>
    <h1 class="lat">GTA <em>VI</em></h1>
    <div class="sub">官方媒体原图库</div>
    <div class="stats" id="sum"></div>
    <div class="cta">
      <button class="btn pri" id="pa"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>播放全部</button>
      <button class="btn sec" id="om">顺序</button>
      <small>每张 10 秒 · 全部内循环</small>
    </div>
  </div>
</section>
<nav><div class="in" id="nav"></div></nav>
<main id="main"></main>
<footer>点开即为官方原始 JPG，逐字节未改动；列表中的缩略图仅供浏览。<br>键盘 <kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>空格</kbd> 放映 · <kbd>F</kbd> 全屏 · <kbd>Z</kbd> 1:1 · <kbd>Esc</kbd> 关闭<br>图片版权归 Rockstar Games 所有 · 来源 rockstargames.com/VI/media</footer>

<div class="v" id="v">
  <div class="st" id="st"><img id="lo" alt=""><img id="hi" alt=""></div>
  <div class="ui top">
    <button class="ib" id="bx" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ttl" id="tt"></div><div id="ct"></div>
  </div>
  <div class="ui bot">
    <div class="trans">
      <button class="ib" id="bp" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ib big" id="bs" aria-label="放映"></button>
      <button class="ib" id="bn" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="tools">
      <button class="chip" id="bsc">全部循环</button><button class="chip" id="bo">顺序</button><button class="chip" id="bf">自动</button><button class="chip" id="bz">1:1</button><button class="chip" id="bfs">全屏</button><a id="bd" download class="chip">下载原图</a>
      <span class="vars" id="vars"></span>
    </div>
    <span id="inf"></span>
  </div>
  <div id="ld"></div>
</div>

<script>
'use strict';
var M, flat = [], secStart = [], cur = -1, curVar = null, manualVar = false, fit = 'auto';
var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
var $ = function (id) { return document.getElementById(id); };
var V = $('v'), ST = $('st'), LO = $('lo'), HI = $('hi');
function mb(b) { return (b / 1048576).toFixed(1) + ' MB'; }

fetch('manifest.json').then(function (r) { return r.json(); }).then(init).catch(function () { $('sum').textContent = '清单加载失败，请刷新'; });

function init(m) {
  M = m;
  var nItems = 0; m.sections.forEach(function (s) { s.groups.forEach(function (g) { nItems += g.items.length; }); });
  $('sum').innerHTML = '<div><b>' + nItems + '</b>作品</div><div><b>' + m.count + '</b>原始文件</div><div><b>' + (m.bytes / 1073741824).toFixed(2) + ' GB</b>零压缩</div><div><b>4K</b>最高 5120 px</div>';
  var nav = $('nav'), main = $('main');
  m.sections.forEach(function (s, si) {
    var b = document.createElement('button'), n = 0; s.groups.forEach(function (g) { n += g.items.length; }); s.n = n; b.innerHTML = s.zh + '<i>' + n + '</i>'; b.onclick = function () { location.hash = 's' + si; showSec(si); };
    nav.appendChild(b);
    secStart.push(flat.length);
    s.groups.forEach(function (g) { g.items.forEach(function (it) { flat.push({ s: si, g: g, it: it }); }); });
  });
  secStart.push(flat.length);
  window.addEventListener('hashchange', route);
  route();
}
function route() {
  var h = location.hash, m;
  if ((m = h.match(/^#v(\d+)$/)) && flat[+m[1]]) { if (!M.sections[flat[+m[1]].s].rendered) showSec(flat[+m[1]].s); openV(+m[1]); return; }
  if (V.classList.contains('open')) closeV(true);
  var si = (m = h.match(/^#s(\d+)$/)) ? +m[1] : (M.cur || 0);
  if (si !== M.cur || !M.sections[si].rendered) showSec(si);
}
function showSec(si) {
  if (!M.sections[si]) si = 0;
  M.cur = si;
  [].forEach.call($('nav').children, function (b, i) { b.classList.toggle('on', i === si); });
  var main = $('main'), s = M.sections[si], html = '', idx = secStart[si];
  M.sections.forEach(function (x) { x.rendered = false; }); s.rendered = true;
  var bytes = 0; s.groups.forEach(function (g) { g.items.forEach(function (it) { it.v.forEach(function (v) { bytes += v.s; }); }); });
  html += '<div class="sh"><div><div class="no">' + ('0' + (si + 1)).slice(-2) + ' / ' + ('0' + M.sections.length).slice(-2) + '</div><h2>' + s.zh + '</h2><div class="en">' + s.en + '</div></div>'
    + '<div class="meta">' + s.groups.length + ' 组 · ' + s.n + ' 张<br>' + mb(bytes) + '<div class="sb"><button onclick="slideSec(' + si + ')">▶ 放映本区</button><button class="os" onclick="togSec()"></button></div><small class="sl">本区内循环</small></div></div>';
  html += '<div class="gs">';
  s.groups.forEach(function (g) {
    html += '<div class="grp' + (g.items.length < 4 ? ' k' + g.items.length : '') + '"><div class="gh"><h3 class="lat">' + g.name + '</h3><span>' + g.items.length + '</span></div><div class="g">';
    var n = g.items.length, nf = (n >= 5 ? 1 : 0) + (n >= 12 ? Math.floor((n - 1) / 9) : 0);
    g.items.forEach(function (it, k) {
      var v = it.v[0], feat = n >= 5 && k === 0 || (n >= 12 && k % 9 === 0);
      if (!feat && k === n - 1 && (n - nf) % 2) feat = 'l';
      if (s.multi) { var p = null; it.v.forEach(function (x) { if (!p && x.k === 'portrait') p = x; }); if (feat) p = null; v = p || it.v[0]; }
      var cls = 'c' + (s.multi ? ' art' : '') + (feat === 'l' ? ' l' : feat ? ' f' : '');
      html += '<div class="' + cls + '" data-i="' + idx + '"><img loading="lazy" decoding="async" src="' + thumb(v) + '" alt="">'
        + (it.n ? '<b>' + it.n + (it.v.length > 1 ? '<i>' + it.v.length + ' 种尺寸</i>' : '') + '</b>' : '') + '</div>';
      idx++;
    });
    html += '</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
  syncUI();
  main.onclick = function (e) { var c = e.target.closest('.c'); if (c) location.hash = 'v' + c.dataset.i; };
  var top = document.querySelector('.hero').offsetHeight; if (scrollY > top) window.scrollTo(0, top);
}

/* ---------- viewer ---------- */
var cache = {};   // url -> Image, max 3 originals kept (memory safety on phones)
var view = { s: 1, x: 0, y: 0, nw: 0, nh: 0, base: 1 };
var hideT, playT = null, playing = false, wake = null, loadTok = 0, planNext = 0, deck = [];
// two independent playback settings: 'all' = loop all sections, 'sec' = loop only the current image's section
var orders = { all: 'seq', sec: 'seq' }, scope = 'all';
try { if (localStorage.getItem('gta6order') === 'rnd') orders.all = 'rnd'; if (localStorage.getItem('gta6orderSec') === 'rnd') orders.sec = 'rnd'; if (localStorage.getItem('gta6scope') === 'sec') scope = 'sec'; } catch (e) {}
function lbl(o) { return o === 'rnd' ? '随机' : '顺序'; }
function syncUI() {
  var b = $('om'); b.textContent = lbl(orders.all); b.classList.toggle('on', orders.all === 'rnd');
  [].forEach.call(document.querySelectorAll('.os'), function (x) { x.textContent = lbl(orders.sec); x.classList.toggle('on', orders.sec === 'rnd'); });
  b = $('bo'); b.textContent = lbl(orders[scope]); b.classList.toggle('on', orders[scope] === 'rnd');
  b = $('bsc'); b.textContent = scope === 'sec' ? '本区循环' : '全部循环';
}
function setOrder(which, o) { orders[which] = o; deck = []; try { localStorage.setItem(which === 'sec' ? 'gta6orderSec' : 'gta6order', o); } catch (e) {} syncUI(); if (cur >= 0) plan(); }
function setScope(sc) { scope = sc; deck = []; try { localStorage.setItem('gta6scope', sc); } catch (e) {} syncUI(); if (cur >= 0) { plan(); show(); } }
function range() { if (scope === 'sec' && cur >= 0) { var si = flat[cur].s; return [secStart[si], secStart[si + 1]]; } return [0, flat.length]; }
function plan() {
  var r = range(), n = r[1] - r[0];
  if (orders[scope] === 'rnd' && n > 1) {
    deck = deck.filter(function (i) { return i >= r[0] && i < r[1] && i !== cur; });
    if (!deck.length) { for (var i = r[0]; i < r[1]; i++) if (i !== cur) deck.push(i);
      for (var j = deck.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), t = deck[j]; deck[j] = deck[k]; deck[k] = t; } }
    planNext = deck[deck.length - 1];
  } else planNext = r[0] + (cur - r[0] + 1) % n;
}

function screenAR() { return innerWidth / innerHeight; }
function pickVar(it) {
  if (it.v.length === 1) return it.v[0];
  if (manualVar && curVar && it.v.indexOf(curVar) >= 0) return curVar;
  var ar = screenAR(), best = null, bd = 9;
  it.v.forEach(function (v) { if (v.logo) return; var d = Math.abs(Math.log((v.w / v.h) / ar)); if (d < bd) { bd = d; best = v; } });
  return best || it.v[0];
}
function openV(i) {
  var first = !V.classList.contains('open');
  V.classList.add('open'); document.body.style.overflow = 'hidden';
  if (i !== cur) manualVar = false;
  cur = i; show(); if (first) poke();
}
function closeV(fromRoute) {
  stopPlay(); V.classList.remove('open'); document.body.style.overflow = '';
  HI.removeAttribute('src'); LO.removeAttribute('src'); cache = {}; cur = -1;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  if (!fromRoute) history.replaceState(null, '', '#s' + M.cur), route();
}
function src(v) { return 'o/' + v.f; }
function thumb(v) { return 't/' + v.f.replace(/\.jpg$/, '.webp'); }

function load(url) {   // network preload only; the visible <img> decodes the full original itself
  if (cache[url]) return cache[url];
  var im = new Image(), c = { im: im, ok: false };
  im.onload = function () { c.ok = true; }; im.onerror = function () { delete cache[url]; };
  im.src = url; cache[url] = c; return c;
}
function trim(keep) {
  Object.keys(cache).forEach(function (u) { if (keep.indexOf(u) < 0) { cache[u].im.src = ''; delete cache[u]; } });
}
function show() {
  var e = flat[cur], v = curVar = pickVar(e.it), u = src(v), tok = ++loadTok;
  plan();
  var g = e.g, gi = g.items.indexOf(e.it);
  $('tt').innerHTML = '<b class="lat">' + (e.it.n || g.name) + '</b><span>' + M.sections[e.s].zh + (e.it.n ? ' · ' + g.name : '') + '</span>';
  $('ct').innerHTML = (gi + 1) + ' / ' + g.items.length + '<br><span style="opacity:.6">总 ' + (cur + 1) + ' / ' + flat.length + '</span>';
  $('inf').textContent = v.w + ' × ' + v.h + '  ·  ' + mb(v.s) + '  ·  原始 JPG';
  $('bd').href = u; $('bd').setAttribute('download', v.f.split('/').pop());
  var vs = $('vars'); vs.innerHTML = '';
  if (e.it.v.length > 1) e.it.v.forEach(function (x) {
    var b = document.createElement('button'); b.textContent = x.l; b.className = 'chip' + (x === v ? ' on' : '');
    b.onclick = function (ev) { ev.stopPropagation(); manualVar = true; curVar = x; show(); }; vs.appendChild(b);
  });
  view.nw = v.w; view.nh = v.h; resetView();
  HI.style.visibility = 'hidden'; HI.onload = HI.onerror = null;
  LO.src = thumb(v); LO.style.visibility = 'visible';
  $('ld').textContent = '原图加载中 · ' + mb(v.s); $('ld').onclick = null;
  var n = flat[planNext], p = flat[(cur - 1 + flat.length) % flat.length];
  var nu = src(pickVar(n.it)), pu = src(pickVar(p.it));
  trim([u, nu, pu]);
  HI.onload = function () {
    if (tok !== loadTok) return;
    // decode() can stall on some browsers for hidden images, so never wait on it longer than 400 ms
    Promise.race([HI.decode ? HI.decode() : Promise.resolve(), new Promise(function (r) { setTimeout(r, 400); })]).catch(function () {}).then(function () {
      if (tok !== loadTok) return;
      HI.style.visibility = 'visible'; LO.style.visibility = 'hidden';
      $('ld').textContent = '原图 ' + v.w + '×' + v.h;
      load(nu); load(pu);           // keep at most 3 originals around (current + neighbours)
      if (playing) schedule();
    });
  };
  HI.onerror = function () { if (tok === loadTok) { $('ld').textContent = '原图加载失败，点击重试'; $('ld').onclick = show; } };
  if (HI.getAttribute('src') === u && HI.complete && HI.naturalWidth) HI.onload(); else HI.src = u;
  if (location.hash !== '#v' + cur) history.replaceState(null, '', '#v' + cur);
}
function go(d) { if (cur < 0) return; manualVar = false;
  var r = range(), n = r[1] - r[0];
  if (d === 1 && orders[scope] === 'rnd') { if (deck.length && deck[deck.length - 1] === planNext) deck.pop(); cur = planNext; }
  else cur = r[0] + (cur - r[0] + d + n) % n; show(); }

/* layout: base scale = fit into screen (contain/cover); s = extra zoom */
function resetView() { view.s = 1; layout(); }
function layout() {
  var W = innerWidth, H = innerHeight, nw = view.nw, nh = view.nh;
  var cA = Math.min(W / nw, H / nh), cO = Math.max(W / nw, H / nh);
  // auto: fill the whole screen when the crop is small (e.g. 16:9 photo on a 19.5:9 phone), otherwise show it whole
  view.base = fit === 'contain' ? cA : fit === 'cover' ? cO : (cO / cA <= 1.3 ? cO : cA);
  var sc = view.base * view.s, w = nw * sc, h = nh * sc;
  if (view.s === 1) { view.x = (W - w) / 2; view.y = (H - h) / 2; }
  else { view.x = clamp(view.x, W - w, 0, W, w); view.y = clamp(view.y, H - h, 0, H, h); }
  // size the <img> at its on-screen size (no CSS scale transform): Safari then resamples from the full original instead of a downsized layer
  [LO, HI].forEach(function (im) { var st = im.style; st.width = w + 'px'; st.height = h + 'px'; st.left = view.x + 'px'; st.top = view.y + 'px'; });
}
function clamp(p, min, max, W, w) { if (w <= W) return (W - w) / 2; return Math.min(max, Math.max(min, p)); }
function zoomAt(newS, cx, cy) {
  var old = view.base * view.s; newS = Math.max(1, Math.min(newS, 8 / view.base));
  var ns = view.base * newS;
  view.x = cx - (cx - view.x) * ns / old; view.y = cy - (cy - view.y) * ns / old; view.s = newS; layout();
}
function toggle11(cx, cy) { if (view.s > 1.01) resetView(); else zoomAt(1 / view.base, cx === undefined ? innerWidth / 2 : cx, cy === undefined ? innerHeight / 2 : cy); }

/* pointer: swipe, pan, pinch, double-tap */
var pts = {}, gest = null, lastTap = 0;
ST.addEventListener('pointerdown', function (e) {
  ST.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pts);
  if (ids.length === 1) gest = { t: 'one', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, time: Date.now(), moved: false };
  else if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; gest = { t: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; }
});
ST.addEventListener('pointermove', function (e) {
  if (!pts[e.pointerId] || !gest) return;
  pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (gest.t === 'one') {
    var dx = e.clientX - gest.sx, dy = e.clientY - gest.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) gest.moved = true;
    if (view.s > 1.01) { view.x = gest.vx + dx; view.y = gest.vy + dy; layout(); }
  } else if (gest.t === 'pinch') {
    var ids = Object.keys(pts); if (ids.length < 2) return;
    var a = pts[ids[0]], b = pts[ids[1]];
    zoomAt(gest.s * Math.hypot(a.x - b.x, a.y - b.y) / gest.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
  }
});
function up(e) {
  if (!pts[e.pointerId]) return; delete pts[e.pointerId];
  if (!gest) return;
  if (gest.t === 'one' && Object.keys(pts).length === 0) {
    var dx = e.clientX - gest.sx, dy = e.clientY - gest.sy, dt = Date.now() - gest.time;
    if (view.s <= 1.01 && gest.moved && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (view.s <= 1.01 && gest.moved && dy > 90 && Math.abs(dy) > Math.abs(dx) && !playing) closeV();
    else if (!gest.moved && dt < 300) {
      var now = Date.now();
      if (now - lastTap < 300) { toggle11(e.clientX, e.clientY); lastTap = 0; clearTimeout(gest.tt); }
      else { lastTap = now; var g = gest; setTimeout(function () { if (lastTap === now) { V.classList.toggle('hide'); } }, 300); }
    }
  }
  gest = Object.keys(pts).length ? { t: 'one', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, time: Date.now(), moved: true } : null;
}
ST.addEventListener('pointerup', up); ST.addEventListener('pointercancel', up);
ST.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(view.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

/* controls */
$('bx').onclick = function () { closeV(); };
$('bp').onclick = function () { go(-1); }; $('bn').onclick = function () { go(1); };
$('bz').onclick = function () { toggle11(); };
$('bf').onclick = function () { fit = fit === 'auto' ? 'contain' : fit === 'contain' ? 'cover' : 'auto'; this.textContent = { auto: '自动', contain: '完整', cover: '铺满' }[fit]; resetView(); };
$('bfs').onclick = fs;
$('bs').onclick = function () { playing ? stopPlay() : startPlay(); };
$('om').onclick = function () { setOrder('all', orders.all === 'rnd' ? 'seq' : 'rnd'); };
$('bo').onclick = function () { setOrder(scope, orders[scope] === 'rnd' ? 'seq' : 'rnd'); };
$('bsc').onclick = function () { setScope(scope === 'sec' ? 'all' : 'sec'); };
window.togSec = function () { setOrder('sec', orders.sec === 'rnd' ? 'seq' : 'rnd'); };
syncUI(); $('bs').innerHTML = PLAY;
function startAt(sc, r) { scope = sc; try { localStorage.setItem('gta6scope', sc); } catch (e) {} deck = [];
  var i = orders[sc] === 'rnd' ? r[0] + Math.floor(Math.random() * (r[1] - r[0])) : r[0];
  syncUI(); location.hash = 'v' + i; setTimeout(function () { fs(); startPlay(); }, 50); }
$('pa').onclick = function () { startAt('all', [0, flat.length]); };
function fs() {
  var d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else V.classList.add('hide'); // iPhone Safari: no element fullscreen -> hide controls
}
function schedule() {
  clearTimeout(playT);
  playT = setTimeout(function tick() {
    var c = cache[src(pickVar(flat[planNext].it))];
    if (!c) { load(src(pickVar(flat[planNext].it))); playT = setTimeout(tick, 500); }
    else if (!c.ok) playT = setTimeout(tick, 500);
    else go(1);
  }, 10000);
}
function startPlay() {
  playing = true; $('bs').innerHTML = PAUSE; V.classList.add('hide'); schedule();
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
}
function stopPlay() {
  playing = false; clearTimeout(playT); $('bs').innerHTML = PLAY;
  if (wake) { wake.release().catch(function () {}); wake = null; }
}
window.slideSec = function (si) { startAt('sec', [secStart[si], secStart[si + 1]]); };
document.addEventListener('visibilitychange', function () { if (playing && !document.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {}); });
document.addEventListener('keydown', function (e) {
  if (cur < 0) return;
  var k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') go(1);
  else if (k === 'ArrowLeft' || k === 'PageUp') go(-1);
  else if (k === ' ') { e.preventDefault(); playing ? stopPlay() : startPlay(); }
  else if (k === 'f' || k === 'F') fs();
  else if (k === 'z' || k === 'Z') toggle11();
  else if (k === 'h' || k === 'H') V.classList.toggle('hide');
  else if (k === 'Escape' && !(document.fullscreenElement || document.webkitFullscreenElement)) closeV();
});
function poke() { clearTimeout(hideT); hideT = setTimeout(function () { if (cur >= 0 && !matchMedia('(hover:none)').matches) V.classList.add('hide'); }, 3000); }
V.addEventListener('mousemove', function () { if (!playing) { V.classList.remove('hide'); poke(); } });
/* rotation / window resize / external display: refit and re-pick the best wallpaper variant */
var rz; window.addEventListener('resize', function () {
  clearTimeout(rz); rz = setTimeout(function () {
    if (cur < 0) return;
    var it = flat[cur].it;
    if (it.v.length > 1 && !manualVar && pickVar(it) !== curVar) show(); else layout();
  }, 150);
});
</script>
